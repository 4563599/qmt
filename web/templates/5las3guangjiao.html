    <script>
        let stocksData = [];
        let currentDate = null;
        let availableDates = [];
        let currentDateIndex = 0;
        let marketCapCache = {};
        let fetchingMarketCap = {};
        let flatpickrInstance = null;
        let checkUpdateTimer = null;

        // 最近交易日（非交易日时默认显示最近交易日数据）
        let latestTradeDate = new Date().toISOString().split('T')[0];
        async function fetchLatestTradeDate() {
            const todayKey = 'latestTradeDate_' + new Date().toISOString().split('T')[0];
            const cached = localStorage.getItem(todayKey);
            if (cached) { latestTradeDate = cached; return; }
            try {
                const resp = await fetch('/api/latest_trade_date');
                const result = await resp.json();
                if (result.success && result.date) {
                    latestTradeDate = result.date;
                    localStorage.setItem(todayKey, result.date);
                }
            } catch(e) {}
        }
        let refreshRealtimeTimer = null;
        let checkUpdateInterval = 5000;
        let realtimeRefreshInterval = 3000;

        // ---- 市值缓存 ----
        function loadTodayMarketCapCache() {
            const today = new Date().toISOString().split('T')[0];
            const cached = localStorage.getItem(`marketCap_${today}`);
            if (cached) {
                try { marketCapCache = JSON.parse(cached); } catch(e) { marketCapCache = {}; }
            }
        }

        function saveTodayMarketCapCache() {
            const today = new Date().toISOString().split('T')[0];
            try { localStorage.setItem(`marketCap_${today}`, JSON.stringify(marketCapCache)); } catch(e) {}
        }

        // ---- 日期加载 ----
        async function loadDates() {
            loadTodayMarketCapCache();
            await fetchLatestTradeDate();
            try {
                const response = await fetch('/api/5las3gj/dates');
                const result = await response.json();
                const today = latestTradeDate;
                currentDate = today;
                if (result.success && result.dates && result.dates.length > 0) {
                    availableDates = result.dates;
                    currentDateIndex = availableDates.indexOf(today);
                    if (currentDateIndex === -1) currentDateIndex = -1;
                } else {
                    availableDates = [];
                    currentDateIndex = -1;
                }
                initFlatpickr();
                loadStocks();
            } catch(error) {
                console.error('加载日期失败:', error);
                const today = latestTradeDate;
                currentDate = today;
                availableDates = [];
                currentDateIndex = -1;
                initFlatpickr();
                loadStocks();
            }
        }

        function initFlatpickr() {
            flatpickrInstance = flatpickr("#datePicker", {
                enable: availableDates,
                dateFormat: "Y-m-d",
                defaultDate: currentDate,
                locale: {
                    weekdays: {
                        shorthand: ['日','一','二','三','四','五','六'],
                        longhand: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六']
                    },
                    months: {
                        shorthand: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                        longhand: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']
                    }
                },
                onChange: function(selectedDates, dateStr) {
                    if (dateStr && dateStr !== currentDate) {
                        currentDate = dateStr;
                        currentDateIndex = availableDates.indexOf(dateStr);
                        loadStocks();
                    }
                }
            });
        }

        function prevDate() {
            if (currentDateIndex < availableDates.length - 1) {
                currentDateIndex++;
                currentDate = availableDates[currentDateIndex];
                if (flatpickrInstance) flatpickrInstance.setDate(currentDate, false);
                loadStocks();
            }
        }

        function nextDate() {
            if (currentDateIndex > 0) {
                currentDateIndex--;
                currentDate = availableDates[currentDateIndex];
                if (flatpickrInstance) flatpickrInstance.setDate(currentDate, false);
                loadStocks();
            }
        }

        // ---- 数据加载 ----
        async function loadStocks() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('noData').style.display = 'none';
            document.getElementById('stockTable').style.display = 'none';
            try {
                const url = currentDate ? `/api/5las3gj/stocks?date=${currentDate}` : '/api/5las3gj/stocks';
                const response = await fetch(url);
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    stocksData = result.data;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('noData').style.display = 'none';
                    renderTable();
                    fetchMarketCapForZeroStocks();
                    const today = latestTradeDate;
                    if (currentDate === today) await refreshRealtime();
                } else {
                    stocksData = [];
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('noData').style.display = 'block';
                    renderTable();
                }
            } catch(error) {
                console.error('加载数据失败:', error);
                document.getElementById('loading').textContent = '加载失败，请刷新页面重试';
            }
        }

        // ---- 市值获取 ----
        async function fetchMarketCapForZeroStocks() {
            const zeroStocks = stocksData.filter(s => !s.market_cap || s.market_cap === 0);
            for (const stock of zeroStocks) {
                const code = stock.code;
                if (marketCapCache[code]) { stock.market_cap = marketCapCache[code]; continue; }
                if (fetchingMarketCap[code]) continue;
                fetchingMarketCap[code] = true;
                try {
                    const response = await fetch(`/api/5las3gj/market_cap/${code}`);
                    const result = await response.json();
                    if (result.success && result.market_cap) {
                        stock.market_cap = result.market_cap;
                        marketCapCache[code] = result.market_cap;
                        saveTodayMarketCapCache();
                        renderTable();
                    }
                } catch(e) { console.error(`获取市值失败 ${code}:`, e); }
                finally { delete fetchingMarketCap[code]; }
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        // ---- 实时行情 ----
        async function refreshRealtime() {
            const today = latestTradeDate;
            if (currentDate !== today) return;
            if (stocksData.length === 0) return;
            try {
                const codes = stocksData.map(s => s.code);
                const response = await fetch('/api/5las3gj/realtime', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({codes})
                });
                const result = await response.json();
                if (result.success && result.data) {
                    let hasChange = false;
                    stocksData.forEach(stock => {
                        if (result.data[stock.code] !== undefined) {
                            const newChange = result.data[stock.code].change;
                            if (stock.today_change !== newChange) {
                                stock.today_change = newChange;
                                hasChange = true;
                            }
                        }
                    });
                    if (hasChange) renderTable();
                }
            } catch(e) { console.error('实时行情刷新失败:', e); }
        }

        // ---- 渲染表格（按 almost_bare_foot_count_10 分组，由高到低）----
        function renderTable() {
            const tbody = document.getElementById('stockTableBody');
            const table = document.getElementById('stockTable');
            const noData = document.getElementById('noData');
            const loading = document.getElementById('loading');

            tbody.innerHTML = '';

            if (stocksData.length === 0) {
                table.style.display = 'none';
                noData.style.display = 'block';
                loading.style.display = 'none';
                return;
            }

            table.style.display = 'table';
            noData.style.display = 'none';
            loading.style.display = 'none';

            // 按 almost_bare_foot_count_10 分组
            const groups = {};
            stocksData.forEach(stock => {
                const key = stock.almost_bare_foot_count_10 !== undefined
                    ? stock.almost_bare_foot_count_10
                    : (stock.almost_guang_jiao_count || 0);
                if (!groups[key]) groups[key] = [];
                groups[key].push(stock);
            });

            // 由高到低排序分组 key
            const sortedKeys = Object.keys(groups)
                .map(k => parseInt(k))
                .sort((a, b) => b - a);

            let globalIndex = 0;

            sortedKeys.forEach(key => {
                const groupData = groups[key];
                // 组内按涨跌幅降序
                groupData.sort((a, b) => (b.today_change || 0) - (a.today_change || 0));

                // 分组标题行
                const headerRow = document.createElement('tr');
                const headerColor = key >= 3 ? '#7c3aed' : '#374151';
                headerRow.innerHTML = `
                    <td colspan="10" style="background: #F3F4F6; color: ${headerColor}; padding: 12px 15px; font-weight: 700; font-size: 14px; text-align: left; border-bottom: 2px solid #E5E7EB;">
                        几乎光脚次数 = ${key}次 &nbsp;(${groupData.length}只)
                    </td>
                `;
                tbody.appendChild(headerRow);

                groupData.forEach(stock => {
                    globalIndex++;
                    const row = document.createElement('tr');
                    row.addEventListener('mouseenter', (e) => showKline(e, stock.code, stock.name));
                    row.addEventListener('mouseleave', hideKline);
                    row.addEventListener('mousemove', moveTooltip);

                    const change = stock.today_change || 0;
                    const changeClass = change > 0 ? 'positive' : (change < 0 ? 'negative' : 'neutral');
                    const almostCount = stock.almost_bare_foot_count_10 !== undefined
                        ? stock.almost_bare_foot_count_10
                        : (stock.almost_guang_jiao_count || 0);
                    const bareCount = stock.bare_foot_count_10 !== undefined
                        ? stock.bare_foot_count_10
                        : (stock.guang_jiao_count || 0);
                    const pullCount = stock.pull_count_10 || stock.high_gain_count || 0;
                    const yinDays = stock.yin_count_10 !== undefined
                        ? stock.yin_count_10
                        : (stock.negative_days || 0);
                    const marketCap = (stock.market_cap || 0) > 0
                        ? (stock.market_cap).toFixed(2) : '-';
                    const warningTime = stock.warning_time || stock.time || '-';

                    row.innerHTML = `
                        <td class="stock-number">${globalIndex}</td>
                        <td class="stock-code">${stock.code}</td>
                        <td class="stock-cell"><span class="stock-name">${stock.name}</span></td>
                        <td class="${changeClass}">${change > 0 ? '+' : ''}${change.toFixed(2)}%</td>
                        <td style="font-weight:700;color:${almostCount >= 8 ? '#7c3aed' : '#1d1d1f'}">${almostCount}</td>
                        <td>${bareCount}</td>
                        <td>${pullCount}</td>
                        <td>${yinDays === 0 ? '全阳' : yinDays}</td>
                        <td><span data-market-cap-code="${stock.code}" data-market-cap-decimals="2" data-market-cap-unit="">${marketCap}</span></td>
                        <td>${warningTime}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        // ---- 检查更新 ----
        async function checkUpdate() {
            const today = latestTradeDate;
            if (currentDate !== today) return;
            try {
                const response = await fetch('/api/5las3gj/check_update');
                const result = await response.json();
                if (result.success && result.updated) {
                    await loadStocks();
                }
            } catch(e) { console.error('检查更新失败:', e); }
        }

        // ---- K线图 ----
        const tooltip = document.getElementById('klineTooltip');
        const klineImg = document.getElementById('klineImage');

        function showKline(e, code, name) {
            const prefix = code.startsWith('6') ? '1' : '0';
            klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${prefix}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
            tooltip.querySelector('.tooltip-header').innerText = `${name} (${code}) - 日K线`;
            moveTooltip(e);
            tooltip.style.display = 'block';
        }

        function hideKline() { tooltip.style.display = 'none'; klineImg.src = ''; }

        function moveTooltip(e) {
            const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 565;
            const h = window.innerWidth <= 768 ? 250 : 330;
            let left = e.clientX + 15, top = e.clientY + 15;
            if (left + w > window.innerWidth) left = e.clientX - w - 15;
            if (top + h > window.innerHeight) top = e.clientY - h - 15;
            if (left < 0) left = 10;
            if (top < 0) top = 10;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        // ---- 启动 ----
        loadDates();
        checkUpdateTimer = setInterval(checkUpdate, checkUpdateInterval);
        refreshRealtimeTimer = setInterval(refreshRealtime, realtimeRefreshInterval);
        console.log('🚀 5拉升3光脚页面初始化完成');
    </script>

            <button id="ios-modal-yes" style="flex:1;background:none;border:0;outline:none;font-size:17px;color:#007aff;cursor:pointer;font-weight:600;">是</button>

<script>
function showIosConfirm(msg) {
    return new Promise(resolve => {
        const ov = document.getElementById('ios-modal-overlay');
        document.getElementById('ios-modal-msg').textContent = msg;
        const noBtn = document.getElementById('ios-modal-no');
        const yesBtn = document.getElementById('ios-modal-yes');
        noBtn.style.display = '';
        noBtn.textContent = '否';
        yesBtn.textContent = '是';
        document.getElementById('ios-modal-divider').style.display = '';
        ov.style.display = 'flex';
        const done = r => { ov.style.display = 'none'; resolve(r); };
        noBtn.onclick = () => done(false);
        yesBtn.onclick = () => done(true);
    });
}
function showIosAlert(msg) {
    return new Promise(resolve => {
        const ov = document.getElementById('ios-modal-overlay');
        document.getElementById('ios-modal-msg').textContent = msg;
        const noBtn = document.getElementById('ios-modal-no');
        const yesBtn = document.getElementById('ios-modal-yes');
        noBtn.style.display = 'none';
        document.getElementById('ios-modal-divider').style.display = 'none';
        yesBtn.textContent = '确定';
        ov.style.display = 'flex';
        yesBtn.onclick = () => { ov.style.display = 'none'; noBtn.style.display = ''; document.getElementById('ios-modal-divider').style.display = ''; resolve(); };
    });
}
</script>
