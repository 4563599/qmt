<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5拉升</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>

        body {

            background: #ffffff; min-height: 100vh; padding: 20px 20px 20px 144px; margin: 0;
        }
        .container { max-width: 1320px; width: 100%; margin: 0 auto; }

        .nav-buttons { margin-bottom: 10px; display: flex; justify-content: flex-start; align-items: center; gap: 15px; flex-wrap: wrap; }
        .nav-left { display: flex; gap: 10px; align-items: center; }
        .nav-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-start; }

        .nav-btn-yx205   { background: #06b6d4; }
        .nav-btn-yx205:hover   { background: #0891b2; transform: translateY(-2px); }
        .nav-btn-lszty   { background: #e11d48; }
        .nav-btn-lszty:hover   { background: #be123c; transform: translateY(-2px); }
        .nav-btn-sbzt    { background: #f43f5e; }
        .nav-btn-sbzt:hover    { background: #e11d48; transform: translateY(-2px); }
        .nav-btn-ztorgj  { background: #d946ef; }
        .nav-btn-ztorgj:hover  { background: #c026d3; transform: translateY(-2px); }
        .nav-btn-ztqq    { background: #7c3aed; }
        .nav-btn-ztqq:hover    { background: #6d28d9; transform: translateY(-2px); }
        .nav-btn-5ls     { background: #8b5cf6; }
        .nav-btn-5ls:hover     { background: #7c3aed; transform: translateY(-2px); }
        .nav-btn-5lsy2   { background: #ef4444; }
        .nav-btn-5lsy2:hover   { background: #dc2626; transform: translateY(-2px); }
        .nav-btn-5las3gj { background: #f97316; }
        .nav-btn-5las3gj:hover { background: #ea6c0a; transform: translateY(-2px); }
        .nav-btn-jpgz    { background: #f59e0b; }
        .nav-btn-jpgz:hover    { background: #d97706; transform: translateY(-2px); }
        .nav-btn-yhy     { background: #e11d48; }
        .nav-btn-yhy:hover     { background: #be123c; transform: translateY(-2px); }
        .nav-btn-5ls-core { background: #2563eb; }
        .nav-btn-5ls-core:hover { background: #1d4ed8; transform: translateY(-2px); }

        .date-selector { display: flex; align-items: center; gap: 6px; background: white; padding: 4px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .date-nav-btn { background: #2563eb; color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s; font-weight: 500; min-width: 28px; display: flex; align-items: center; justify-content: center; }
        .date-nav-btn:hover { background: #1d4ed8; transform: scale(1.05); }
        .date-nav-btn:disabled { background: #ccc; cursor: not-allowed; transform: scale(1); }
        #datePicker { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; width: auto; min-width: 95px; max-width: 105px; }

        .page-title { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .page-title h1 { font-size: 22px; font-weight: 700; color: #1d1d1f; margin: 0; }
        .page-title .badge { color: white; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .page-title .desc { color: #6b7280; font-size: 13px; }
        .page-title .count-badge { background: #eff6ff; color: #1d4ed8; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid #bfdbfe; }
        .scan-info-text { color: #2563eb; font-size: 13px; font-weight: 700; }
        .display-mode-filters {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            width: 92px;
            position: absolute;
            left: -100px;
            top: 0;
            z-index: 5;
        }
        .display-mode-btn {
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1.25;
            white-space: normal;
        }
        .display-mode-btn:hover {
            background: #dbeafe;
        }
        .display-mode-btn.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #1d4ed8;
            color: #fff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.18);
        }
        .display-mode-btn-purple {
            border-color: #c4b5fd;
            background: #f3e8ff;
            color: #5b21b6;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.12);
        }
        .display-mode-btn-purple:hover {
            border-color: #8b5cf6;
            background: #ede9fe;
        }
        .display-mode-btn-purple.active {
            border-color: #4c1d95;
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            color: #fff;
            box-shadow: 0 0 0 2px rgba(196, 181, 253, 0.85), 0 6px 14px rgba(76, 29, 149, 0.28);
        }
        .display-mode-btn-red {
            border-color: #fecdd3;
            background: #fff1f2;
            color: #be123c;
            box-shadow: 0 2px 6px rgba(225, 29, 72, 0.10);
        }
        .display-mode-btn-red:hover {
            border-color: #fb7185;
            background: #ffe4e6;
        }
        .display-mode-btn-red.active {
            border-color: #be123c;
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            box-shadow: 0 0 0 2px rgba(254, 205, 211, 0.9), 0 6px 14px rgba(190, 18, 60, 0.24);
        }
        .col-toggle-actions { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
        .col-toggle-btn {
            border: 1px solid rgba(255,255,255,0.48);
            background: rgba(255,255,255,0.16);
            color: #fff;
            border-radius: 999px;
            padding: 3px 7px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .col-toggle-btn.active {
            background: rgba(255,255,255,0.95);
            color: #9f1239;
            border-color: rgba(255,255,255,0.95);
        }

        .main-content-layout {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }
        .main-content-layout > .loading-msg {
            flex: 1 1 auto;
        }
        .columns-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            align-items: start;
            gap: 8px;
            min-width: 0;
            flex: 1 1 auto;
        }
        .metric-column {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            min-width: 0;
        }
        .stacked-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .col-header {
            padding: 9px 8px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .col-header-sub { font-size: 11px; font-weight: 400; opacity: 0.85; margin-top: 2px; }
        .col-header.up { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .col-header.yin-up { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .col-header.yin-count { background: linear-gradient(135deg, #f9a8d4, #ec4899); color: #ffffff; }
        .col-header.yin-body { background: linear-gradient(135deg, #be123c, #9f1239); }
        .col-header.no-touch { background: linear-gradient(135deg, #f97316, #fb923c); }
        .col-header.cross-star { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .col-header.bare-foot { background: linear-gradient(135deg, #ec4899, #db2777); }
        .col-header.yin-lt1 { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .group-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px 5px;
            font-size: 13px;
            font-weight: 700;
            color: #1f2937;
            text-align: left;
            border-bottom: 1px solid #eef2f7;
        }
        .group-block + .group-block { border-top: 1px solid #e5e7eb; }
        .group-label.limit-up,
        .group-label.limit-up-no-pull,
        .group-label.limit-up-pull { background: #eff6ff; }
        .group-label.limit-up { color: #1d4ed8; }
        .group-label.limit-up-no-pull { color: #1e40af; }
        .group-label.limit-up-pull { color: #dc2626; }
        .group-label.non-limit,
        .group-label.non-limit-no-pull { background: #f9fafb; color: #374151; }
        .group-label.non-limit-pull { background: #fff7ed; color: #c2410c; }
        .group-label.all-stocks-divider { background: #f0f9ff; color: #0369a1; }
        .group-label.yin-up { background: #eef2ff; color: #4338ca; }
        .group-label.no-touch { background: #fff7ed; color: #c2410c; }
        .group-label.yin-count { background: rgba(236, 72, 153, 0.88); color: #ffffff !important; }
        .group-label.yin-body { background: #fdf2f8; color: #be123c; }
        .group-label.cross-star { background: #f5f3ff; color: #6d28d9; }
        .group-label.lsyin-avg-rank { background: #eef2ff; color: #4338ca; }
        .group-label.bare-foot { background: #be185d; color: #ffffff; }
        .group-label.drawdown-low { background: #ecfdf5; color: #15803d; }
        .group-label.drawdown-mid { background: #fffbeb; color: #b45309; }
        .group-label.drawdown-high { background: #fef2f2; color: #b91c1c; }
        .group-block.all-stocks-divider {
            margin-top: 14px;
            border-top: 4px dashed #334155;
            box-shadow: inset 0 8px 0 #f1f5f9;
        }
        .group-block.all-stocks-divider .group-label {
            padding-top: 13px;
            border-top: 2px solid #cbd5e1;
        }
        .task-section {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(124,58,237,0.12);
            border: 1px solid #ddd6fe;
        }
        .hint-section {
            background: linear-gradient(180deg, #fff7ed 0%, #ffffff 100%);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(249,115,22,0.14);
            border: 1px solid #fed7aa;
        }
        .hint-section-header {
            padding: 10px 12px;
            color: #fff;
            background: linear-gradient(135deg, #ea580c, #f97316);
        }
        .hint-section-title {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.35;
        }
        .hint-section-sub {
            font-size: 11px;
            opacity: 0.92;
            margin-top: 3px;
        }
        .hint-group {
            padding: 10px;
            border-top: 1px solid #ffedd5;
        }
        .hint-group:first-child {
            border-top: 0;
        }
        .hint-group-label {
            font-size: 13px;
            font-weight: 800;
            color: #9a3412;
            margin-bottom: 8px;
        }
        .hint-image-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hint-image-card {
            background: #fff;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            padding: 8px;
        }
        .hint-image-name {
            font-size: 12px;
            font-weight: 700;
            color: #7c2d12;
            margin-bottom: 6px;
            text-align: center;
        }
        .hint-image-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #fdba74;
            background: #fff;
        }
        .task-section-header {
            padding: 9px 10px;
            color: #fff;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .task-section-title { font-size: 13px; font-weight: 700; }
        .task-section-sub { font-size: 11px; opacity: 0.9; margin-top: 2px; }
        .task-section-count {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            white-space: nowrap;
        }
        .task-group-block { border-top: 1px solid #ede9fe; }
        .task-group-block:first-child { border-top: 0; }
        .task-group-header {
            padding: 6px 10px;
            background: #f5f3ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .task-group-title { font-size: 13px; font-weight: 700; color: #5b21b6; }
        .task-group-count {
            font-size: 10px;
            font-weight: 700;
            color: #6d28d9;
            background: #ede9fe;
            border-radius: 999px;
            padding: 2px 8px;
        }
        .task-empty-alert {
            padding: 14px 10px;
            text-align: center;
            color: #dc2626;
            font-size: 13px;
            font-weight: 800;
        }
        .task-row-header {
            display: grid;
            grid-template-columns: 2.25fr 0.72fr 0.78fr 0.9fr 0.85fr;
            padding: 3px 6px;
            background: #faf5ff;
            border-top: 1px solid #ede9fe;
            border-bottom: 1px solid #eee;
            gap: 6px;
        }
        .task-row-header span {
            font-size: 9px;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
            white-space: nowrap;
        }
        .task-row-header span:first-child {
            text-align: left;
        }
        .task-row-header span:nth-child(2),
        .task-row-header span:nth-child(3),
        .task-row-header span:nth-child(5) {
            text-align: left;
        }
        .task-row {
            display: grid;
            grid-template-columns: 2.25fr 0.72fr 0.78fr 0.9fr 0.85fr;
            align-items: center;
            gap: 6px;
            padding: 6px 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
        }
        .task-row:hover { background: #faf5ff; }
        .task-row:last-child { border-bottom: none; }
        .task-row .stock-name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            min-width: 0;
            text-align: left;
        }
        .task-row .s-name {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .task-row .s-code {
            font-size: 10px;
            color: #4b5563;
            font-weight: 600;
        }
        .task-row .s-extra {
            font-size: 10px;
            color: #7c3aed;
            text-align: center;
            line-height: 1.3;
        }
        .task-row .s-gain,
        .task-row .s-metric {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }
        .task-row > span:nth-child(2),
        .task-row > span:nth-child(3),
        .task-row > span:nth-child(5) {
            text-align: left;
        }
        .task-context-menu {
            position: fixed;
            display: none;
            min-width: 162px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            box-shadow: 0 18px 36px rgba(0,0,0,0.16);
            z-index: 10030;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        .task-context-btn {
            width: 100%;
            border: 0;
            background: #fff;
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
        }
        .task-context-btn + .task-context-btn { border-top: 1px solid #f3f4f6; }
        .task-context-btn:hover { background: #f9fafb; }
        .task-context-btn-danger { color: #dc2626; }
        .task-ios-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 10040;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .task-ios-modal {
            width: min(320px, calc(100vw - 32px));
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 42px rgba(0,0,0,0.24);
        }
        .task-ios-title {
            padding: 18px 18px 6px;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }
        .task-ios-body {
            padding: 4px 18px 16px;
            text-align: center;
            font-size: 14px;
            color: #111827;
            line-height: 1.65;
        }
        .task-ios-body .task-kline-tip { margin-bottom: 8px; text-align: center; }
        .task-ios-body .task-kline-list { margin: 0 auto; width: fit-content; text-align: left; color: #7c3aed; font-weight: 700; }
        .task-ios-body .task-warn-text { color: #dc2626; font-weight: 800; font-size: 18px; }
        .task-ios-body .task-gain-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
        .task-ios-body .task-gain-option { border: 0; border-radius: 14px; min-height: 108px; aspect-ratio: 1 / 1; padding: 10px 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.45; white-space: normal; }
        .task-ios-body .task-gain-option-green { background: #ecfdf5; color: #15803d; }
        .task-ios-body .task-gain-option-red { background: #fef2f2; color: #dc2626; }
        .task-ios-actions { display: flex; min-height: 46px; border-top: 0.5px solid #d1d5db; }
        .task-ios-btn {
            flex: 1;
            border: 0;
            background: #fff;
            font-size: 17px;
            font-weight: 600;
            color: #007aff;
            cursor: pointer;
        }
        .task-ios-btn + .task-ios-btn { border-left: 0.5px solid #d1d5db; }
        .task-ios-btn-cancel { color: #6b7280; }

        .stock-row-header {
            display: grid;
            grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr;
            padding: 3px 4px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .stock-row-header span { font-size: 10px; font-weight: 700; color: #111827; text-align: center; white-space: nowrap; }
        .stock-row {
            display: grid;
            grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr;
            align-items: center;
            padding: 5px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stock-row:hover { background: #f8f9fa; }
        .stock-row:last-child { border-bottom: none; }
        .stock-name { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; text-align: center; }
        .badge-group { display: flex; flex-wrap: nowrap; justify-content: center; gap: 2px; margin-bottom: 2px; overflow: hidden; }
        .yhq-badge {
            font-size: 9px; font-weight: 700; color: #fff;
            border-radius: 8px; padding: 1px 4px; line-height: 1.3; white-space: nowrap;
        }
        .yhq-badge-up      { background: linear-gradient(135deg, #7c3aed, #a855f7); }
        .yhq-badge-no-touch { background: linear-gradient(135deg, #ea580c, #f97316); }
        .yhq-badge-both    { background: linear-gradient(135deg, #be123c, #e11d48); }
        .s-name { display: block; width: 100%; font-size: 13px; line-height: 1.2; font-weight: 500; color: #1d1d1f; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .s-code { font-size: 10px; color: #86868b; margin-top: 1px; text-align: center; }
        .s-found { font-size: 10px; color: #86868b; margin-top: 1px; text-align: center; }
        .s-gain { font-size: 11px; font-weight: 700; text-align: center; white-space: nowrap; }

    <button type="button" class="task-context-btn task-context-btn-danger" data-task-type="delete" style="display:none;">删除股票</button>
</div>

<div id="taskIosOverlay" class="task-ios-overlay">
    <div class="task-ios-modal">
        <div class="task-ios-title" id="taskIosTitle"></div>
        <div class="task-ios-body" id="taskIosBody"></div>
        <div class="task-ios-actions" id="taskIosActions"></div>
    </div>
</div>

<script>
let _stocks = [];
let _redisStocks = [];
let _currentDate = null;
let _availableDates = [];
let _currentDateIndex = 0;
let _flatpickrInstance = null;
let _scanInfo = null;
let _manualTasks = [];
let _taskContextStock = null;
let _taskContextMode = 'add';
let _hasRealtimeOverlay = false;
let _displayHighGainYangOnly = true;
let _displayRefYangOnly = false;
let _displayBareFootHighGainOnly = false;
let _displayBareFootHighGainLowGtMa5Only = false;
let _displayBareFootLimitUpOnly = false;
let _displayYinAfterStrongOnly = false;
let _displayMode = 'all';
let _displayLimitOnly = false;
let _bareFootYangCountMode = 'exact';
let _mobileListIndex = 0;
const YHY_TASK_API_BASE = '/api/yhy/tasks';
const IMAGE_HINT_GROUPS = [
    {
        title: '一字横盘示例',
        items: [
            { name: '一字横盘01', url: "{{ url_for('static', filename='5ls-hints/一字横盘01.png') }}" },
            { name: '一字横盘02', url: "{{ url_for('static', filename='5ls-hints/一字横盘02.png') }}" }
        ]
    },
    {
        title: '厂子横盘示例',
        items: [
            { name: '厂子横盘01', url: "{{ url_for('static', filename='5ls-hints/厂子横盘01.png') }}" }
        ]
    }
];
const YHY_TASK_REDIS_PREFIX = 'myStock:task';
const TASK_GROUP_META = [
    { key: 'yizi', title: '一字特征', emptyText: '未添加,请完成今日任务!' },
    { key: 'changzi', title: '厂子特征', emptyText: '未添加,请完成今日任务!' },
    { key: 'hengpan', title: '横盘调整特征', emptyText: '暂无数据' }
];

const tooltip = document.getElementById('klineTooltip');
const klineImg = document.getElementById('klineImage');
function getPrefix(code) { return code.startsWith('6') ? '1' : '0'; }
function showKline(e, code, name) {
    klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${getPrefix(code)}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
    document.getElementById('klineTtHeader').innerText = `${name} (${code}) - 日K线`;
    moveTooltip(e);
    tooltip.style.display = 'block';
}
function hideKline() { tooltip.style.display = 'none'; klineImg.src = ''; }
function moveTooltip(e) {
    const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 565;
    const h = window.innerWidth <= 768 ? 250 : 330;
    let left = e.clientX + 15, top = e.clientY + 15;
    if (left + w > window.innerWidth) left = e.clientX - w - 15;
    if (top + h > window.innerHeight) top = e.clientY - h - 15;
    if (left < 0) left = 10;
    if (top < 0) top = 10;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
}
function isMobileKlineMode() {
    return window.innerWidth <= 768 || (window.matchMedia && window.matchMedia('(hover: none), (pointer: coarse)').matches);
}
function attachKlineEvents(row, code, name) {
    row.addEventListener('mouseenter', function(e) {
        if (isMobileKlineMode()) return;
        showKline(e, code, name);
    });
    row.addEventListener('mouseleave', function() {
        if (isMobileKlineMode()) return;
        hideKline();
    });
    row.addEventListener('mousemove', function(e) {
        if (isMobileKlineMode()) return;
        moveTooltip(e);
    });
    row.addEventListener('click', function(e) {
        if (!isMobileKlineMode()) return;
        e.stopPropagation();
        showKline(e, code, name);
    });
}
document.addEventListener('click', function() {
    if (!isMobileKlineMode()) return;
    hideKline();
});

async function loadDates() {
    try {
        const resp = await fetch('/api/5ls/dates');
        const result = await resp.json();
        if (result.success && result.dates && result.dates.length > 0) {
            _availableDates = result.dates;
            _currentDate = _availableDates[0];
            _currentDateIndex = 0;
        }
    } catch (e) {}
    initFlatpickr();
    await loadStocks();
    startRealtimeRefresh();
}

function initFlatpickr() {
    _flatpickrInstance = flatpickr('#datePicker', {
        enable: _availableDates,
        dateFormat: 'Y-m-d',
        defaultDate: _currentDate,
        appendTo: document.body,
        onChange: function(selectedDates, dateStr) {
            if (dateStr && dateStr !== _currentDate) {
                _currentDate = dateStr;
                _currentDateIndex = _availableDates.indexOf(dateStr);
                loadStocks();
            }
        }
    });
}

function prevDate() {
    if (_currentDateIndex < _availableDates.length - 1) {
        _currentDateIndex++;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

function nextDate() {
    if (_currentDateIndex > 0) {
        _currentDateIndex--;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

async function loadStocks() {
    document.getElementById('mainContent').innerHTML = '<div class="loading-msg">正在加载数据...</div>';
    document.getElementById('totalCount').textContent = '加载中...';
    updateScanInfoDisplay(null, []);
    try {
        const url = _currentDate ? `/api/5ls/stocks?date=${_currentDate}` : '/api/5ls/stocks';
        const resp = await fetch(url);
        const result = await resp.json();
        if (result.success) {
            _redisStocks = cloneStocks(result.data || []);
            _stocks = cloneStocks(_redisStocks);
            _hasRealtimeOverlay = false;
            _scanInfo = result.scan_info || null;
            updateScanInfoDisplay(_scanInfo, _stocks);
            updateDisplayModeButtons();
            renderCurrentStocks();
            await loadTaskStocks(_currentDate);
            await refreshRealtime();
        } else {
            document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败</div>';
            document.getElementById('totalCount').textContent = '加载失败';
        }
    } catch (e) {
        document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败: ' + e.message + '</div>';
        document.getElementById('totalCount').textContent = '加载失败';
    }
}

function formatPct(value) {
    const n = Number(value || 0);
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

function formatDrawdown(value) {
    const n = Number(value);
    if (!isFinite(n)) return '--';
    return Math.abs(n).toFixed(2) + '%';
}

function formatScanDuration(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '--';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return n.toFixed(3).replace(/\.?0+$/, '');
}

function formatScanEndTime(value) {
    if (!value) return '--';
    const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
    if (!match) return String(value);
    return `${Number(match[2])}月${Number(match[3])}日${Number(match[4])}点${Number(match[5])}分${Number(match[6])}秒`;
}

function formatRedisUpdateStatus(status) {
    const s = String(status || '').toLowerCase();
    if (s === 'success' || s === 'ok') return '成功';
    if (s === 'redis_update_failed' || s === 'failed' || s === 'fail' || s === 'error') return '失败';
    if (s === 'pending') return '更新中';
    if (!s) return '--';
    return status;
}

function formatFoundTime(value) {
    if (!value) return '';
    const match = String(value).match(/(\d{2}):(\d{2}):(\d{2})$/);
    if (match) return `${match[1]}:${match[2]}:${match[3]}`;
    return String(value);
}

function deriveLatestFoundTime(stocks) {
    if (!Array.isArray(stocks) || stocks.length === 0) return '';
    return stocks
        .map(s => String(s.first_found_time || ''))
        .filter(Boolean)
        .sort()
        .slice(-1)[0] || '';
}

function cloneStocks(stocks) {
    return (stocks || []).map(function(stock) {
        return { ...stock };
    });
}

function getVisibleStocksForCurrentMode(stocks) {
    let list = cloneStocks(stocks || []);
    if (_displayBareFootHighGainLowGtMa5Only) {
        list = list.filter(s => isTrueFlag(s.ref_bare_foot_yang_high_gain_gte_6_5_low_gt_ma5));
    }
    if (_displayBareFootLimitUpOnly) {
        list = list.filter(s => isTrueFlag(s.ref_bare_foot_yang_high_gain_gte_6_5) && isTrueFlag(s.ref_limit_up));
    }
    if (_displayHighGainYangOnly) {
        list = list.filter(s => isTrueFlag(s.ref_high_gain_gte_6_5_and_yang));
    }
    if (_displayRefYangOnly) {
        list = list.filter(s => isTrueFlag(s.ref_is_yang));
    }
    if (_displayBareFootHighGainOnly) {
        list = list.filter(s => isTrueFlag(s.ref_bare_foot_yang_high_gain_gte_6_5));
    }
    if (_displayMode === 'pull') {
        list = list.filter(s => isTrueFlag(s.all_yin_pull_prev_or_next));
    }
    if (_displayLimitOnly) {
        list = list.filter(s => isTrueFlag(s.ref_limit_up));
    }
    if (_displayYinAfterStrongOnly) {
        list = list.filter(s => isTrueFlag(s.all_yin_after_strong_10d));
    }
    return list;
}

function updateDisplayModeButtons() {
    const bareFootHighGainLowGtMa5Btn = document.getElementById('displayModeBareFootHighGainLowGtMa5Btn');
    const bareFootLimitUpBtn = document.getElementById('displayModeBareFootLimitUpBtn');
    const highGainYangBtn = document.getElementById('displayModeHighGainYangBtn');
    const refYangBtn = document.getElementById('displayModeRefYangBtn');
    const bareFootHighGainBtn = document.getElementById('displayModeBareFootHighGainBtn');
    const allBtn = document.getElementById('displayModeAllBtn');
    const pullBtn = document.getElementById('displayModePullBtn');
    const limitBtn = document.getElementById('displayModeLimitBtn');
    const yinAfterStrongBtn = document.getElementById('displayModeYinAfterStrongBtn');
    if (bareFootHighGainLowGtMa5Btn) bareFootHighGainLowGtMa5Btn.classList.toggle('active', _displayBareFootHighGainLowGtMa5Only);
    if (bareFootLimitUpBtn) bareFootLimitUpBtn.classList.toggle('active', _displayBareFootLimitUpOnly);
    if (highGainYangBtn) highGainYangBtn.classList.toggle('active', _displayHighGainYangOnly);
    if (refYangBtn) refYangBtn.classList.toggle('active', _displayRefYangOnly);
    if (bareFootHighGainBtn) bareFootHighGainBtn.classList.toggle('active', _displayBareFootHighGainOnly);
    if (allBtn) allBtn.classList.toggle('active', _displayMode === 'all' && !_displayHighGainYangOnly && !_displayRefYangOnly && !_displayBareFootHighGainOnly && !_displayBareFootHighGainLowGtMa5Only && !_displayBareFootLimitUpOnly && !_displayYinAfterStrongOnly);
    if (pullBtn) pullBtn.classList.toggle('active', _displayMode === 'pull');
    if (limitBtn) limitBtn.classList.toggle('active', _displayLimitOnly);
    if (yinAfterStrongBtn) yinAfterStrongBtn.classList.toggle('active', _displayYinAfterStrongOnly);
}

function renderCurrentStocks() {
    const visibleStocks = getVisibleStocksForCurrentMode(_stocks);
    document.getElementById('totalCount').textContent = `共 ${visibleStocks.length} 只`;
    renderColumns(visibleStocks);
}

function setDisplayMode(mode) {
    if (mode === 'bare_foot_high_gain_low_gt_ma5') {
        _displayBareFootHighGainLowGtMa5Only = !_displayBareFootHighGainLowGtMa5Only;
        if (_displayBareFootHighGainLowGtMa5Only) {
            _displayHighGainYangOnly = false;
            _displayRefYangOnly = false;
            _displayBareFootHighGainOnly = false;
            _displayBareFootLimitUpOnly = false;
        }
    } else if (mode === 'bare_foot_limit_up') {
        _displayBareFootLimitUpOnly = !_displayBareFootLimitUpOnly;
        if (_displayBareFootLimitUpOnly) {
            _displayHighGainYangOnly = false;
            _displayRefYangOnly = false;
            _displayBareFootHighGainOnly = false;
            _displayBareFootHighGainLowGtMa5Only = false;
            _displayMode = 'all';
            _displayLimitOnly = false;
        }
    } else if (mode === 'high_gain_yang') {
        _displayHighGainYangOnly = !_displayHighGainYangOnly;
        if (_displayHighGainYangOnly) {
            _displayRefYangOnly = false;
            _displayBareFootHighGainOnly = false;
            _displayBareFootHighGainLowGtMa5Only = false;
            _displayBareFootLimitUpOnly = false;
        }
    } else if (mode === 'ref_yang') {
        _displayRefYangOnly = !_displayRefYangOnly;
        if (_displayRefYangOnly) {
            _displayHighGainYangOnly = false;
            _displayBareFootHighGainOnly = false;
            _displayBareFootHighGainLowGtMa5Only = false;
            _displayBareFootLimitUpOnly = false;
        }
    } else if (mode === 'bare_foot_high_gain') {
        _displayBareFootHighGainOnly = !_displayBareFootHighGainOnly;
        if (_displayBareFootHighGainOnly) {
            _displayHighGainYangOnly = false;
            _displayRefYangOnly = false;
            _displayBareFootHighGainLowGtMa5Only = false;
            _displayBareFootLimitUpOnly = false;
        }
    } else if (mode === 'limit') {
        _displayLimitOnly = !_displayLimitOnly;
    } else if (mode === 'yin_after_strong') {
        _displayYinAfterStrongOnly = !_displayYinAfterStrongOnly;
    } else if (mode === 'all') {
        _displayHighGainYangOnly = false;
        _displayRefYangOnly = false;
        _displayBareFootHighGainOnly = false;
        _displayBareFootHighGainLowGtMa5Only = false;
        _displayBareFootLimitUpOnly = false;
        _displayYinAfterStrongOnly = false;
        _displayMode = 'all';
    } else if (mode === 'pull') {
        if (_displayMode === mode) return;
        _displayMode = mode;
    } else {
        return;
    }
    updateDisplayModeButtons();
    renderCurrentStocks();
}

function setBareFootYangCountMode(mode) {
    if (mode !== 'exact' && mode !== 'almost') return;
    if (_bareFootYangCountMode === mode) return;
    _bareFootYangCountMode = mode;
    renderCurrentStocks();
}

function updateScanInfoDisplay(scanInfo, stocks) {
    const el = document.getElementById('scanInfoText');
    if (!el) return;
    const durationText = formatScanDuration(scanInfo && scanInfo.last_scan_duration_sec);
    const latestTime = (scanInfo && scanInfo.last_scan_end_time) || deriveLatestFoundTime(stocks);
    const scanEndText = formatScanEndTime(latestTime);
    const redisStatusText = formatRedisUpdateStatus(scanInfo && scanInfo.redis_update_status);
    const redisTimeText = formatScanEndTime(scanInfo && scanInfo.redis_update_time);
    const redisDurationText = formatScanDuration(scanInfo && scanInfo.redis_update_duration_sec);
    const redisError = scanInfo && scanInfo.redis_update_error ? `，原因:${scanInfo.redis_update_error}` : '';
    el.textContent = `扫描耗时${durationText}s，扫描完成时间:${scanEndText}，Redis更新:${redisStatusText} ${redisTimeText}，Redis耗时${redisDurationText}s${redisError}`;
}

function getDisplayChangeValue(stock) {
    return Number(stock && stock.today_change != null ? stock.today_change : stock.ref_gain || 0);
}

function getShanghaiNowParts() {
    const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        weekday: 'short'
    }).formatToParts(new Date());
    const data = {};
    parts.forEach(function(part) {
        if (part.type !== 'literal') data[part.type] = part.value;
    });
    return {
        date: `${data.year}-${data.month}-${data.day}`,
        hour: Number(data.hour || 0),
        minute: Number(data.minute || 0),
        weekday: data.weekday || ''
    };
}

function isTradingSessionNow() {
    const now = getShanghaiNowParts();
    if (now.weekday === 'Sat' || now.weekday === 'Sun') return false;
    const totalMinutes = now.hour * 60 + now.minute;
    const isTradingTime = (totalMinutes >= 570 && totalMinutes < 690) || (totalMinutes >= 780 && totalMinutes < 900);
    return now.date === _currentDate && isTradingTime;
}

function getDrawdownMagnitude(stock) {
    const n = Number(stock && stock.max_drawdown_10d);
    return isFinite(n) ? Math.abs(n) : Infinity;
}

function sortTaskStocks(stocks) {
    return (stocks || []).slice().sort(function(a, b) {
        return getDisplayChangeValue(b) - getDisplayChangeValue(a);
    });
}

function buildStackedColumn(children) {
    const column = document.createElement('div');
    column.className = 'stacked-column';
    (children || []).forEach(function(child) {
        if (child) column.appendChild(child);
    });
    return column;
}

function buildTaskSection() {
    const section = document.createElement('div');
    section.className = 'task-section';
    section.id = 'taskSection';
    const visibleTasks = getVisibleTaskStocksForCurrentPage();
    section.innerHTML = `
        <div class="task-section-header">
            <div>
                <div class="task-section-title">今日任务列表</div>
                <div class="task-section-sub">手动右键添加 · Redis key: ${YHY_TASK_REDIS_PREFIX}:{yyyymmdd}</div>
            </div>
            <span class="task-section-count">${visibleTasks.length} 只</span>
        </div>
        <div id="taskSectionBody"></div>
    `;
    renderTaskSectionContent(section.querySelector('#taskSectionBody'));
    return section;
}

function getVisibleTaskStocksForCurrentPage() {
    const sourceName = getTaskSourcePageName();
    return (_manualTasks || []).filter(function(item) {
        const sourcePages = Array.isArray(item.source_pages) ? item.source_pages : [];
        return sourcePages.includes(sourceName);
    });
}

function renderTaskSectionContent(target) {
    const host = target || document.getElementById('taskSectionBody');
    if (!host) return;
    host.innerHTML = '';
    const visibleTasks = getVisibleTaskStocksForCurrentPage();

    const section = document.getElementById('taskSection');
    if (section) {
        const countNode = section.querySelector('.task-section-count');
        if (countNode) countNode.textContent = `${visibleTasks.length} 只`;
    }

    TASK_GROUP_META.forEach(function(groupMeta) {
        const groupStocks = sortTaskStocks(visibleTasks.filter(function(item) {
            return item.task_type === groupMeta.key;
        }));
        host.appendChild(buildTaskGroupBlock(groupMeta, groupStocks));
    });
}

function buildTaskGroupBlock(groupMeta, stocks) {
    const block = document.createElement('div');
    block.className = 'task-group-block';

    const groupHeader = document.createElement('div');
    groupHeader.className = 'task-group-header';
    groupHeader.innerHTML = `
        <div class="task-group-title">${groupMeta.title}</div>
        <span class="task-group-count">${stocks.length} 只</span>
    `;
    block.appendChild(groupHeader);

    if (!stocks.length) {
        const empty = document.createElement('div');
        empty.className = groupMeta.key === 'hengpan' ? 'no-data' : 'task-empty-alert';
        empty.textContent = groupMeta.emptyText;
        block.appendChild(empty);
        return block;
    }

    const rowHeader = document.createElement('div');
    rowHeader.className = 'task-row-header';
    rowHeader.innerHTML = '<span>名称</span><span>涨幅</span><span>回撤</span><span>市值</span><span>累计</span>';
    block.appendChild(rowHeader);

    stocks.forEach(function(stock) {
        block.appendChild(buildTaskRow(stock));
    });
    return block;
}

function buildTaskRow(stock) {
    const row = document.createElement('div');
    row.className = 'task-row';
    attachKlineEvents(row, stock.code, stock.name);
    row.addEventListener('contextmenu', function(e) { showTaskDeleteMenu(e, stock); });

    const sourcePages = Array.isArray(stock.source_pages) ? stock.source_pages : [];
    const sourceText = sourcePages.length ? `来源:${sourcePages.join(' / ')}` : '';
    const changeValue = getDisplayChangeValue(stock);
    const drawdownValue = Number(stock.max_drawdown_10d);
    const gainClass = changeValue > 0 ? 'positive' : changeValue < 0 ? 'negative' : 'neutral';
    row.innerHTML =
        '<div class="stock-name"><span class="s-name" title="' + stock.code + ' ' + stock.name + '">' + stock.name + '</span>' +
        '<span class="s-code">' + stock.code + '</span>' +
        '<span class="s-extra">' + sourceText + '</span></div>' +
        '<span class="s-gain ' + gainClass + '">' + formatPct(changeValue) + '</span>' +
        '<span class="s-metric ' + (isFinite(drawdownValue) && Math.abs(drawdownValue) >= 10 ? 'extra' : 'neutral') + '">' + formatDrawdown(stock.max_drawdown_10d) + '</span>' +
        '<span class="s-metric" data-market-cap-code="' + stock.code + '" data-market-cap-decimals="2" data-market-cap-unit="亿">' + Number(stock.market_cap || 0).toFixed(2) + '亿</span>' +
        '<span class="s-metric">' + formatPct(Number(stock.gains_10 || 0)) + '</span>';
    return row;
}

async function loadTaskStocks(date) {
    if (!date) {
        _manualTasks = [];
        renderTaskSectionContent();
        return;
    }
    const resp = await fetch(`${YHY_TASK_API_BASE}?date=${date}`);
    const result = await resp.json();
    _manualTasks = result.success ? (result.data || []) : [];
    renderTaskSectionContent();
}

function getTaskSourcePageName() {
    return '5拉升:阴线都向上';
}

async function persistTaskStock(stock, taskType, gainConfirmLevel) {
    const resp = await fetch('/api/yhy/tasks/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            date: _currentDate,
            task_type: taskType,
            code: stock.code,
            name: stock.name,
            stock_code_with_market: stock.stock_code_with_market || '',
            ref_gain: stock.ref_gain,
            today_change: getDisplayChangeValue(stock),
            market_cap: stock.market_cap,
            yin_count: stock.yin_count,
            high_gain_count: stock.high_gain_count,
            gains_10: stock.gains_10,
            max_drawdown_10d: stock.max_drawdown_10d,
            all_yin_up: !!stock.all_yin_up,
            all_yin_no_touch: !!stock.all_yin_no_touch,
            ref_limit_up: !!stock.ref_limit_up,
            gain_confirm_level: gainConfirmLevel || '',
            source_page: getTaskSourcePageName()
        })
    });
    const result = await resp.json();
    if (!result.success) throw new Error(result.error || '添加失败');
    await loadTaskStocks(_currentDate);
}

async function removeTaskStock(stock) {
    const resp = await fetch('/api/yhy/tasks/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: _currentDate, code: stock.code })
    });
    const result = await resp.json();
    if (!result.success) throw new Error(result.error || '删除失败');
    await loadTaskStocks(_currentDate);
}

function showTaskContextMenu(event, stock) {
    event.preventDefault();
    hideKline();
    _taskContextStock = stock;
    _taskContextMode = 'add';
    const menu = document.getElementById('taskContextMenu');
    if (!menu) return;

function showTaskIosDialog(config) {
    const overlay = document.getElementById('taskIosOverlay');
    const titleEl = document.getElementById('taskIosTitle');
    const bodyEl = document.getElementById('taskIosBody');
    const actionsEl = document.getElementById('taskIosActions');
    titleEl.textContent = config.title || '';
    bodyEl.innerHTML = config.bodyHtml || '';
    actionsEl.innerHTML = (config.actions || []).map(function(action) {
        return `<button type="button" class="task-ios-btn ${action.className || ''}" data-modal-value="${action.value}">${action.label}</button>`;
    }).join('');
    overlay.style.display = 'flex';
    return new Promise(function(resolve) {
        const done = function(value) {
            overlay.style.display = 'none';
            bodyEl.innerHTML = '';
            actionsEl.innerHTML = '';
            resolve(value);
        };

        const clickHandler = function(e) {
            const button = e.target.closest('[data-modal-value]');
            if (!button) return;
            done(button.getAttribute('data-modal-value'));
        };

        actionsEl.onclick = clickHandler;
        bodyEl.onclick = clickHandler;
        overlay.onclick = function(e) {
            if (e.target === overlay) done('cancel');
        };
    });
}

async function handleTaskMenuAction(taskType) {
    const stock = _taskContextStock;
    hideTaskContextMenu();
    if (!stock) return;
    try {
        if (taskType === 'delete') {
            const confirmed = await showTaskDeleteConfirmDialog();
            if (confirmed === 'confirm_delete') await removeTaskStock(stock);
            return;
        }
        if (taskType === 'hengpan') {
            await persistTaskStock(stock, 'hengpan', '');
            return;
        }
        const klineConfirm = await showTaskKlineConfirmDialog();
        if (klineConfirm !== 'confirm') return;
        const gainConfirm = await showTaskGainConfirmDialog();
        if (gainConfirm === 'lt35') {
            await persistTaskStock(stock, taskType, 'lt35');
            return;
        }
        if (gainConfirm !== 'gte35') return;
        const warnConfirm = await showTaskWarnDialog();
        if (warnConfirm === 'confirm_add') {
            await persistTaskStock(stock, taskType, 'gte35');
        }
    } catch (e) {
        console.error('[5ls][handleTaskMenuAction] 失败:', e);
        await showTaskErrorDialog(e.message || '添加失败');
    }
}

function getMobileListPanels(grid) {
    const panels = [];
    function collect(node) {
        if (!node || !node.classList) return;
        if (node.classList.contains('metric-column') || node.classList.contains('task-section')) {
            panels.push(node);
            return;
        }
        Array.from(node.children || []).forEach(collect);
    }
    Array.from((grid && grid.children) || []).forEach(collect);
    return panels;
}

function getMobileListTitle(panel, index) {
    const first = panel && panel.children && panel.children[0];
    let text = '';
    if (first && first.classList && first.classList.contains('col-header')) {
        const main = first.querySelector('.col-header-main');
        if (main) {
            text = main.textContent || '';
        } else {
            const clone = first.cloneNode(true);
            clone.querySelectorAll('.col-header-sub').forEach(function(node) { node.remove(); });
            text = clone.textContent || '';
        }
    } else if (first && first.classList && first.classList.contains('task-section-header')) {
        const title = first.querySelector('.task-section-title');
        text = title ? title.textContent : first.textContent;
    }
    text = String(text || ('列表' + (index + 1))).replace(/\s+/g, '');
    return text.length > 14 ? text.slice(0, 14) : text;
}

function setMobileListIndex(grid, index) {
    const panels = getMobileListPanels(grid);
    if (!panels.length) return;
    const safeIndex = Math.max(0, Math.min(index, panels.length - 1));
    _mobileListIndex = safeIndex;
    panels.forEach(function(panel, panelIndex) {
        panel.classList.toggle('mobile-active-list', panelIndex === safeIndex);
    });
    const tabs = grid.parentElement ? grid.parentElement.querySelectorAll('.mobile-list-tab') : [];
    tabs.forEach(function(tab, tabIndex) {
        tab.classList.toggle('active', tabIndex === safeIndex);
        tab.setAttribute('aria-selected', tabIndex === safeIndex ? 'true' : 'false');
        if (tabIndex === safeIndex && window.innerWidth <= 768) {
            tab.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
    });
    hideKline();
}

function switchMobileList(grid, direction) {
    const panels = getMobileListPanels(grid);
    if (!panels.length) return;
    setMobileListIndex(grid, _mobileListIndex + direction);
}

function setupMobileSingleListMode(layout, grid) {
    const panels = getMobileListPanels(grid);
    if (!panels.length) return;
    grid.classList.add('mobile-single-list');

    const tabs = document.createElement('div');
    tabs.className = 'mobile-list-tabs';
    tabs.setAttribute('role', 'tablist');
    panels.forEach(function(panel, index) {
        panel.dataset.mobileListIndex = String(index);
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'mobile-list-tab';
        tab.setAttribute('role', 'tab');
        tab.textContent = getMobileListTitle(panel, index);
        tab.addEventListener('click', function() { setMobileListIndex(grid, index); });
        tabs.appendChild(tab);
    });
    if (grid.parentElement === layout) {
        layout.insertBefore(tabs, grid);
    } else {
        layout.appendChild(tabs);
    }

    let touchStartY = 0;
    let touchStartX = 0;
    grid.addEventListener('touchstart', function(e) {
        if (!e.touches || !e.touches.length) return;
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
    }, { passive: true });
    grid.addEventListener('touchend', function(e) {
        if (!e.changedTouches || !e.changedTouches.length || window.innerWidth > 768) return;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(deltaX) <= Math.abs(deltaY) || Math.abs(deltaX) < 60) return;
        if (deltaX < -60) switchMobileList(grid, 1);
        if (deltaX > 60) switchMobileList(grid, -1);
    }, { passive: true });

    setMobileListIndex(grid, Math.min(_mobileListIndex, panels.length - 1));
}

        grouped.get(count).push(stock);

    const groups = Array.from(grouped.entries()).map(function(entry) {
        return {
            count: entry[0],
            stocks: entry[1].slice().sort(function(a, b) {

        if (!grouped.has(count)) grouped.set(count, []);
        grouped.get(count).push(stock);
    });

    const groups = Array.from(grouped.entries()).map(function(entry) {
        return {
            count: entry[0],
            stocks: entry[1].slice().sort(function(a, b) {
                return getDisplayChangeValue(b) - getDisplayChangeValue(a);
            })
        };
    });
    groups.sort(function(a, b) { return b.count - a.count; });

    const card = document.createElement('div');
    card.className = 'metric-column';

    const header = document.createElement('div');
    header.className = 'col-header bare-foot';
    header.innerHTML = (isAlmostMode ? '几乎光脚阳线次数' : '10天光脚阳线次数')
        + '<div class="col-header-sub">' + subText + '</div>'
        + '<div class="col-toggle-actions bare-foot-count-toggle">'
        + '<button type="button" class="col-toggle-btn ' + (!isAlmostMode ? 'active' : '') + '" data-bare-foot-count-mode="exact">10天光脚</button>'
        + '<button type="button" class="col-toggle-btn ' + (isAlmostMode ? 'active' : '') + '" data-bare-foot-count-mode="almost">几乎光脚</button>'
        + '</div>';
    card.appendChild(header);

    groups.forEach(function(group) {
        buildGroup(card, group.count + '次', 'bare-foot', group.stocks);
    });
    return card;
}

function isRealtimeTargetDate() {
    return _currentDateIndex === 0;
}

function shouldUseRealtimeStocks() {
    return isRealtimeTargetDate() && isTradingSessionNow();
}

let _realtimeTimer = null;

async function refreshRealtime() {
    if (_stocks.length === 0) return;
    if (!shouldUseRealtimeStocks()) {
        if (_hasRealtimeOverlay) {
            _stocks = cloneStocks(_redisStocks);
            _hasRealtimeOverlay = false;
            renderCurrentStocks();
            await loadTaskStocks(_currentDate);
        }
        return;
    }

    try {
        const codes = _redisStocks.map(s => s.code);
        const resp = await fetch('/api/5ls/realtime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codes: codes })
        });
        const result = await resp.json();
        if (!(result.success && result.data)) return;

        const nextStocks = cloneStocks(_redisStocks);
        const currentChangeMap = new Map((_stocks || []).map(function(stock) {
            return [stock.code, stock.today_change];
        }));
        let hasChange = false;
        nextStocks.forEach(s => {
            if (result.data[s.code]) {
                const newChange = result.data[s.code].change;
                const currentChange = currentChangeMap.get(s.code);
                s.today_change = newChange;
                if (currentChange !== newChange) hasChange = true;
            }
        });

        if (hasChange) {
            _stocks = nextStocks;
            _hasRealtimeOverlay = true;
            renderCurrentStocks();
            await loadTaskStocks(_currentDate);
        }
    } catch (e) {
        console.error('[5ls][refreshRealtime] 请求失败:', e);
    }
}

function startRealtimeRefresh() {
    if (_realtimeTimer) clearInterval(_realtimeTimer);
    _realtimeTimer = setInterval(refreshRealtime, 3000);
}
