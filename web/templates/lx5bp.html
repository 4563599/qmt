<script>
let _stocks = [];
let _currentDate = null;
let _availableDates = [];
let _currentDateIndex = 0;
let _flatpickrInstance = null;
let _lastTimestamp = null;
let _checkTimer = null;
let _scanInfo = null;
let _manualTasks = [];
let _taskContextStock = null;
let _taskContextMode = 'add';
const YHY_TASK_API_BASE = '/api/yhy/tasks';
const YHY_TASK_REDIS_PREFIX = 'myStock:task';
const TASK_GROUP_META = [
    { key: 'yizi', title: '一字特征', emptyText: '未添加,请完成今日任务!' },
    { key: 'changzi', title: '厂子特征', emptyText: '未添加,请完成今日任务!' },
    { key: 'hengpan', title: '横盘调整特征', emptyText: '暂无数据' }
];

const tooltip = document.getElementById('klineTooltip');
const klineImg = document.getElementById('klineImage');
function getPrefix(code) { return code.startsWith('6') ? '1' : '0'; }
function showKline(e, code, name) {
    klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${getPrefix(code)}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
    document.getElementById('klineTtHeader').innerText = `${name} (${code}) - 日K线`;
    moveTooltip(e);
    tooltip.style.display = 'block';
}
function hideKline() { tooltip.style.display = 'none'; klineImg.src = ''; }
function moveTooltip(e) {
    const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 565;
    const h = window.innerWidth <= 768 ? 250 : 330;
    let left = e.clientX + 15, top = e.clientY + 15;
    if (left + w > window.innerWidth) left = e.clientX - w - 15;
    if (top + h > window.innerHeight) top = e.clientY - h - 15;
    if (left < 0) left = 10;
    if (top < 0) top = 10;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
}

async function loadDates() {
    try {
        const resp = await fetch('/api/lx5bp/dates');
        const result = await resp.json();
        if (result.success && result.dates && result.dates.length > 0) {
            _availableDates = result.dates;
            _currentDate = _availableDates[0];
            _currentDateIndex = 0;
        }
    } catch(e) {}
    initFlatpickr();
    await loadStocks();
    startCheckTimer();
}

function initFlatpickr() {
    _flatpickrInstance = flatpickr('#datePicker', {
        enable: _availableDates,
        dateFormat: 'Y-m-d',
        defaultDate: _currentDate,
        appendTo: document.body,
        locale: {
            weekdays: { shorthand: ['日','一','二','三','四','五','六'], longhand: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'] },
            months: { shorthand: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], longhand: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'] }
        },
        onChange: function(selectedDates, dateStr) {
            if (dateStr && dateStr !== _currentDate) {
                _currentDate = dateStr;
                _currentDateIndex = _availableDates.indexOf(dateStr);
                loadStocks();
            }
        }
    });
}

function prevDate() {
    if (_currentDateIndex < _availableDates.length - 1) {
        _currentDateIndex++;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

function nextDate() {
    if (_currentDateIndex > 0) {
        _currentDateIndex--;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

async function loadStocks() {
    document.getElementById('mainContent').innerHTML = '<div class="loading-msg">正在加载数据...</div>';
    document.getElementById('totalCount').textContent = '加载中...';
    try {
        updateScanInfoDisplay(null);
        const url = _currentDate ? `/api/lx5bp/stocks?date=${_currentDate}` : '/api/lx5bp/stocks';
        const resp = await fetch(url);
        const result = await resp.json();
        if (result.success) {
            _stocks = result.data || [];
            _scanInfo = result.scan_info || null;
            document.getElementById('totalCount').textContent = `共 ${_stocks.length} 只`;
            updateScanInfoDisplay(_scanInfo);
            await loadTaskStocks(_currentDate);
            renderColumns(_stocks);
        } else {
            document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败</div>';
            document.getElementById('totalCount').textContent = '加载失败';
            _scanInfo = null;
            updateScanInfoDisplay(null);
        }
    } catch(e) {
        document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败: ' + e.message + '</div>';
        document.getElementById('totalCount').textContent = '加载失败';
        _scanInfo = null;
        updateScanInfoDisplay(null);
    }
}

function formatScanDuration(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '--';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return n.toFixed(3).replace(/\.?0+$/, '');
}

function formatScanEndTime(value) {
    if (!value) return '--';
    const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
    if (!match) return String(value);
    return `${Number(match[2])}月${Number(match[3])}日${Number(match[4])}点${Number(match[5])}分${Number(match[6])}秒`;
}

function formatRedisUpdateStatus(value) {
    const status = String(value || '').toLowerCase();
    if (status === 'success' || status === 'ok') return '成功';
    if (status === 'pending') return '写入中';
    if (status === 'skipped_empty') return '跳过空结果';
    if (status === 'redis_update_failed' || status === 'failed' || status === 'error') return '失败';
    return status || '--';
}

function updateScanInfoDisplay(info) {
    const el = document.getElementById('scanInfoText');
    if (!el) return;
    const durationText = formatScanDuration(info && info.last_scan_duration_sec);
    const scanEndText = formatScanEndTime(info && info.last_scan_end_time);
    const redisStatusText = formatRedisUpdateStatus(info && info.redis_update_status);
    const redisTimeText = formatScanEndTime(info && info.redis_update_time);
    const redisError = info && info.redis_update_error ? `，原因:${info.redis_update_error}` : '';
    el.textContent = `扫描耗时${durationText}s，扫描完成时间:${scanEndText}，Redis更新:${redisStatusText} ${redisTimeText}${redisError}`;
}

function getTaskSourcePageName() {
    return '连续5不碰';
}

function getVisibleTaskStocksForCurrentPage() {
    const sourceName = getTaskSourcePageName();
    return (_manualTasks || []).filter(function(item) {
        const sourcePages = Array.isArray(item.source_pages) ? item.source_pages : [];
        return sourcePages.includes(sourceName);
    });
}

function sortTaskStocks(stocks) {
    return (stocks || []).slice().sort(function(a, b) {
        return Number(b.today_change || b.ref_gain || 0) - Number(a.today_change || a.ref_gain || 0);
    });
}

function renderTaskPanelContent() {
    const host = document.getElementById('taskPanelBody');
    const countNode = document.getElementById('taskPanelCount');
    if (!host || !countNode) return;
    host.innerHTML = '';
    const visibleTasks = getVisibleTaskStocksForCurrentPage();
    countNode.textContent = `${visibleTasks.length} 只`;

    TASK_GROUP_META.forEach(function(groupMeta) {
        const block = document.createElement('div');
        block.className = 'task-group-block';
        const groupStocks = sortTaskStocks(visibleTasks.filter(function(item) {
            return item.task_type === groupMeta.key;
        }));

        block.innerHTML = `
            <div class="task-group-header">
                <div class="task-group-title">${groupMeta.title}</div>
                <span class="task-group-count">${groupStocks.length} 只</span>
            </div>
        `;

        if (!groupStocks.length) {
            const empty = document.createElement('div');
            empty.className = groupMeta.key === 'hengpan' ? 'no-data' : 'task-empty-alert';
            empty.textContent = groupMeta.emptyText;
            block.appendChild(empty);
        } else {
            const header = document.createElement('div');
            header.className = 'task-row-header';
            header.innerHTML = '<span>名称</span><span>涨幅</span><span>当前</span><span>10日</span>';
            block.appendChild(header);
            groupStocks.forEach(function(stock) {
                block.appendChild(buildTaskRow(stock));
            });
        }
        host.appendChild(block);
    });
}

function buildTaskRow(stock) {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.addEventListener('mouseenter', function(e) {
        showKline(e, stock.code, stock.name);
    });
    row.addEventListener('mouseleave', hideKline);
    row.addEventListener('mousemove', moveTooltip);
    row.addEventListener('contextmenu', function(e) {
        showTaskDeleteMenu(e, stock);
    });
    const gain = Number(stock.today_change || stock.ref_gain || 0);
    const gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
    row.innerHTML = `
        <div class="task-stock-name">
            <div class="s-name">${stock.name}</div>
            <div class="s-code">${stock.code}</div>
        </div>
        <div class="task-cell ${gainClass}">${gain > 0 ? '+' : ''}${gain.toFixed(2)}%</div>
        <div class="task-cell">${Number(stock.current_streak || 0)}天</div>
        <div class="task-cell">${Number(stock.max_streak_10d || 0)}天</div>
    `;
    return row;
}

async function loadTaskStocks(date) {
    const targetDate = date || _currentDate;
    if (!targetDate) return;
    try {
        const resp = await fetch(`${YHY_TASK_API_BASE}?date=${targetDate}`);
        const result = await resp.json();
        if (result.success) {
            _manualTasks = result.data || [];
            renderTaskPanelContent();
        }
    } catch (e) {
        console.error('[lx5bp][loadTaskStocks] 请求失败:', e);
    }
}

async function persistTaskStock(stock, taskType, gainConfirmLevel) {
    const resp = await fetch('/api/yhy/tasks/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            date: _currentDate,
            task_type: taskType,
            code: stock.code,
            name: stock.name,
            stock_code_with_market: stock.stock_code_with_market || '',
            ref_gain: stock.ref_gain || 0,
            today_change: stock.ref_gain || 0,
            market_cap: 0,
            yin_count: 0,
            high_gain_count: stock.yang_high_gain_count || 0,
            gains_10: stock.max_streak_10d || 0,
            max_drawdown_10d: stock.current_streak || 0,
            gain_confirm_level: gainConfirmLevel || '',
            source_page: 'lx5bp'
        })
    });
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '添加失败');
    }
    await loadTaskStocks(_currentDate);
}

async function removeTaskStock(stock) {
    const resp = await fetch('/api/yhy/tasks/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            date: _currentDate,
            code: stock.code
        })
    });
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '删除失败');
    }
    await loadTaskStocks(_currentDate);
}

function showTaskContextMenu(event, stock) {
    event.preventDefault();
    hideKline();
    _taskContextStock = stock;
    _taskContextMode = 'add';
    const menu = document.getElementById('taskContextMenu');
    if (!menu) return;
    menu.querySelectorAll('[data-task-type="yizi"], [data-task-type="changzi"], [data-task-type="hengpan"]').forEach(function(btn) {
        btn.style.display = '';
    });
    const deleteBtn = menu.querySelector('[data-task-type="delete"]');
    if (deleteBtn) deleteBtn.style.display = 'none';
    menu.style.display = 'block';
    const maxLeft = Math.max(8, window.innerWidth - menu.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - menu.offsetHeight - 8);
    menu.style.left = `${Math.min(event.clientX, maxLeft)}px`;
    menu.style.top = `${Math.min(event.clientY, maxTop)}px`;
}

function showTaskDeleteMenu(event, stock) {
    event.preventDefault();
    hideKline();
    _taskContextStock = stock;
    _taskContextMode = 'delete';
    const menu = document.getElementById('taskContextMenu');
    if (!menu) return;
    menu.querySelectorAll('[data-task-type="yizi"], [data-task-type="changzi"], [data-task-type="hengpan"]').forEach(function(btn) {
        btn.style.display = 'none';
    });
    const deleteBtn = menu.querySelector('[data-task-type="delete"]');
    if (deleteBtn) deleteBtn.style.display = '';
    menu.style.display = 'block';
    const maxLeft = Math.max(8, window.innerWidth - menu.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - menu.offsetHeight - 8);
    menu.style.left = `${Math.min(event.clientX, maxLeft)}px`;
    menu.style.top = `${Math.min(event.clientY, maxTop)}px`;
}

function hideTaskContextMenu() {
    const menu = document.getElementById('taskContextMenu');
    if (menu) menu.style.display = 'none';
}

function showTaskIosDialog(config) {
    const overlay = document.getElementById('taskIosOverlay');
    const titleEl = document.getElementById('taskIosTitle');
    const bodyEl = document.getElementById('taskIosBody');
    const actionsEl = document.getElementById('taskIosActions');
    titleEl.textContent = config.title || '';
    bodyEl.innerHTML = config.bodyHtml || '';
    actionsEl.innerHTML = (config.actions || []).map(function(action) {
        return `<button type="button" class="task-ios-btn ${action.className || ''}" data-modal-value="${action.value}">${action.label}</button>`;
    }).join('');
    overlay.style.display = 'flex';
    return new Promise(function(resolve) {
        const done = function(value) {
            overlay.style.display = 'none';
            bodyEl.innerHTML = '';
            actionsEl.innerHTML = '';
            resolve(value);
        };
        const clickHandler = function(e) {
            const button = e.target.closest('[data-modal-value]');
            if (!button) return;
            done(button.getAttribute('data-modal-value'));
        };
        actionsEl.onclick = clickHandler;
        bodyEl.onclick = clickHandler;
        overlay.onclick = function(e) {
            if (e.target === overlay) done('cancel');
        };
    });
}

async function showTaskKlineConfirmDialog() {
    return showTaskIosDialog({
        title: '10天K线特征确认',
        bodyHtml: `
            <div class="task-kline-tip">上下阴线不要太多</div>
            <div class="task-kline-list">
                <div>1.有上引线无下引线</div>
                <div>2.有下引线无上引线</div>
                <div>3.十字星</div>
            </div>
        `,
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' },
            { label: '确认', value: 'confirm' }
        ]
    });
}

async function showTaskGainConfirmDialog() {
    return showTaskIosDialog({
        title: '10天涨幅确认',
        bodyHtml: `
            <div class="task-gain-options">
                <button type="button" class="task-gain-option task-gain-option-green" data-modal-value="lt35">绿色小于35%</button>
                <button type="button" class="task-gain-option task-gain-option-red" data-modal-value="gte35">红色大于35%</button>
            </div>
        `,
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' }
        ]
    });
}

async function showTaskWarnDialog() {
    return showTaskIosDialog({
        title: '警告',
        bodyHtml: '<div class="task-warn-text">涨幅过大</div>',
        actions: [
            { label: '取消添加', value: 'cancel', className: 'task-ios-btn-cancel' },
            { label: '确认添加', value: 'confirm_add' }
        ]
    });
}

async function showTaskDeleteConfirmDialog() {
    return showTaskIosDialog({
        title: '删除股票',
        bodyHtml: '<div>确认删除该股票吗？</div>',
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' },
            { label: '确认', value: 'confirm_delete' }
        ]
    });
}

async function showTaskErrorDialog(message) {
    return showTaskIosDialog({
        title: '提示',
        bodyHtml: `<div>${message}</div>`,
        actions: [
            { label: '确定', value: 'ok' }
        ]
    });
}

async function handleTaskMenuAction(taskType) {
    const stock = _taskContextStock;
    hideTaskContextMenu();
    if (!stock) return;
    try {
        if (taskType === 'delete') {
            const confirmed = await showTaskDeleteConfirmDialog();
            if (confirmed === 'confirm_delete') {
                await removeTaskStock(stock);
            }
            return;
        }
        if (taskType === 'hengpan') {
            await persistTaskStock(stock, 'hengpan', '');
            return;
        }
        const klineConfirm = await showTaskKlineConfirmDialog();
        if (klineConfirm !== 'confirm') return;
        const gainConfirm = await showTaskGainConfirmDialog();
        if (gainConfirm === 'lt35') {
            await persistTaskStock(stock, taskType, 'lt35');
            return;
        }
        if (gainConfirm !== 'gte35') return;
        const warnConfirm = await showTaskWarnDialog();
        if (warnConfirm === 'confirm_add') {
            await persistTaskStock(stock, taskType, 'gte35');
        }
    } catch (e) {
        console.error('[lx5bp][handleTaskMenuAction] 失败:', e);
        await showTaskErrorDialog(e.message || '操作失败');
    }
}

function startCheckTimer() {
    if (_checkTimer) clearInterval(_checkTimer);
    _checkTimer = setInterval(async () => {
        if (!_currentDate) return;
        const today = new Date().toISOString().split('T')[0];
        if (_currentDate !== today) return;
        try {
            const resp = await fetch('/api/lx5bp/check_update');
            const r = await resp.json();
            if (r.success && r.updated) {
                if (_lastTimestamp === null) {
                    _lastTimestamp = r.timestamp;
                } else if (r.timestamp !== _lastTimestamp) {
                    _lastTimestamp = r.timestamp;
                    await loadStocks();
                }
            }
        } catch(e) {}
    }, 5000);
}

function renderColumns(stocks) {
    if (!stocks || stocks.length === 0) {
        document.getElementById('mainContent').innerHTML = '<div class="loading-msg">暂无数据</div>';
        return;
    }

    const safeStocks = Array.isArray(stocks) ? stocks : [];

    const grid = document.createElement('div');
    grid.className = 'columns-grid';

    const sorted = safeStocks.slice().sort(function(a, b) {
        const highGainCountDiff = Number(b.three_day_high_gain_count || 0) - Number(a.three_day_high_gain_count || 0);
        if (highGainCountDiff !== 0) return highGainCountDiff;
        const lowerShadowDiff = Number(a.three_day_lower_shadow_sum || a.lower_shadow_sum || 0) - Number(b.three_day_lower_shadow_sum || b.lower_shadow_sum || 0);
        if (lowerShadowDiff !== 0) return lowerShadowDiff;
        return (b.ref_gain || 0) - (a.ref_gain || 0);
    });

    const col = {
        key: 'three_day_high_gain_count',
        label: '表1 · 三天高涨次数',
        sub: '按最近3天最高涨幅≥6.5%次数由高到低分组，同组按三天下引线和由低到高',
        cls: 'bare-foot',
        fmtVal: v => v + '次',
        fmtLabel: v => v + '次'
    };

    const groups = groupByExact(sorted, col.key);
    grid.appendChild(buildColumn(col, groups));
    grid.appendChild(buildLowerShadowTable(safeStocks));
    grid.appendChild(buildRefLimitUpTable(safeStocks));
    grid.appendChild(buildRefHighGainYangTable(safeStocks));
    grid.appendChild(buildInfoPanel());

    document.getElementById('mainContent').innerHTML = '';
    document.getElementById('mainContent').appendChild(buildLx5bpFocusAlertPanels(safeStocks));
    document.getElementById('mainContent').appendChild(grid);
}

function groupByExact(sorted, key) {
    const map = new Map();
    sorted.forEach(function(s) {
        const v = s[key] || 0;
        if (!map.has(v)) map.set(v, []);
        map.get(v).push(s);
    });
    return Array.from(map.entries()).map(function(entry) {
        return { label: entry[0], stocks: entry[1] };
    });
}

function isLx5bpTable4Stock(stock) {
    return Number(stock && stock.three_day_high_gain_count || 0) >= 1 && Number(stock.ref_high_gain_gte_6_5_and_yang || 0) === 1;
}

function isLx5bpTable3Stock(stock) {
    return Number(stock && stock.three_day_high_gain_count || 0) >= 1;
}

function isLx5bpFocusStock(stock) {
    return isLx5bpTable4Stock(stock) && Number(stock.three_day_near_barefoot_yang_count || 0) >= 2 && Number(stock.three_day_strong_k_count || 0) === 3;
}

function getLx5bpLowerShadowSortValue(stock) {
    return Number(stock && (stock.three_day_lower_shadow_sum || stock.lower_shadow_sum) || 0);
}

function isLx5bpSecondaryFocusStock(stock) {
    return isLx5bpTable3Stock(stock) && !isLx5bpFocusStock(stock) && Number(stock.three_day_near_barefoot_yang_count || 0) >= 2 && Number(stock.three_day_strong_k_count || 0) === 3;
}

function getLx5bpFocusStocks(stocks) {
    const seen = new Set();
    return (stocks || []).filter(function(stock) {
        const code = String(stock && stock.code || '').trim();
        if (!code || seen.has(code) || !isLx5bpFocusStock(stock)) return false;
        seen.add(code);
        return true;
    }).sort(function(a, b) {
        const bareDiff = Number(b.three_day_near_barefoot_yang_count || 0) - Number(a.three_day_near_barefoot_yang_count || 0);
        if (bareDiff !== 0) return bareDiff;
        const strongDiff = Number(b.three_day_strong_k_count || 0) - Number(a.three_day_strong_k_count || 0);
        if (strongDiff !== 0) return strongDiff;
        return Number(b.ref_gain || 0) - Number(a.ref_gain || 0);
    });
}

function getLx5bpSecondaryFocusStocks(stocks) {
    const seen = new Set();
    return (stocks || []).filter(function(stock) {
        const code = String(stock && stock.code || '').trim();
        if (!code || seen.has(code) || !isLx5bpSecondaryFocusStock(stock)) return false;
        seen.add(code);
        return true;
    }).sort(function(a, b) {
        const lowerShadowDiff = getLx5bpLowerShadowSortValue(a) - getLx5bpLowerShadowSortValue(b);
        if (lowerShadowDiff !== 0) return lowerShadowDiff;
        return Number(b.ref_gain || 0) - Number(a.ref_gain || 0);
    });
}

function buildLx5bpFocusAlertPanel(stocks, options) {
    const opts = options || {};
    const focusStocks = opts.secondary ? getLx5bpSecondaryFocusStocks(stocks) : getLx5bpFocusStocks(stocks);
    const panel = document.createElement('div');
    panel.className = 'focus-alert-panel' + (opts.secondary ? ' secondary' : '');
    panel.innerHTML =
        '<div class="focus-alert-header">' +
            '<div>' +
                '<div class="focus-alert-title">' + (opts.title || '今日重点关注股票') + '</div>' +
                '<div class="focus-alert-sub">' + (opts.sub || '表4股票中，最近3天几乎光脚阳线次数大于等于2并且强势K等于3') + '</div>' +
            '</div>' +
            '<span class="focus-alert-count">' + focusStocks.length + ' 只</span>' +
        '</div>';

    if (!focusStocks.length) {
        const empty = document.createElement('div');
        empty.className = 'focus-alert-empty';
        empty.textContent = '暂无符合条件股票';
        panel.appendChild(empty);
        return panel;
    }

    const list = document.createElement('div');
    list.className = 'focus-alert-list';
    focusStocks.forEach(function(stock) {
        const gain = Number(stock.ref_gain || 0);
        const card = document.createElement('div');
        card.className = 'focus-alert-card';
        card.addEventListener('mouseenter', function(e) { showKline(e, stock.code, stock.name); });
        card.addEventListener('mouseleave', hideKline);
        card.addEventListener('mousemove', moveTooltip);
        card.addEventListener('contextmenu', function(e) { showTaskContextMenu(e, stock); });
        card.innerHTML =
            '<div class="focus-alert-card-top">' +
                '<span class="focus-alert-name" title="' + stock.code + ' ' + stock.name + '">' + (stock.name || '') + '</span>' +
                '<span class="focus-alert-code">' + (stock.code || '') + '</span>' +
            '</div>' +
            '<div class="focus-alert-meta">' +
                '<span>几乎光脚 ' + Number(stock.three_day_near_barefoot_yang_count || 0) + ' 次</span>' +
                '<span>强势K ' + Number(stock.three_day_strong_k_count || 0) + ' 次</span>' +
            '</div>' +
            '<div class="focus-alert-meta">' +
                '<span>' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                '<span>最高 ' + Number(stock.ref_high_gain || 0).toFixed(2) + '%</span>' +
            '</div>';
        list.appendChild(card);
    });
    panel.appendChild(list);
    return panel;
}

function buildLx5bpSecondaryFocusAlertPanel(stocks) {
    return buildLx5bpFocusAlertPanel(stocks, {
        secondary: true,
        title: '今日次重点关注',
        sub: '表3股票中，几乎光脚大于等于2次且强势K次数为3'

        nd.className = 'no-data';
        nd.textContent = '暂无数据';
        colDiv.appendChild(nd);
        return colDiv;
    }

        const labelDiv = document.createElement('div');
        labelDiv.className = 'group-label ' + col.cls;
        labelDiv.textContent = col.fmtLabel(group.label) + '  (' + group.stocks.length + ')';

        const rowHeader = document.createElement('div');
        rowHeader.className = 'stock-row-header';
        rowHeader.innerHTML = '<span>名称</span><span>涨幅</span><span>三天高涨</span><span>下引线和</span>';
        colDiv.appendChild(rowHeader);

        group.stocks.sort(function(a, b) {
            const lowerShadowDiff = Number(a.three_day_lower_shadow_sum || a.lower_shadow_sum || 0) - Number(b.three_day_lower_shadow_sum || b.lower_shadow_sum || 0);
            if (lowerShadowDiff !== 0) return lowerShadowDiff;
            return (b.ref_gain || 0) - (a.ref_gain || 0);
        });

        group.stocks.forEach(function(s) {
            const row = document.createElement('div');
            row.className = 'stock-row';
            row.addEventListener('mouseenter', function(e) { showKline(e, s.code, s.name); });
            row.addEventListener('mouseleave', hideKline);
            row.addEventListener('mousemove', moveTooltip);
            row.addEventListener('contextmenu', function(e) { showTaskContextMenu(e, s); });

            const gain = s.ref_gain || 0;
            const gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
            const threeDayHighGainCount = Number(s.three_day_high_gain_count || 0);
            const threeDayLowerShadowSum = Number(s.three_day_lower_shadow_sum || s.lower_shadow_sum || 0);

            row.innerHTML =
                '<div class="stock-name"><span class="s-name" title="' + s.code + ' ' + s.name + '">' + s.name + '</span><span class="s-code">' + s.code + '</span></div>' +
                '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                '<span class="s-metric good">' + threeDayHighGainCount + '次</span>' +
                '<span class="s-metric extra">' + threeDayLowerShadowSum.toFixed(2) + '%</span>';

            colDiv.appendChild(row);
        });
    });

    return colDiv;
}
