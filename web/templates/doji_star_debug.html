<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阴线都是十字星 - 调试</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .section { background: white; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: hidden; white-space: pre-wrap; word-break: break-all; }
        h2 { margin-top: 0; }
        @media (max-width: 768px) {
            body { padding: 10px; overflow-x: hidden; }
            .section { padding: 12px; }
            button {
                width: 100%;
                max-width: 100%;
                min-height: 36px;
            }
            pre { font-size: 12px; }
        }
    </style>
</head>
<body>
    <h1>阴线都是十字星 - 调试信息</h1>
    
    <div class="section">
        <h2>1. 测试API连接</h2>
        <button onclick="testAPI()">测试 /api/doji_star/stocks</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="section">
        <h2>2. 测试检查更新</h2>
        <button onclick="testCheckUpdate()">测试 /api/doji_star/check_update</button>
        <div id="checkUpdateResult"></div>
    </div>
    
    <div class="section">
        <h2>3. 浏览器控制台</h2>
        <p>按F12打开控制台查看详细日志</p>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.innerHTML = '<p class="warning">正在请求...</p>';
            
            try {
                const response = await fetch('/api/doji_star/stocks');
                const result = await response.json();
                
                console.log('API Response:', result);
                
                let html = '<h3>响应结果:</h3>';
                html += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.success) {
                    html += '<p class="success">✓ API调用成功</p>';
                    html += '<p>数据数量: ' + (result.data ? result.data.length : 0) + '</p>';
                    
                    if (result.data && result.data.length > 0) {
                        html += '<h4>第一条数据样本:</h4>';
                        html += '<pre>' + JSON.stringify(result.data[0], null, 2) + '</pre>';
                    } else {
                        html += '<p class="error">✗ 没有数据返回</p>';
                        html += '<p>可能原因:</p>';
                        html += '<ul>';
                        html += '<li>Redis中没有数据</li>';
                        html += '<li>Key名称不匹配</li>';
                        html += '<li>今天的日期没有数据</li>';
                        html += '</ul>';
                    }
                } else {
                    html += '<p class="error">✗ API调用失败: ' + (result.error || '未知错误') + '</p>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<p class="error">✗ 请求失败: ' + error.message + '</p>';
                console.error('API Error:', error);
            }
        }
        
        async function testCheckUpdate() {
            const resultDiv = document.getElementById('checkUpdateResult');
            resultDiv.innerHTML = '<p class="warning">正在请求...</p>';
            
            try {
                const response = await fetch('/api/doji_star/check_update');
                const result = await response.json();
                
                console.log('Check Update Response:', result);
                
                let html = '<h3>响应结果:</h3>';
                html += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.success) {
                    html += '<p class="success">✓ API调用成功</p>';
                    
                    if (result.updated) {
                        html += '<p class="success">✓ Redis中有数据</p>';
                        html += '<p>数据数量: ' + result.count + '</p>';
                        html += '<p>时间戳: ' + result.timestamp + '</p>';
                    } else {
                        html += '<p class="error">✗ Redis中没有数据</p>';
                        html += '<p>Key: stocks_yxdszx:' + new Date().toISOString().split('T')[0] + '</p>';
                    }
                } else {
                    html += '<p class="error">✗ API调用失败: ' + (result.error || '未知错误') + '</p>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<p class="error">✗ 请求失败: ' + error.message + '</p>';
                console.error('Check Update Error:', error);
            }
        }
        
        // 页面加载时自动测试
        window.addEventListener('DOMContentLoaded', () => {
            console.log('调试页面已加载');
            testAPI();
            testCheckUpdate();
        });
    </script>
</body>
</html>
