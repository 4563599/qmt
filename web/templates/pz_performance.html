<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>盘中性能</title>
    <style>
        :root {
            --grid: #c7c7c7;
            --grid-dark: #8e8e8e;
            --head: #ececec;
            --head-strong: #d9d9d9;
            --text: #1a1a1a;
            --muted: #666;
            --warn: #fff0b3;
            --failed: #fde5e5;
            --success: #eef6ee;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: #fff; color: var(--text); }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }
        .page { width: 100%; padding: 14px; }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .title-wrap { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
        h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
        .summary { color: var(--muted); white-space: nowrap; }
        .controls { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
        label { color: #444; }
        select, button, .nav-link {
            height: 30px;
            border: 1px solid #aaa;
            border-radius: 2px;
            background: #fff;
            color: #111;
            padding: 0 9px;
            font: inherit;
        }
        button { cursor: pointer; }
        button:hover, .nav-link:hover { background: #f1f1f1; }
        .nav-link { display: inline-flex; align-items: center; text-decoration: none; }
        .status-line {
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 4px 7px;
            border: 1px solid var(--grid);
            border-bottom: 0;
            color: #444;
        }
        .sheet-wrap {
            width: 100%;
            overflow: auto;
            border: 1px solid var(--grid-dark);
            max-height: calc(100vh - 112px);
            background: #fff;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            min-width: 2680px;
            width: 100%;
        }
        th, td {
            height: 31px;
            padding: 5px 7px;
            border-right: 1px solid var(--grid);
            border-bottom: 1px solid var(--grid);
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        thead th {
            position: sticky;
            z-index: 4;
            background: var(--head);
            font-weight: 700;
        }
        thead tr:first-child th { top: 0; height: 30px; background: var(--head-strong); }
        thead tr:nth-child(2) th { top: 30px; }
        tbody tr:hover td { background: #f5f7fa; }
        tbody tr.failed td { background: var(--failed); }
        tbody tr.failed:hover td { background: #f9d9d9; }
        td.slow { background: var(--warn) !important; font-weight: 700; }
        td.status-success { background: var(--success); font-weight: 700; }
        td.status-failed { background: var(--failed); color: #9c1111; font-weight: 700; }
        .sticky-time, .sticky-status { position: sticky; z-index: 2; background: #fff; }
        thead .sticky-time, thead .sticky-status { z-index: 6; }
        .sticky-time { left: 0; }
        .sticky-status { left: 154px; }
        tbody tr.failed .sticky-time, tbody tr.failed .sticky-status { background: var(--failed); }
        .error-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
        .empty { padding: 36px 12px; color: var(--muted); }
        .w-time { width: 154px; }
        .w-status { width: 68px; }
        .w-small { width: 72px; }
        .w-medium { width: 92px; }
        .w-stage { width: 116px; }
        .w-error { width: 280px; }
        @media (max-width: 720px) {
            body { font-size: 12px; }
            .page { padding: 6px; }
            .toolbar { align-items: flex-start; }
            .title-wrap { display: block; }
            h1 { font-size: 18px; margin-bottom: 3px; }
            .controls { gap: 4px; }
            select, button, .nav-link { height: 28px; padding: 0 6px; }
            .sheet-wrap { max-height: calc(100vh - 126px); }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="toolbar">
        <div class="title-wrap">
            <h1>盘中性能</h1>
            <span class="summary" id="summary">加载中</span>
        </div>
        <div class="controls">
            <label for="dateSelect">日期</label>
            <select id="dateSelect" aria-label="选择性能日期"></select>
            <label for="limitSelect">显示</label>
            <select id="limitSelect" aria-label="选择显示轮数">
                <option value="100">100轮</option>
                <option value="500">500轮</option>
                <option value="all">全部</option>
            </select>
            <button type="button" id="refreshButton">刷新</button>
            <a class="nav-link" href="/推送日志">推送日志</a>
            <a class="nav-link" href="/重点关注">重点关注</a>
        </div>
    </header>

    <div class="status-line" aria-live="polite">
        <span id="statusText">正在读取性能记录...</span>
        <span id="updatedAt"></span>
    </div>

    <div class="sheet-wrap" id="sheetWrap">
        <table aria-label="盘中每轮性能明细">
            <thead>
                <tr>
                    <th class="sticky-time" colspan="4">轮次</th>
                    <th colspan="6">数量</th>
                    <th colspan="2">扫描耗时</th>
                    <th colspan="4">Redis耗时</th>
                    <th colspan="2">PZ K线</th>
                    <th colspan="2">QY1 K线</th>
                    <th colspan="2">QY2 K线</th>
                    <th colspan="3">结果</th>
                </tr>
                <tr>
                    <th class="w-time sticky-time">完成时间</th>
                    <th class="w-status sticky-status">状态</th>
                    <th class="w-small">轮数</th>
                    <th class="w-medium">实际间隔(s)</th>
                    <th class="w-small">全市场</th>
                    <th class="w-small">≥5%候选</th>
                    <th class="w-small">PZ</th>
                    <th class="w-small">PZ1</th>
                    <th class="w-small">QY1</th>
                    <th class="w-small">QY2</th>
                    <th class="w-small">快照(s)</th>
                    <th class="w-small">筛选(s)</th>
                    <th class="w-small">PZ(s)</th>
                    <th class="w-small">PZ1(s)</th>
                    <th class="w-small">QY1(s)</th>
                    <th class="w-small">QY2(s)</th>
                    <th class="w-small">历史(s)</th>
                    <th class="w-small">实时(s)</th>
                    <th class="w-small">历史(s)</th>
                    <th class="w-small">实时(s)</th>
                    <th class="w-small">历史(s)</th>
                    <th class="w-small">实时(s)</th>
                    <th class="w-small">总耗时(s)</th>
                    <th class="w-stage">失败阶段</th>
                    <th class="w-error">错误</th>
                </tr>
            </thead>
            <tbody id="performanceBody">
                <tr><td class="empty" colspan="25">正在加载...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    const AUTO_REFRESH_MS = 3000;
    const API_DATES = '/api/pz/performance/dates';
    const API_ROWS = '/api/pz/performance';
    const dateSelect = document.getElementById('dateSelect');
    const limitSelect = document.getElementById('limitSelect');
    const refreshButton = document.getElementById('refreshButton');
    const statusText = document.getElementById('statusText');
    const updatedAt = document.getElementById('updatedAt');
    const summary = document.getElementById('summary');
    const body = document.getElementById('performanceBody');
    const sheetWrap = document.getElementById('sheetWrap');
    let loading = false;

    function text(value, fallback = '-') {
        if (value === null || value === undefined || value === '') return fallback;
        return String(value);
    }

    function numberValue(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
    }

    function seconds(value) {
        if (value === null || value === undefined || value === '') return '-';
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed.toFixed(3) : '-';
    }

    function cell(value, className = '', title = '') {
        const td = document.createElement('td');
        if (className) td.className = className;
        td.textContent = text(value);
        if (title) td.title = title;
        return td;
    }

    function timedCell(value, threshold) {
        const td = cell(seconds(value));
        if (numberValue(value) > threshold) td.classList.add('slow');
        return td;
    }

    function appendKlinePair(rowElement, historyValue, realtimeValue) {
        const isSlow = numberValue(historyValue) + numberValue(realtimeValue) > 2;
        const historyCell = cell(seconds(historyValue));
        const realtimeCell = cell(seconds(realtimeValue));
        if (isSlow) {
            historyCell.classList.add('slow');
            realtimeCell.classList.add('slow');
        }
        rowElement.appendChild(historyCell);
        rowElement.appendChild(realtimeCell);
    }

    function renderRows(rows) {
        if (!Array.isArray(rows) || rows.length === 0) {
            body.innerHTML = '<tr><td class="empty" colspan="25">当前日期没有性能记录</td></tr>';
            return;
        }
        const fragment = document.createDocumentFragment();
        rows.forEach((row) => {
            const tr = document.createElement('tr');
            const failed = String(row.status || '').toLowerCase() !== 'success';
            if (failed) tr.classList.add('failed');
            const finished = row.finished_at || row.failed_at || row.recorded_at || '-';
            const statusLabel = failed ? '失败' : '成功';
            tr.appendChild(cell(finished, 'sticky-time'));
            tr.appendChild(cell(statusLabel, `sticky-status status-${failed ? 'failed' : 'success'}`));
            tr.appendChild(cell(row.cycle_count));
            tr.appendChild(cell(seconds(row.actual_interval_seconds)));
            tr.appendChild(cell(row.scanned_count));
            tr.appendChild(cell(row.gain_candidate_count));
            tr.appendChild(cell(row.selected_count));
            tr.appendChild(cell(row.pz1_selected_count));
            tr.appendChild(cell(row.qy1_selected_count));
            tr.appendChild(cell(row.qy2_selected_count));
            tr.appendChild(timedCell(row.tick_seconds, 1));
            tr.appendChild(timedCell(row.filter_seconds, 2));
            tr.appendChild(timedCell(row.pz_redis_seconds, 2));
            tr.appendChild(timedCell(row.pz1_redis_seconds, 2));
            tr.appendChild(timedCell(row.qy1_redis_seconds, 2));
            tr.appendChild(timedCell(row.qy2_redis_seconds, 2));
            appendKlinePair(tr, row.kline_history_seconds, row.kline_realtime_seconds);
            appendKlinePair(tr, row.qy1_kline_history_seconds, row.qy1_kline_realtime_seconds);
            appendKlinePair(tr, row.qy2_kline_history_seconds, row.qy2_kline_realtime_seconds);
            tr.appendChild(timedCell(row.total_seconds, 5));
            tr.appendChild(cell(row.failed_stage));
            tr.appendChild(cell(row.error, 'error-cell', text(row.error, '')));
            fragment.appendChild(tr);
        });
        body.replaceChildren(fragment);
    }

    async function loadDates() {
        const selected = dateSelect.value;
        const response = await fetch(API_DATES, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload.success) throw new Error(payload.error || '日期读取失败');
        const dates = Array.isArray(payload.dates) ? payload.dates : [];
        dateSelect.replaceChildren();
        dates.forEach((date) => {
            const option = document.createElement('option');
            option.value = date;
            option.textContent = date;
            dateSelect.appendChild(option);
        });
        if (selected && dates.includes(selected)) dateSelect.value = selected;
        return dates;
    }

    async function loadRows(manual = false) {
        if (loading) return;
        loading = true;
        const scrollLeft = sheetWrap.scrollLeft;
        const scrollTop = sheetWrap.scrollTop;
        try {
            const date = dateSelect.value;
            const limit = limitSelect.value;
            if (!date) throw new Error('没有可用的性能记录日期');
            if (manual) statusText.textContent = '正在刷新...';
            const params = new URLSearchParams({ date, limit, offset: '0' });
            const response = await fetch(`${API_ROWS}?${params.toString()}`, { cache: 'no-store' });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error(payload.error || '性能记录读取失败');
            renderRows(payload.data);
            summary.textContent = `${payload.date} · 显示${payload.count}轮 / 共${payload.total_count}轮`;
            statusText.textContent = '每3秒自动刷新，时间由近到远';
            updatedAt.textContent = payload.updated_at ? `最新记录 ${payload.updated_at}` : '';
            sheetWrap.scrollLeft = scrollLeft;
            sheetWrap.scrollTop = scrollTop;
        } catch (error) {
            statusText.textContent = error.message || String(error);
            summary.textContent = '加载失败';
            if (manual) body.innerHTML = `<tr><td class="empty" colspan="25">${statusText.textContent}</td></tr>`;
        } finally {
            loading = false;
        }
    }

    async function initialize() {
        try {
            const dates = await loadDates();
            if (!dates.length) throw new Error('没有可用的性能记录日期');
            await loadRows(true);
        } catch (error) {
            statusText.textContent = error.message || String(error);
            summary.textContent = '暂无数据';
            body.innerHTML = `<tr><td class="empty" colspan="25">${statusText.textContent}</td></tr>`;
        }
    }

    dateSelect.addEventListener('change', () => loadRows(true));
    limitSelect.addEventListener('change', () => loadRows(true));
    refreshButton.addEventListener('click', () => loadRows(true));
    window.setInterval(() => loadRows(false), AUTO_REFRESH_MS);
    initialize();
</script>
</body>
</html>
