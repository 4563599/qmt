<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>极品关注</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1480px; margin: 0 auto; }

        .nav-buttons {
            margin-bottom: 10px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-left { display: flex; gap: 10px; align-items: center; }
        .nav-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-start; }

        .nav-btn {
            display: inline-block;
            padding: 5px 9px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .nav-btn-home { background: #667eea; }
        .nav-btn-home:hover { background: #5568d3; transform: translateY(-2px); }
        .nav-btn-yhy { background: #e11d48; }
        .nav-btn-yhy:hover { background: #be123c; transform: translateY(-2px); }
        .nav-btn-5ls { background: #8b5cf6; }
        .nav-btn-5ls:hover { background: #7c3aed; transform: translateY(-2px); }
        .nav-btn-yx205 { background: #06b6d4; }
        .nav-btn-yx205:hover { background: #0891b2; transform: translateY(-2px); }
        .nav-btn-ztorgj { background: #d946ef; }
        .nav-btn-ztorgj:hover { background: #c026d3; transform: translateY(-2px); }
        .nav-btn-lx5bp { background: #f43f5e; }
        .nav-btn-lx5bp:hover { background: #e11d48; transform: translateY(-2px); }
        .nav-btn-lszty { background: #e11d48; }
        .nav-btn-lszty:hover { background: #be123c; transform: translateY(-2px); }
        .nav-btn-jpgz { background: #f59e0b; }
        .nav-btn-jpgz:hover { background: #d97706; transform: translateY(-2px); }

        .date-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 4px 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .date-nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            font-weight: 500;
            min-width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .date-nav-btn:hover { background: #5568d3; transform: scale(1.05); }
        .date-nav-btn:disabled { background: #ccc; cursor: not-allowed; transform: scale(1); }
        #datePicker {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            width: auto;
            min-width: 95px;
            max-width: 105px;
        }

        .page-title {
            background: white;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .page-title h1 { font-size: 22px; font-weight: 700; color: #1d1d1f; }
        .page-title .badge {

            font-weight: 600;

        }
        .page-title .desc { color: #6b7280; font-size: 13px; }

        .columns-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            min-width: 0;
        }

        .day-column {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border: 1px solid #e0e0e0;

        }
        .day-column.focused {

        }

        .day-header {

            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;

            text-align: center;
            border-bottom: 1px solid #dbeafe;
        }
        .day-column.focused .day-header {

        }

        .group-header {

        }
        .group-header.yizi { background: #2563eb; }
        .group-header.changzi { background: #dc2626; }
        .group-header.hengpan { background: #7c3aed; }
        .manual-entry-btn {
            border: 1px solid rgba(124,58,237,0.22);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 14px rgba(124,58,237,0.18);
        }
        .manual-entry-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: translateY(-1px);
        }

        .stock-row-header,
        .stock-row {
            display: grid;
            grid-template-columns: 1.7fr 0.9fr 0.8fr 1.1fr;
            align-items: center;
        }
        .stock-row-header {
            padding: 4px 8px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .stock-row-header span {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
        }
        .stock-row {
            padding: 7px 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stock-row:hover { background: #f8f9fa; }
        .stock-row:last-child { border-bottom: none; }

        .task-context-menu {
            position: fixed;
            display: none;
            min-width: 162px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            box-shadow: 0 18px 36px rgba(0,0,0,0.16);
            z-index: 10030;
            overflow: hidden;

        .task-context-btn {
            width: 100%;
            border: 0;
            background: #fff;
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #dc2626;

        }
        .task-context-btn:hover { background: #f9fafb; }
        .task-ios-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 10040;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .task-ios-modal {
            width: min(320px, calc(100vw - 32px));
            background: #fff;

            overflow: hidden;
            box-shadow: 0 12px 42px rgba(0,0,0,0.24);
        }
        .task-ios-title {
            padding: 18px 18px 6px;

            font-size: 17px;
            font-weight: 700;

        }
        .task-ios-body {
            padding: 4px 18px 16px;

            font-size: 14px;
            color: #111827;
            line-height: 1.65;
        }
        .task-ios-actions { display: flex; min-height: 46px; border-top: 0.5px solid #d1d5db; }
        .task-ios-btn {
            flex: 1;
            border: 0;

            font-size: 17px;
            font-weight: 600;
            color: #007aff;
            cursor: pointer;
        }
        .task-ios-btn + .task-ios-btn { border-left: 0.5px solid #d1d5db; }
        .task-ios-btn-cancel { color: #6b7280; }
        .manual-entry-input {
            width: 100%;

            border-radius: 12px;
            padding: 11px 12px;
            margin-top: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .manual-entry-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
        }
        .manual-entry-note {

            font-size: 13px;
        }
        .manual-task-type-grid {

            grid-template-columns: repeat(3, minmax(0, 1fr));

            margin-top: 12px;

        .manual-task-type-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            border-radius: 14px;
            padding: 14px 8px;
            font-size: 14px;
            font-weight: 700;
            color: #111827;

            line-height: 1.35;

            background: #f9fafb;
        }
        .manual-task-type-btn.yizi {
            color: #2563eb;
            border-color: rgba(37,99,235,0.28);
            background: rgba(37,99,235,0.07);
        }
        .manual-task-type-btn.changzi {
            color: #dc2626;
            border-color: rgba(220,38,38,0.28);
            background: rgba(220,38,38,0.07);
        }
        .manual-task-type-btn.hengpan {
            color: #7c3aed;
            border-color: rgba(124,58,237,0.28);
            background: rgba(124,58,237,0.07);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .stock-name .s-name {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;

        .stock-name .s-code {
            font-size: 10px;
            font-weight: 600;
            color: #4b5563;
        }

        .stock-change, .stock-cap, .stock-source {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .stock-source {
            color: #4b5563;
            font-size: 11px;
            white-space: normal;
            word-break: break-all;
            overflow-wrap: anywhere;
            line-height: 1.35;
        }
        .positive { color: #e74c3c; font-weight: bold; }
        .negative { color: #27ae60; font-weight: bold; }
        .neutral { color: #95a5a6; }

        .no-data {
            padding: 12px 10px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
        }

        .loading-msg {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 14px;
        }

        .stock-tooltip {
            position: fixed;
            display: none;
            background: #fff;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 10000;
            pointer-events: none;
        }
        .stock-tooltip img {
            display: block;
            width: 680px;
            height: 380px;
            background: #f5f5f7;
        }
        .stock-tooltip .tooltip-header {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            text-align: center;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .nav-btn {
                flex: 1 1 calc(50% - 4px);
                min-width: 0;
                padding: 8px 6px;
                font-size: 12px;
                white-space: normal;
                word-break: keep-all;
                line-height: 1.3;
                text-align: center;
            }
            .columns-grid { grid-template-columns: 1fr; }
            .day-column { min-width: unset; }
            .stock-tooltip img { width: 100%; max-width: 600px; height: auto; }
        }
        /* mobile no-scroll baseline */
        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }
            .container,
            .content,
            .table-container,
            .group-table-container,
            .table-wrap {
                max-width: 100%;
                overflow-x: hidden !important;
            }
            table,
            .stock-table {
                width: 100%;
                table-layout: fixed;
            }
            th,
            td,
            .stock-table th,
            .stock-table td,
            .stock-name,
            .s-name,
            .strategy-tag,
            .nav-btn,
            .group-title,
            .group-name {
                white-space: normal !important;
                word-break: break-all;
                overflow-wrap: anywhere;
            }
            #datePicker,
            .date-display {
                min-width: 0 !important;
                width: 100%;
                max-width: 100%;
            }
        }
        /* mobile density tuning */
        @media (max-width: 768px) {
            .nav-btn {
                padding: 7px 5px;
                font-size: 11px;
            }
            .columns-grid {
                gap: 10px;
            }
            .day-header,
            .stock-row-header {
                padding: 10px 12px;
            }
            th,
            td {
                font-size: 11px;
                padding: 6px 4px;
            }
        }
        @media (max-width: 768px) {
            body { padding: 10px; overflow-x: hidden; }
            .nav-buttons { gap: 10px; }
            .date-selector { width: 100%; justify-content: center; flex-wrap: wrap; }
            .page-title { padding: 10px 12px; gap: 6px; }
            .page-title h1 { font-size: 18px; }
            #datePicker { min-width: 0 !important; width: 100%; max-width: 100%; }

</head>
<body>

<div class="stock-tooltip" id="klineTooltip">
    <div class="tooltip-header" id="klineTtHeader"></div>

<div id="taskContextMenu" class="task-context-menu">

<div id="taskIosOverlay" class="task-ios-overlay">

<div class="container">
    <div class="nav-buttons">
        <div class="nav-left">
            <div class="date-selector">
                <button class="date-nav-btn" id="prevDateBtn" onclick="prevDate()">◀</button>
                <input type="text" id="datePicker" placeholder="选择日期" readonly>

            <a href="/涨停或光脚" class="nav-btn nav-btn-ztorgj">涨停或光脚</a>

            <a href="/连续涨停" class="nav-btn nav-btn-lszty">连续涨停</a>
                <a href="/连续4天拉升" class="nav-btn nav-btn-intraday4up" style="background:#f97316;">连续4天拉升</a>

    <div class="page-title">
        <h1>极品关注</h1>
        <span class="badge">最近5日</span>
        <span class="desc">最近5个交易日 · 今日任务列表 · 按一字特征 / 厂子特征 / 横盘调整特征分组显示</span>
        <button type="button" class="manual-entry-btn" onclick="handleManualEntry(_allDates[_currentDateIdx] || '')">手动录入</button>
    </div>

    <div id="mainContent">
        <div class="loading-msg">正在加载最近5个交易日任务列表...</div>
    </div>
</div>

<script>
let _allData = {};
let _allDates = [];
let _currentDateIdx = 0;
let _flatpickrInstance = null;
let _realtimeTimer = null;
let _taskContextStock = null;
let _taskContextDate = '';

function groupTasksByType(tasks) {
    const groups = { yizi: [], changzi: [], hengpan: [] };
    (tasks || []).forEach(function(task) {
        const key = String(task.task_type || '').trim();
        if (!Object.prototype.hasOwnProperty.call(groups, key)) return;
        groups[key].push(task);
    });
    Object.keys(groups).forEach(function(key) {
        groups[key].sort(function(a, b) {
            return Number(b.today_change || 0) - Number(a.today_change || 0);
        });
    });
    return groups;
}

function fmtChange(val) {
    if (val === null || val === undefined) return '-';
    const n = parseFloat(val);
    if (isNaN(n)) return '-';
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

function changeClass(val) {
    const n = parseFloat(val);
    if (isNaN(n) || n === 0) return 'neutral';
    return n > 0 ? 'positive' : 'negative';
}

function fmtCap(val) {
    const n = parseFloat(val);
    if (!n || n <= 0) return '-';
    return n.toFixed(0) + '亿';
}

function getEmPrefix(code) {
    return String(code || '').startsWith('6') ? '1' : '0';
}

const _tooltip = document.getElementById('klineTooltip');
const _klineImg = document.getElementById('klineImage');
const _klineTtH = document.getElementById('klineTtHeader');

function showKline(e, code, name) {
    const pfx = getEmPrefix(code);
    _klineImg.src = 'https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=' + pfx + '.' + code + '&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1';
    _klineTtH.textContent = name + ' (' + code + ') - 日K线';
    _tooltip.style.display = 'block';
    moveTooltip(e);
}

function hideKline() {
    _tooltip.style.display = 'none';
    _klineImg.src = '';
}

function moveTooltip(e) {
    const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 710;
    const h = window.innerWidth <= 768 ? 250 : 400;
    let l = e.clientX + 15;
    let t = e.clientY + 15;
    if (l + w > window.innerWidth) l = e.clientX - w - 15;
    if (t + h > window.innerHeight) t = e.clientY - h - 15;
    if (l < 0) l = 10;
    if (t < 0) t = 10;
    _tooltip.style.left = l + 'px';
    _tooltip.style.top = t + 'px';
}

function isTradingTime() {
    const now = new Date();
    if (now.getDay() === 0 || now.getDay() === 6) return false;
    const t = now.getHours() * 60 + now.getMinutes();
    return (t >= 9 * 60 + 30 && t < 11 * 60 + 30) || (t >= 13 * 60 && t < 15 * 60);
}

function buildStockRow(stock, date) {
    const row = document.createElement('div');
    row.className = 'stock-row';
    row.dataset.code = stock.code;
    row.dataset.date = date;

    const sourcePages = Array.isArray(stock.source_pages) ? stock.source_pages : [];
    const sourceText = sourcePages.length ? sourcePages.join(' / ') : (stock.source_page || '-');

    row.innerHTML = `
        <div class="stock-name">
            <span class="s-name" title="${stock.name} ${stock.code}">${stock.name}</span>
            <span class="s-code">${stock.code}</span>
        </div>
        <span class="stock-change ${changeClass(stock.today_change)}">${fmtChange(stock.today_change)}</span>
        <span class="stock-cap" data-market-cap-code="${stock.code}" data-market-cap-decimals="2" data-market-cap-unit="亿">${fmtCap(stock.market_cap)}</span>
        <span class="stock-source" title="${sourceText}">${sourceText}</span>
    `;

    row.addEventListener('mouseenter', function(e) { showKline(e, stock.code, stock.name); });
    row.addEventListener('mouseleave', hideKline);
    row.addEventListener('mousemove', moveTooltip);
    row.addEventListener('contextmenu', function(e) { showTaskDeleteMenu(e, stock, date); });
    return row;
}

function buildTableHeader() {
    const h = document.createElement('div');
    h.className = 'stock-row-header';
    h.innerHTML = '<span>名称</span><span>涨跌幅</span><span>市值</span><span>来源</span>';
    return h;
}

function buildTaskGroup(title, cls, stocks, date) {
    const block = document.createElement('div');

    const header = document.createElement('div');
    header.className = 'group-header ' + cls;
    header.textContent = title;
    block.appendChild(header);
    block.appendChild(buildTableHeader());

    const list = document.createElement('div');
    if (!stocks || stocks.length === 0) {
        const nd = document.createElement('div');
        nd.className = 'no-data';
        nd.textContent = '暂无数据';
        list.appendChild(nd);
    } else {
        stocks.forEach(function(stock) {
            list.appendChild(buildStockRow(stock, date));
        });
    }
    block.appendChild(list);
    return block;
}

function buildDayColumn(date, dayData, isFocused) {
    const col = document.createElement('div');
    col.className = 'day-column' + (isFocused ? ' focused' : '');
    col.dataset.date = date;

    const mm = date.slice(5, 7);
    const dd = date.slice(8, 10);
    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = mm + '-' + dd;
    col.appendChild(header);

    col.appendChild(buildTaskGroup('一字特征', 'yizi', (dayData.yizi || []).slice(), date));
    col.appendChild(buildTaskGroup('厂子特征', 'changzi', (dayData.changzi || []).slice(), date));
    col.appendChild(buildTaskGroup('横盘调整特征', 'hengpan', (dayData.hengpan || []).slice(), date));
    return col;
}

function rerenderDayColumn(date) {
    const idx = _allDates.indexOf(date);
    if (idx === -1) return;
    const oldCol = document.querySelector('.day-column[data-date="' + date + '"]');
    if (!oldCol) return;
    const newCol = buildDayColumn(date, _allData[date] || {}, idx === _currentDateIdx);
    oldCol.replaceWith(newCol);
}

function renderColumns() {
    const grid = document.createElement('div');
    grid.className = 'columns-grid';
    _allDates.forEach(function(date, idx) {
        grid.appendChild(buildDayColumn(date, _allData[date] || {}, idx === _currentDateIdx));
    });
    const main = document.getElementById('mainContent');
    main.innerHTML = '';
    main.appendChild(grid);
}

function showTaskDeleteMenu(event, stock, date) {
    event.preventDefault();
    hideKline();
    _taskContextStock = stock;
    _taskContextDate = date;
    const menu = document.getElementById('taskContextMenu');
    if (!menu) return;
    menu.style.display = 'block';
    const maxLeft = Math.max(8, window.innerWidth - menu.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - menu.offsetHeight - 8);
    menu.style.left = `${Math.min(event.clientX, maxLeft)}px`;
    menu.style.top = `${Math.min(event.clientY, maxTop)}px`;
}

function hideTaskContextMenu() {
    const menu = document.getElementById('taskContextMenu');
    if (menu) menu.style.display = 'none';
}

function showTaskIosDialog(config) {
    const overlay = document.getElementById('taskIosOverlay');
    const titleEl = document.getElementById('taskIosTitle');
    const bodyEl = document.getElementById('taskIosBody');
    const actionsEl = document.getElementById('taskIosActions');
    titleEl.textContent = config.title || '';
    bodyEl.innerHTML = config.bodyHtml || '';
    actionsEl.innerHTML = (config.actions || []).map(function(action) {
        return `<button type="button" class="task-ios-btn ${action.className || ''}" data-modal-value="${action.value}">${action.label}</button>`;
    }).join('');
    overlay.style.display = 'flex';
    if (typeof config.onOpen === 'function') {
        setTimeout(function() {
            config.onOpen({ overlay, titleEl, bodyEl, actionsEl });
        }, 0);
    }
    return new Promise(function(resolve) {
        const done = function(value) {
            let resolvedValue = value;
            if (typeof config.beforeResolve === 'function') {
                resolvedValue = config.beforeResolve(value, { overlay, titleEl, bodyEl, actionsEl });
            }
            overlay.style.display = 'none';
            bodyEl.innerHTML = '';
            actionsEl.innerHTML = '';
            resolve(resolvedValue);
        };
        const clickHandler = function(e) {
            const button = e.target.closest('[data-modal-value]');
            if (!button) return;
            done(button.getAttribute('data-modal-value'));
        };
        actionsEl.onclick = clickHandler;
        bodyEl.onclick = clickHandler;
        overlay.onclick = function(e) {
            if (e.target === overlay) done('cancel');
        };
    });
}

async function showTaskDeleteConfirmDialog() {
    return showTaskIosDialog({
        title: '删除股票',
        bodyHtml: '<div>确认删除该股票吗？</div>',
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' },
            { label: '确认', value: 'confirm_delete' }
        ]
    });
}

async function showTaskErrorDialog(message) {
    return showTaskIosDialog({
        title: '提示',
        bodyHtml: `<div>${message}</div>`,
        actions: [{ label: '确定', value: 'ok' }]
    });
}

async function showManualCodeInputDialog() {
    const result = await showTaskIosDialog({
        title: '手动录入股票',
        bodyHtml: `
            <div class="manual-entry-note">请输入6位股票代码，名称会自动查询</div>
            <input type="text" maxlength="6" inputmode="numeric" class="manual-entry-input" data-manual-code-input placeholder="例如 600000">
        `,
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' },
            { label: '查询', value: 'confirm_lookup' }
        ],
        onOpen: function(ctx) {
            const input = ctx.bodyEl.querySelector('[data-manual-code-input]');
            if (input) input.focus();
        },
        beforeResolve: function(value, ctx) {
            if (value !== 'confirm_lookup') return { action: value, code: '' };
            const input = ctx.bodyEl.querySelector('[data-manual-code-input]');
            const code = input ? String(input.value || '').trim() : '';
            return { action: value, code: code };
        }
    });
    return result && result.action === 'confirm_lookup' ? result.code : '';
}

async function showManualTaskTypeDialog(stock) {
    return showTaskIosDialog({
        title: '选择分组',
        bodyHtml: `
            <div>${stock.name}（${stock.code}）</div>
            <div class="manual-entry-note">请选择要加入的任务分组</div>
            <div class="manual-task-type-grid">
                <button type="button" class="manual-task-type-btn yizi" data-modal-value="yizi">一字特征</button>
                <button type="button" class="manual-task-type-btn changzi" data-modal-value="changzi">厂子特征</button>
                <button type="button" class="manual-task-type-btn hengpan" data-modal-value="hengpan">横盘调整特征</button>
            </div>
        `,
        actions: [
            { label: '取消', value: 'cancel', className: 'task-ios-btn-cancel' }
        ]
    });
}

async function lookupManualTaskStock(code) {
    const resp = await fetch('/api/yhy/tasks/manual-lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
    });
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '股票查询失败');
    }
    return result.data || {};
}

async function refreshDayTasks(date) {
    const resp = await fetch('/api/yhy/tasks?date=' + encodeURIComponent(date));
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '任务刷新失败');
    }
    _allData[date] = groupTasksByType(result.data || []);
    rerenderDayColumn(date);
}

async function persistManualTaskStock(date, stock, taskType) {
    const payload = Object.assign({}, stock, {
        date: date,
        task_type: taskType,
        source_page: '手动录入'
    });
    const resp = await fetch('/api/yhy/tasks/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '保存失败');
    }
    await refreshDayTasks(date);
}

async function handleManualEntry(date) {
    hideTaskContextMenu();
    hideKline();
    try {
        const code = await showManualCodeInputDialog();
        if (!code) return;
        const stock = await lookupManualTaskStock(code);
        const taskType = await showManualTaskTypeDialog(stock);
        if (!taskType || taskType === 'cancel') return;
        await persistManualTaskStock(date, stock, taskType);
    } catch (error) {
        await showTaskErrorDialog(error.message || '手动录入失败');
    }
}

async function removeTaskStock(date, stock) {
    const resp = await fetch('/api/yhy/tasks/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            date: date,
            code: stock.code
        })
    });
    const result = await resp.json();
    if (!result.success) {
        throw new Error(result.error || '删除失败');
    }
    const dayData = _allData[date] || {};
    ['yizi', 'changzi', 'hengpan'].forEach(function(taskType) {
        dayData[taskType] = (dayData[taskType] || []).filter(function(item) {
            return String(item.code) !== String(stock.code);
        });
    });
    _allData[date] = dayData;
    rerenderDayColumn(date);
}

async function handleTaskMenuAction(taskType) {
    const stock = _taskContextStock;
    const date = _taskContextDate;
    hideTaskContextMenu();
    if (!stock || !date) return;
    try {
        if (taskType === 'delete') {
            const confirmed = await showTaskDeleteConfirmDialog();
            if (confirmed === 'confirm_delete') {
                await removeTaskStock(date, stock);
            }
        }
    } catch (error) {
        await showTaskErrorDialog(error.message || '操作失败');
    }
}

async function refreshRealtimeChanges() {
    const codeSet = new Set();
    _allDates.forEach(function(date) {
        const dayData = _allData[date] || {};
        ['yizi', 'changzi', 'hengpan'].forEach(function(taskType) {
            (dayData[taskType] || []).forEach(function(stock) {
                if (stock.code) codeSet.add(stock.code);
            });
        });
    });
    if (codeSet.size === 0) return;

    try {
        const resp = await fetch('/api/yx205/realtime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codes: Array.from(codeSet) })
        });
        const result = await resp.json();
        if (!result.success || !result.data) return;
        const realtime = result.data;

        Object.keys(realtime).forEach(function(code) {
            const entry = realtime[code];
            if (!entry || entry.change === undefined) return;
            const change = Number(entry.change || 0);
            _allDates.forEach(function(date) {
                const dayData = _allData[date] || {};
                ['yizi', 'changzi', 'hengpan'].forEach(function(taskType) {
                    (dayData[taskType] || []).forEach(function(stock) {
                        if (String(stock.code) === String(code)) {
                            stock.today_change = change;
                        }
                    });
                });
            });
            document.querySelectorAll('.stock-row[data-code="' + code + '"] .stock-change').forEach(function(el) {
                el.textContent = fmtChange(change);
                el.className = 'stock-change ' + changeClass(change);
            });
        });
    } catch (e) {
        console.error('[jpgz] 实时刷新失败:', e);
    }
}

function startRealtimeTimer() {
    if (_realtimeTimer) clearInterval(_realtimeTimer);
    if (!isTradingTime()) return;
    _realtimeTimer = setInterval(refreshRealtimeChanges, 3000);
}

function initFlatpickr() {
    _flatpickrInstance = flatpickr('#datePicker', {
        enable: _allDates,
        dateFormat: 'Y-m-d',
        defaultDate: _allDates[_currentDateIdx] || null,
        appendTo: document.body,
        locale: {
            weekdays: { shorthand: ['日','一','二','三','四','五','六'], longhand: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'] },
            months: { shorthand: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], longhand: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'] }
        },
        onChange: function(selectedDates, dateStr) {
            const idx = _allDates.indexOf(dateStr);
            if (idx !== -1) {
                _currentDateIdx = idx;
                renderColumns();
                scrollToDate(dateStr);
            }
        }
    });
}

function prevDate() {
    if (_currentDateIdx < _allDates.length - 1) {
        _currentDateIdx++;
        if (_flatpickrInstance) _flatpickrInstance.setDate(_allDates[_currentDateIdx], false);
        renderColumns();
        scrollToDate(_allDates[_currentDateIdx]);
    }
}

function nextDate() {
    if (_currentDateIdx > 0) {
        _currentDateIdx--;
        if (_flatpickrInstance) _flatpickrInstance.setDate(_allDates[_currentDateIdx], false);
        renderColumns();
        scrollToDate(_allDates[_currentDateIdx]);
    }
}

function scrollToDate(date) {
    const col = document.querySelector('.day-column[data-date="' + date + '"]');
    if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

async function init() {
    try {
        const resp = await fetch('/api/jpgz/fiveday');
        const result = await resp.json();
        if (!result.success) throw new Error(result.error || '接口返回失败');

        _allDates = result.dates || [];
        _allData = result.data || {};

        renderColumns();
        if (_allDates.length > 0) {
            initFlatpickr();
        }
        await refreshRealtimeChanges();
        startRealtimeTimer();
    } catch (e) {
        document.getElementById('mainContent').innerHTML =
            '<div class="loading-msg" style="color:#e74c3c">加载失败：' + e.message + '</div>';
    }
}

document.getElementById('taskContextMenu').addEventListener('click', function(e) {
    const action = e.target.closest('[data-task-type]');
    if (!action) return;
    handleTaskMenuAction(action.getAttribute('data-task-type'));
});
document.addEventListener('click', function(e) {
    if (!e.target.closest('#taskContextMenu')) {
        hideTaskContextMenu();
    }
});
window.addEventListener('scroll', hideTaskContextMenu, true);
window.addEventListener('resize', hideTaskContextMenu);

init();
</script>

window.initAsyncMarketCapRefresh({
    dataStores: [() => _allData]
});
