<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涨停或光脚</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ffffff; min-height: 100vh; padding: 20px; margin: 0;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .container.container-break20 { max-width: 1820px; }
        .container.container-break20 .nav-buttons,
        .container.container-break20 .page-title,
        .container.container-break20 .tab-switcher {
            margin-left: 160px;
        }

        /* ── 导航栏 ── */
        .nav-buttons { margin-bottom: 10px; display: flex; justify-content: flex-start; align-items: center; gap: 15px; flex-wrap: wrap; }
        .nav-left { display: flex; gap: 10px; align-items: center; }
        .nav-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-start; }
        .nav-btn {
            display: inline-block; padding: 5px 9px; color: white; text-decoration: none;
            border-radius: 8px; transition: all 0.3s; font-size: 13px; font-weight: 500;
            letter-spacing: 0.1px; white-space: nowrap; flex-shrink: 0;
        }
        .nav-btn-home    { background: #667eea; }
        .nav-btn-home:hover    { background: #5568d3; transform: translateY(-2px); }
        .nav-btn-5lsys3  { background: #ec4899; }
        .nav-btn-5lsys3:hover  { background: #db2777; transform: translateY(-2px); }
        .nav-btn-doji    { background: #f59e0b; }
        .nav-btn-doji:hover    { background: #d97706; transform: translateY(-2px); }
        .nav-btn-up      { background: #0ea5e9; }
        .nav-btn-up:hover      { background: #0284c7; transform: translateY(-2px); }
        .nav-btn-yx205   { background: #06b6d4; }
        .nav-btn-yx205:hover   { background: #0891b2; transform: translateY(-2px); }
        .nav-btn-yinbreak { background: #ca8a04; }
        .nav-btn-yinbreak:hover { background: #a16207; transform: translateY(-2px); }
        .nav-btn-lszty   { background: #e11d48; }
        .nav-btn-lszty:hover   { background: #be123c; transform: translateY(-2px); }
        .nav-btn-sbzt    { background: #f43f5e; }
        .nav-btn-sbzt:hover    { background: #e11d48; transform: translateY(-2px); }
        .nav-btn-ztorgj  { background: #d946ef; }
        .nav-btn-ztorgj:hover  { background: #c026d3; transform: translateY(-2px); }
        .nav-btn-ztqq    { background: #7c3aed; }
        .nav-btn-ztqq:hover    { background: #6d28d9; transform: translateY(-2px); }
        .nav-btn-5ls     { background: #8b5cf6; }
        .nav-btn-5ls:hover     { background: #7c3aed; transform: translateY(-2px); }
        .nav-btn-5lsy2   { background: #ef4444; }
        .nav-btn-5lsy2:hover   { background: #dc2626; transform: translateY(-2px); }
        .nav-btn-5las3gj { background: #f97316; }
        .nav-btn-5las3gj:hover { background: #ea6c0a; transform: translateY(-2px); }
        .nav-btn-jpgz    { background: #f59e0b; }
        .nav-btn-jpgz:hover    { background: #d97706; transform: translateY(-2px); }
        .nav-btn-yhy     { background: #e11d48; }
        .nav-btn-yhy:hover     { background: #be123c; transform: translateY(-2px); }

        /* ── 日期选择器 ── */
        .date-selector { display: flex; align-items: center; gap: 6px; background: white; padding: 4px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .date-nav-btn { background: #d946ef; color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s; font-weight: 500; min-width: 28px; display: flex; align-items: center; justify-content: center; }
        .date-nav-btn:hover { background: #c026d3; transform: scale(1.05); }
        .date-nav-btn:disabled { background: #ccc; cursor: not-allowed; transform: scale(1); }
        #datePicker { background: linear-gradient(135deg, #d946ef, #c026d3); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; width: auto; min-width: 95px; max-width: 105px; }
        .flatpickr-calendar { box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important; border-radius: 12px !important; border: none !important; z-index: 99999 !important; }
        .flatpickr-day.selected { background: linear-gradient(135deg, #d946ef 0%, #c026d3 100%) !important; border-color: #d946ef !important; }
        .flatpickr-months .flatpickr-month { background: #d946ef !important; color: white !important; }
        .flatpickr-current-month .flatpickr-monthDropdown-months { background: #d946ef !important; color: white !important; }
        .flatpickr-weekdays { background: #f2f2f7 !important; }
        span.flatpickr-weekday { color: #8e8e93 !important; font-weight: 600 !important; }

        /* ── 页面标题 ── */
        .page-title { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .page-title h1 { font-size: 22px; font-weight: 700; color: #1d1d1f; margin: 0; }
        .page-title .badge { color: white; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .page-title .desc { color: #6b7280; font-size: 13px; }
        .scan-info-text { color: #2563eb; font-size: 13px; font-weight: 700; }

        /* ── Tab切换 ── */
        .tab-switcher {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #faf5ff, #fdf2f8);
            border: 1px solid #f3e8ff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(217, 70, 239, 0.10);
        }
        .tab-btn {
            border: none;
            border-radius: 12px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            color: #6b7280;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            transform: translateY(-1px);
            color: #374151;
            background: rgba(255,255,255,0.75);
        }
        .tab-btn.active-20 {
            color: white;
            background: linear-gradient(135deg, #f43f5e, #d946ef);
            box-shadow: 0 8px 18px rgba(217, 70, 239, 0.26);
        }
        .tab-btn.active-10 {
            color: white;
            background: linear-gradient(135deg, #0ea5e9, #f59e0b);
            box-shadow: 0 8px 18px rgba(14, 165, 233, 0.24);
        }
        .tab-btn.active-yin20 {
            color: white;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
        }
        .tab-btn.active-limit20 {
            color: white;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.24);
        }
        .tab-btn.active-bare20 {
            color: white;
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 8px 18px rgba(217, 119, 6, 0.24);
        }
        .tab-btn.active-break20 {
            color: white;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.24);
        }
        .tab-btn.active-lsbp {
            color: white;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 8px 18px rgba(168, 85, 247, 0.24);
        }
        .tab-btn.active-yangxian {
            color: white;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.24);
        }
        .tab-btn.active-yangxian1 {
            color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.24);
        }
        .tab-btn.active-5bupeng {
            color: white;
            background: linear-gradient(135deg, #ec4899, #7c3aed);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.24);
        }
        .tab-btn.active-lsyin {
            color: white;
            background: linear-gradient(135deg, #dc2626, #f97316);
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.24);
        }
        .tab-btn.active-yxdy5 {
            color: white;
            background: linear-gradient(135deg, #8b5cf6, #db2777);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.24);
        }
        .tab-btn.active-adjust-break {
            color: white;
            background: linear-gradient(135deg, #059669, #0f766e);
            box-shadow: 0 8px 18px rgba(5, 150, 105, 0.24);
        }

        /* ── 2列表格网格 ── */
        .columns-grid {
            display: grid;
            grid-template-columns: repeat(5, 280px);
            justify-content: start;
            gap: 12px;
            width: fit-content;
            min-width: 0;
            max-width: 100%;
        }
        .columns-grid.columns-grid-wide-counts {
            grid-template-columns: 1.02fr 1.02fr 1.12fr 1.12fr 0.82fr;
            width: 100%;
        }
        .columns-grid.columns-grid-yin20-focus {
            grid-template-columns: 0.76fr 1.02fr 1.02fr 1.12fr 1.12fr 0.82fr;
            align-items: start;
        }
        .columns-grid.columns-grid-break20 {
            grid-template-columns: repeat(6, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
        }
        .columns-grid.columns-grid-lsbp {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
        }

        /* ── 单列容器 ── */
        .metric-column {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border: 1px solid #e0e0e0;
            width: 280px;
            min-width: 280px;
        }
        .columns-grid.columns-grid-wide-counts .metric-column {
            width: auto;
            min-width: 0;
        }
        .columns-grid.columns-grid-break20 .metric-column {
            width: auto;
            min-width: 0;
        }
        .columns-grid.columns-grid-lsbp .metric-column {
            width: auto;
            min-width: 0;
        }
        .metric-column-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .columns-grid.columns-grid-wide-counts .metric-column-stack > .metric-column,
        .columns-grid.columns-grid-wide-counts .metric-column-stack > .task-section {
            width: 100%;
            min-width: 0;
        }
        .task-section {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(124,58,237,0.12);
            border: 1px solid #ddd6fe;
            width: 280px;
            min-width: 280px;
        }
        .columns-grid.columns-grid-wide-counts .task-section {
            width: auto;
            min-width: 0;
        }
        .task-section-header {
            padding: 9px 10px;
            color: #fff;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .task-section-title { font-size: 13px; font-weight: 700; }
        .task-section-sub { font-size: 11px; opacity: 0.9; margin-top: 2px; }
        .task-section-count {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            white-space: nowrap;
        }
        .task-group-block { border-top: 1px solid #ede9fe; }
        .task-group-block:first-child { border-top: 0; }
        .task-group-header {
            padding: 6px 10px;
            background: #f5f3ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .task-group-title { font-size: 13px; font-weight: 700; color: #5b21b6; }
        .task-group-count {
            font-size: 10px;
            font-weight: 700;
            color: #6d28d9;
            background: #ede9fe;
            border-radius: 999px;
            padding: 2px 8px;
        }
        .task-empty-alert {
            padding: 14px 10px;
            text-align: center;
            color: #dc2626;
            font-size: 13px;
            font-weight: 800;
        }
        .task-row-header {
            display: grid;
            grid-template-columns: 1.9fr 1fr 1fr 1fr;
            padding: 3px 6px;
            background: #faf5ff;
            border-top: 1px solid #ede9fe;
            border-bottom: 1px solid #eee;
            gap: 6px;
        }
        .task-row-header span {
            font-size: 10px;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
        }
        .task-row {
            display: grid;
            grid-template-columns: 1.9fr 1fr 1fr 1fr;
            align-items: center;
            gap: 6px;
            padding: 6px 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
        }
        .task-row:hover { background: #faf5ff; }

        .focus-alert-panels {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0 0 12px;
        }
        .focus-alert-panels.focus-alert-side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0;
            min-width: 0;
        }
        .columns-grid.columns-grid-wide-counts .focus-alert-panels.focus-alert-side {
            width: 100%;
            min-width: 0;
        }
        .focus-alert-panel {
            margin: 0;
            border: 1px solid #fecdd3;
            border-radius: 10px;
            background: linear-gradient(135deg, #fff7ed 0%, #fff1f2 48%, #ffffff 100%);
            box-shadow: 0 8px 22px rgba(244, 63, 94, 0.13);
            overflow: hidden;
        }
        .focus-alert-panel.secondary {
            border-color: #bfdbfe;
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 48%, #ffffff 100%);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.12);
        }
        .focus-alert-panel.secondary .focus-alert-title { color: #1d4ed8; }
        .focus-alert-panel.secondary .focus-alert-sub { color: #0369a1; }
        .focus-alert-panel.secondary .focus-alert-count { background: #2563eb; }
        .focus-alert-panel.secondary .focus-alert-card {
            border-color: rgba(37, 99, 235, 0.22);
        }
        .focus-alert-panel.secondary .focus-alert-card:hover {
            border-color: #60a5fa;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.14);
        }
        .focus-alert-panel.secondary .focus-alert-meta { color: #075985; }
        .focus-alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(251, 113, 133, 0.22);
        }
        .focus-alert-title {
            font-size: 14px;
            font-weight: 900;
            color: #9f1239;
        }
        .focus-alert-sub {
            margin-top: 2px;
            font-size: 11px;
            font-weight: 600;
            color: #9a3412;
        }
        .focus-alert-count {
            padding: 4px 10px;
            border-radius: 999px;
            background: #be123c;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }
        .focus-alert-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 8px;
            padding: 10px;
        }
        .focus-alert-side .focus-alert-list {
            grid-template-columns: 1fr;
        }
        .focus-alert-side .focus-alert-header {
            align-items: flex-start;
            gap: 6px;
        }
        .focus-alert-side .focus-alert-title {
            font-size: 13px;
        }
        .focus-alert-side .focus-alert-sub {
            font-size: 10px;
            line-height: 1.25;
        }
        .focus-alert-side .focus-alert-count {
            padding: 3px 8px;
            font-size: 11px;
        }
        .focus-alert-card {
            border: 1px solid rgba(251, 113, 133, 0.28);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.82);
            padding: 8px 9px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .focus-alert-card:hover {
            transform: translateY(-1px);
            border-color: #fb7185;
            box-shadow: 0 8px 18px rgba(244, 63, 94, 0.14);
        }
        .focus-alert-card-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .focus-alert-name {
            font-size: 14px;
            font-weight: 900;
            color: #111827;
        }
        .focus-alert-code {
            font-size: 11px;
            font-weight: 800;
            color: #6b7280;
        }
        .focus-alert-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 5px;
            font-size: 11px;
            font-weight: 700;
            color: #7c2d12;
        }
        .focus-alert-gain {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }
        .focus-alert-empty {
            padding: 12px;
            color: #9ca3af;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
        }
        .task-row:last-child { border-bottom: none; }
        @media (max-width: 900px) {
            .focus-alert-panels { grid-template-columns: 1fr; }
        }
        .task-row .stock-name {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            min-width: 0;
        }
        .task-row .s-name {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .task-row .s-code {
            font-size: 10px;
            color: #4b5563;
            font-weight: 600;
        }
        .task-row .s-extra {
            font-size: 10px;
            color: #7c3aed;
            text-align: center;
            line-height: 1.3;
        }
        .task-row .s-gain,
        .task-row .s-metric {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }
        .task-context-menu {
            position: fixed;
            display: none;
            min-width: 162px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            box-shadow: 0 18px 36px rgba(0,0,0,0.16);
            z-index: 10030;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        .task-context-btn {
            width: 100%;
            border: 0;
            background: #fff;
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
        }
        .task-context-btn + .task-context-btn { border-top: 1px solid #f3f4f6; }
        .task-context-btn:hover { background: #f9fafb; }
        .task-context-btn-danger { color: #dc2626; }
        .task-ios-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 10040;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .task-ios-modal {
            width: min(320px, calc(100vw - 32px));
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 42px rgba(0,0,0,0.24);
        }
        .task-ios-title {
            padding: 18px 18px 6px;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }
        .task-ios-body {
            padding: 4px 18px 16px;
            text-align: center;
            font-size: 14px;
            color: #111827;
            line-height: 1.65;
        }
        .task-ios-body .task-kline-tip { margin-bottom: 8px; text-align: center; }
        .task-ios-body .task-kline-list { margin: 0 auto; width: fit-content; text-align: left; color: #7c3aed; font-weight: 700; }
        .task-ios-body .task-warn-text { color: #dc2626; font-weight: 800; font-size: 18px; }
        .task-ios-body .task-gain-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
        .task-ios-body .task-gain-option { border: 0; border-radius: 14px; min-height: 108px; aspect-ratio: 1 / 1; padding: 10px 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.45; white-space: normal; }
        .task-ios-body .task-gain-option-green { background: #ecfdf5; color: #15803d; }
        .task-ios-body .task-gain-option-red { background: #fef2f2; color: #dc2626; }
        .task-ios-actions { display: flex; min-height: 46px; border-top: 0.5px solid #d1d5db; }
        .task-ios-btn {
            flex: 1;
            border: 0;
            background: #fff;
            font-size: 17px;
            font-weight: 600;
            color: #007aff;
            cursor: pointer;
        }
        .task-ios-btn + .task-ios-btn { border-left: 0.5px solid #d1d5db; }
        .task-ios-btn-cancel { color: #6b7280; }

        /* ── 列标题 ── */
        .col-header {
            padding: 9px 8px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            text-align: center;

const tooltip = document.getElementById('klineTooltip');
const klineImg = document.getElementById('klineImage');
let _lastKlineOpenAt = 0;
function getPrefix(code) { return code.startsWith('6') ? '1' : '0'; }
function showKline(e, code, name) {
    _lastKlineOpenAt = Date.now();
    klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${getPrefix(code)}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
    document.getElementById('klineTtHeader').innerText = `${name} (${code}) - 日K线`;
    moveTooltip(e);
    tooltip.style.display = 'block';
}
function hideKline() { tooltip.style.display = 'none'; klineImg.src = ''; }
function moveTooltip(e) {
    const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 565;
    const h = window.innerWidth <= 768 ? 250 : 330;
    let left = e.clientX + 15, top = e.clientY + 15;
    if (left + w > window.innerWidth) left = e.clientX - w - 15;
    if (top + h > window.innerHeight) top = e.clientY - h - 15;
    if (left < 0) left = 10; if (top < 0) top = 10;
    tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
}
function isMobileKlineMode() {
    return window.innerWidth <= 768 || (window.matchMedia && window.matchMedia('(hover: none), (pointer: coarse)').matches);
}
function attachKlineEvents(row, code, name) {
    row.addEventListener('mouseenter', function(e) {
        if (isMobileKlineMode()) return;
        showKline(e, code, name);
    });
    row.addEventListener('mouseleave', function() {
        if (isMobileKlineMode()) return;
        hideKline();
    });
    row.addEventListener('mousemove', function(e) {
        if (isMobileKlineMode()) return;
        moveTooltip(e);
    });
    row.addEventListener('click', function(e) {
        if (!isMobileKlineMode()) return;
        e.stopPropagation();
        showKline(e, code, name);
    });
}
document.addEventListener('click', function() {
    if (!isMobileKlineMode()) return;
    if (Date.now() - _lastKlineOpenAt < 350) return;
    hideKline();
});
window.showKline = showKline;
window.hideKline = hideKline;
window.isMobileKlineMode = isMobileKlineMode;

async function loadDates() {
    try {
        const resp = await fetch('/api/ztorgj/dates');
        const result = await resp.json();
        if (result.success && result.dates && result.dates.length > 0) {
            _availableDates = result.dates;
            _currentDate = _availableDates[0];
            _currentDateIndex = 0;
        }
    } catch(e) {}
    initFlatpickr();
    await loadStocks();
    startPollingRefresh();
    startRealtimeRefresh();
}

function initFlatpickr() {
    _flatpickrInstance = flatpickr("#datePicker", {
        enable: _availableDates,
        dateFormat: "Y-m-d",
        defaultDate: _currentDate,
        appendTo: document.body,
        locale: {
            weekdays: { shorthand: ['日','一','二','三','四','五','六'], longhand: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'] },
            months: { shorthand: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], longhand: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'] }
        },
        onChange: function(selectedDates, dateStr) {
            if (dateStr && dateStr !== _currentDate) {
                _currentDate = dateStr;
                _currentDateIndex = _availableDates.indexOf(dateStr);
                loadStocks();
            }
        }
    });
}

function prevDate() {
    if (_currentDateIndex < _availableDates.length - 1) {
        _currentDateIndex++;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}
function nextDate() {
    if (_currentDateIndex > 0) {
        _currentDateIndex--;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

async function fetchStocksData() {
    const url = _currentDate ? `/api/ztorgj/stocks?date=${_currentDate}` : '/api/ztorgj/stocks';
    const resp = await fetch(url, { cache: 'no-store' });
    return await resp.json();
}

function normalizeDatasets(result) {
    return cloneDatasets(result && result.datasets ? result.datasets : { ztorgj: (result && result.data) || [] });
}

function setDisplayedDatasets(datasets) {
    _datasets = cloneDatasets(datasets);
    _stocks = _datasets.ztorgj || [];
}

function getAllCodesFromDatasets(datasets) {
    const seen = new Set();
    const codes = [];
    DATASET_KEYS.forEach(function(key) {
        ((datasets && datasets[key]) || []).forEach(function(stock) {
            const code = String(stock && stock.code || '').trim();
            if (code && !seen.has(code)) {
                seen.add(code);
                codes.push(code);
            }
        });
    });
    return codes;
}

function mergeRealtimeIntoDatasets(datasets, realtimeData) {
    const next = cloneDatasets(datasets);
    DATASET_KEYS.forEach(function(key) {
        next[key].forEach(function(stock) {
            const realtime = realtimeData && realtimeData[stock.code];
            if (realtime && realtime.change != null) {
                stock.today_change = realtime.change;
            } else {
                delete stock.today_change;
            }
        });
    });
    return next;
}

function applyRealtimeToManualTasks(realtimeData) {
    _manualTasks = (_manualTasks || []).map(function(item) {
        const next = { ...item };
        const realtime = realtimeData && realtimeData[next.code];
        if (realtime && realtime.change != null) {
            next.today_change = realtime.change;
        } else {
            delete next.today_change;
        }
        return next;
    });
}

function formatRealtimeGainText(gain) {
    return (gain > 0 ? '+' : '') + gain.toFixed(2) + '%';
}

function getRealtimeGainClass(gain) {
    return gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
}

function updateRealtimeGainElement(node, gain) {
    if (!node || !Number.isFinite(gain)) return;
    node.textContent = formatRealtimeGainText(gain);
    node.classList.remove('positive', 'negative', 'neutral');
    node.classList.add(getRealtimeGainClass(gain));
}

function updateRealtimeGainNodes(realtimeData) {
    if (!realtimeData) return;
    const rowsByCode = {};
    document.querySelectorAll('#mainContent [data-stock-code]').forEach(function(row) {
        const code = String(row.dataset.stockCode || '').trim();
        if (!code) return;
        if (!rowsByCode[code]) rowsByCode[code] = [];
        rowsByCode[code].push(row);
    });

    Object.keys(realtimeData).forEach(function(code) {
        const realtime = realtimeData[code];
        const gain = Number(realtime && realtime.change);
        if (!Number.isFinite(gain)) return;
        (rowsByCode[String(code)] || []).forEach(function(row) {
            updateRealtimeGainElement(row.querySelector('.s-gain'), gain);
            updateRealtimeGainElement(row.querySelector('.focus-alert-gain'), gain);
        });
    });
}

function getShanghaiNowParts() {
    const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23',
        weekday: 'short'
    }).formatToParts(new Date());
    const data = {};
    parts.forEach(function(part) {
        if (part.type !== 'literal') data[part.type] = part.value;
    });
    return {
        date: `${data.year}-${data.month}-${data.day}`,
        hour: Number(data.hour || 0),
        minute: Number(data.minute || 0),
        weekday: data.weekday || ''
    };
}

function isTradingSessionNow() {
    const now = getShanghaiNowParts();
    if (now.weekday === 'Sat' || now.weekday === 'Sun') return false;
    const totalMinutes = now.hour * 60 + now.minute;
    const isTradingTime = (totalMinutes >= 570 && totalMinutes < 690) || (totalMinutes >= 780 && totalMinutes < 900);
    return now.date === _currentDate && isTradingTime;
}

function isRealtimeTargetDate() {
    return _currentDateIndex === 0;
}

function shouldUseRealtimeStocks() {
    return isRealtimeTargetDate() && isTradingSessionNow();
}

function findStockInDatasetsForRealtimeDebug(datasets, code) {
    for (const key of DATASET_KEYS) {
        const list = (datasets && datasets[key]) || [];
        const stock = list.find(function(item) { return item && item.code === code; });
        if (stock) return { datasetKey: key, stock: stock };
    }
    return { datasetKey: '', stock: null };
}

function buildRealtimeDebugRows(codes, realtimeData, beforeDatasets, afterDatasets) {
    return (codes || []).slice(0, ZTORGJ_REALTIME_DEBUG_SAMPLE_SIZE).map(function(code) {
        const before = findStockInDatasetsForRealtimeDebug(beforeDatasets, code);
        const after = findStockInDatasetsForRealtimeDebug(afterDatasets, code);
        const realtime = realtimeData && realtimeData[code];
        const displaySource = after.stock && after.stock.today_change != null ? 'today_change' : 'ref_gain';
        const displayValue = Number(after.stock && after.stock.today_change != null ? after.stock.today_change : (after.stock && after.stock.ref_gain) || 0);
        return {
            code: code,
            name: (before.stock && before.stock.name) || (after.stock && after.stock.name) || '',
            dataset: after.datasetKey || before.datasetKey || '',
            redis_today_change: before.stock ? before.stock.today_change : undefined,
            redis_ref_gain: before.stock ? before.stock.ref_gain : undefined,
            realtime_change: realtime ? realtime.change : undefined,
            displayed_today_change: after.stock ? after.stock.today_change : undefined,
            display_source: displaySource,
            display_value: Number.isFinite(displayValue) ? Number(displayValue.toFixed(2)) : displayValue,
        };
    });
}

function logRealtimeDebug(stage, payload) {
    if (!ZTORGJ_REALTIME_DEBUG) return;
    try {
        console.log('[ztorgj][realtime-debug][' + stage + ']', payload);
    } catch(e) {
        console.warn('[ztorgj][realtime-debug] log failed:', e);
    }
}

async function refreshRealtime() {
    const codes = getAllCodesFromDatasets(_redisDatasets);
    if (!codes.length) return;

    if (!shouldUseRealtimeStocks()) {
        const now = getShanghaiNowParts();
        const skipKey = [
            _currentDate,
            _currentDateIndex,
            now.date,
            now.hour,
            now.minute,
            _hasRealtimeOverlay ? 'overlay' : 'no-overlay'
        ].join('|');
        if (skipKey !== _lastRealtimeSkipLogKey) {
            _lastRealtimeSkipLogKey = skipKey;
            logRealtimeDebug('skip', {
                reason: 'not_realtime_session',
                currentDate: _currentDate,
                currentDateIndex: _currentDateIndex,
                now: now,
                hasRealtimeOverlay: _hasRealtimeOverlay,
                codesCount: codes.length
            });
        }
        if (_hasRealtimeOverlay) {
            setDisplayedDatasets(_redisDatasets);
            _hasRealtimeOverlay = false;
            renderColumns(_datasets);
            await loadTaskStocks(_currentDate);
        }
        return;
    }

    try {
        const resp = await fetch('/api/ztorgj/realtime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codes: codes })
        });
        const result = await resp.json();
        if (!(result && result.success && result.data)) {
            logRealtimeDebug('response-invalid', {
                currentDate: _currentDate,
                activeTab: _activeTab,
                codesCount: codes.length,
                status: resp.status,
                result: result
            });
            return;
        }
        const realtimeKeys = Object.keys(result.data);
        if (realtimeKeys.length === 0) {
            logRealtimeDebug('response-empty', {
                currentDate: _currentDate,
                activeTab: _activeTab,
                codesCount: codes.length,
                backendDebug: result.debug || null
            });
            return;
        }

        const nextDatasets = mergeRealtimeIntoDatasets(_redisDatasets, result.data);
        logRealtimeDebug('overlay', {
            currentDate: _currentDate,
            activeTab: _activeTab,
            codesCount: codes.length,
            realtimeCount: realtimeKeys.length,
            missingCount: codes.length - realtimeKeys.length,
            missingSample: codes.filter(function(code) { return !result.data[code]; }).slice(0, ZTORGJ_REALTIME_DEBUG_SAMPLE_SIZE),
            backendDebug: result.debug || null,
            sample: buildRealtimeDebugRows(codes, result.data, _redisDatasets, nextDatasets)
        });
        setDisplayedDatasets(nextDatasets);
        _hasRealtimeOverlay = true;
        applyRealtimeToManualTasks(result.data);
        updateRealtimeGainNodes(result.data);
    } catch(e) {
        console.error('[ztorgj][refreshRealtime] 请求失败:', e);
    }
}

function formatScanDuration(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '--';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return n.toFixed(3).replace(/\.?0+$/, '');
}

function formatScanEndTime(value) {
    if (!value) return '--';
    const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
    if (!match) return String(value);
    return `${Number(match[2])}月${Number(match[3])}日${Number(match[4])}点${Number(match[5])}分${Number(match[6])}秒`;
}

function formatSnapshotDurationMs(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return '--';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return n.toFixed(1).replace(/\.?0+$/, '');
}

function buildSnapshotStatusText(info) {
    if (!info) return '';
    const lastStatus = String(info.last_snapshot_status || '').trim();
    const overallStatus = String(info.overall_status || '').trim();
    const count = Number(info.last_snapshot_count || 0);
    const durationText = formatSnapshotDurationMs(info.last_snapshot_duration_ms);
    const rawError = String(info.last_snapshot_error || info.overall_error || '').trim();
    const shortError = rawError ? rawError.slice(0, 60) : '';
    let text = '';

    if (lastStatus === 'success' && overallStatus === 'success') {
        text = `快照成功，写入${count}只，耗时${durationText}毫秒`;
    } else if (lastStatus === 'success' && overallStatus === 'partial_fail') {
        text = `本列表快照成功，但同轮其他列表有失败，写入${count}只，耗时${durationText}毫秒`;
    } else if (lastStatus === 'fail') {
        text = '该列表快照失败，已保留旧数据';
    } else if (lastStatus === 'skip') {
        text = '本轮快照中断，这个列表还没来得及更新';
    } else if (overallStatus === 'fail') {
        text = '本轮快照整体失败，当前展示的是旧数据';
    }

    if (shortError && (lastStatus === 'fail' || lastStatus === 'skip' || overallStatus === 'fail')) {
        text += `，原因:${shortError}`;
    }
    return text;
}

function formatRedisUpdateStatus(value) {
    const status = String(value || '').toLowerCase();
    if (status === 'success' || status === 'ok') return '成功';
    if (status === 'pending') return '写入中';
    if (status === 'skipped_empty') return '跳过空结果';
    if (status === 'redis_update_failed' || status === 'failed' || status === 'error' || status === 'fail') return '失败';
    return status || '--';
}

function updateScanInfoDisplay(info, snapshotInfo) {
    const el = document.getElementById('scanInfoText');
    if (!el) return;
    const durationText = formatScanDuration(info && info.last_scan_duration_sec);
    const scanEndText = formatScanEndTime(info && info.last_scan_end_time);
    const redisStatusText = formatRedisUpdateStatus(info && info.redis_update_status);
    const redisTimeText = formatScanEndTime(info && info.redis_update_time);
    const redisError = info && info.redis_update_error ? `，原因:${info.redis_update_error}` : '';
    const snapshotText = buildSnapshotStatusText(snapshotInfo);
    el.textContent = `扫描耗时${durationText}s，扫描完成时间:${scanEndText}，Redis更新:${redisStatusText} ${redisTimeText}${redisError}${snapshotText ? '，' + snapshotText : ''}`;
}

function getHuiche6ColumnFilter(columnId) {
    var key = String(columnId || '');
    if (!_huiche6ColumnFilters[key]) {
        _huiche6ColumnFilters[key] = { maxBelowTopDayCloseCount: null, minAdjustDays: null };
    }
    if (!_huiche6ColumnFilters[key].hasOwnProperty('maxBelowTopDayCloseCount')) {
        _huiche6ColumnFilters[key].maxBelowTopDayCloseCount = null;
    }
    return _huiche6ColumnFilters[key];
}

function applyHuiche6ColumnFilter(stocks, columnId) {
    var filter = getHuiche6ColumnFilter(columnId);
    return (stocks || []).filter(function(s) {
        if (filter.maxBelowTopDayCloseCount != null) {
            var rawBelowCount = s.top_day_close_below_count;
            if (rawBelowCount === undefined || rawBelowCount === null || rawBelowCount === '') return false;
            if (Number(rawBelowCount) > Number(filter.maxBelowTopDayCloseCount)) return false;
        }
        if (filter.minAdjustDays != null && Number(s.days_since_top_day || 0) < Number(filter.minAdjustDays)) return false;
        return true;
    });
}

function isTrueFlag(value) {
    if (value === true || value === 1) return true;
    if (value === false || value == null || value === '') return false;
    var text = String(value).trim().toLowerCase();
    return text === '1' || text === 'true' || text === 'yes' || text === 'y';
}

function isWeak20YangAndNewHighStock(stock) {

function passBreak20GlobalFilters(stock) {
    if (!_break20GlobalFilters) return true;
    if (_break20GlobalFilters.bareFootNoTouch && !(isTrueFlag(stock && stock.is_bare_foot_yang) && isTrueFlag(stock && stock.ref_low_above_ma5))) return false;
    if (_break20GlobalFilters.bareFootLimitUp && !(isTrueFlag(stock && stock.is_bare_foot_yang) && (isTrueFlag(stock && stock.ref_is_limit_up) || isTrueFlag(stock && stock.is_limit_up)))) return false;
    if (_break20GlobalFilters.highGainYang && !isTrueFlag(stock && stock.ref_high_gain_gte_6_5_and_yang)) return false;
    if (_break20GlobalFilters.limitUp && !(isTrueFlag(stock && stock.ref_is_limit_up) || isTrueFlag(stock && stock.is_limit_up))) return false;
    if (_break20GlobalFilters.yinCloseBelowMa5Lte2 && !isTrueFlag(stock && stock.yin_close_below_ma5_lte_2_10d)) return false;
    if (_break20GlobalFilters.bareFootYang && !isTrueFlag(stock && stock.is_bare_foot_yang)) return false;
    return true;
}

function buildWeak20KlineOrderedStocks(col) {
    var source = (col && col.source || []).filter(function(s) {
        return Number(s.weak_yin_20d || 0) <= 3;
    });
    var sorted = source.slice().sort(function(a, b) {
        var tieAware = compareByTabMetricWithTieBreaker(_activeTab, a, b);
        if (tieAware !== 0) return tieAware;
        return Number(a[col.key] || 0) - Number(b[col.key] || 0);
    });
    var groups = groupByWeakYin20(sorted, col.key || 'weak_yin_20d');
    var orderedStocks = [];
    groups.forEach(function(group) {
        sortStocksByDisplayGain(group.stocks || []).forEach(function(stock) {
            if (getKlinePageOrderCode(stock)) orderedStocks.push(stock);
        });
    });
    return orderedStocks;
}

function buildWeak20KlineOrderedCodes(col) {
    return buildKlineOrderedCodesFromStocks(buildWeak20KlineOrderedStocks(col));
}

function buildKlineOrderedStocksForPage(col) {
    var stocks = shouldUseWeak20KlineDefaultLimit(col)
        ? buildWeak20KlineOrderedStocks(col)
        : ((col && Array.isArray(col.klineOrderedStocks) && col.klineOrderedStocks.length) ? col.klineOrderedStocks : (col && col.source || []));
    return (stocks || []).map(buildKlinePageStockPayload).filter(function(stock) {
        return !!getKlinePageOrderCode(stock);
    });
}

function buildKlineOrderedCodesForPage(col) {
    if (shouldUseWeak20KlineDefaultLimit(col)) return buildWeak20KlineOrderedCodes(col);
    if (col && Array.isArray(col.klineOrderedCodes) && col.klineOrderedCodes.length) return col.klineOrderedCodes;
    return buildKlineOrderedCodesFromStocks(buildKlineOrderedStocksForPage(col));
}

function openWeak20KlinePage(col) {
    var params = new URLSearchParams();
    if (_currentDate) params.set('date', _currentDate);
    params.set('new_high_only', isKlinePageNewHighFilterActive(col) ? '1' : '0');
    if (shouldUseWeak20KlineDefaultLimit(col)) params.set('max_weak_yin_20d', '3');
    var orderToken = 'ztorgj_weak20_kline_order_' + Date.now() + '_' + Math.random().toString(16).slice(2);
    try {
        localStorage.setItem(orderToken, JSON.stringify({
            codes: buildKlineOrderedCodesForPage(col),
            stocks: buildKlineOrderedStocksForPage(col),
            date: _currentDate || '',
            max_weak_yin_20d: shouldUseWeak20KlineDefaultLimit(col) ? 3 : '',
            new_high_only: isKlinePageNewHighFilterActive(col) ? 1 : 0,
            source_tab: _activeTab || '',
            source_label: col && col.label || ''
        }));
        params.set('order_token', orderToken);
    } catch (e) {
        console.warn('[ztorgj][weak20-kline] 保存列表顺序失败:', e);
    }
    var url = '/涨停或光脚/弱阴线K线?' + params.toString();
    window.open(url, '_blank', 'noopener');
}

async function exportWeak20FirstColumnKlineExcel(button, col, progressEl) {
    var originalText = button ? button.textContent : '';
    var exportCompleted = false;
    var jobId = '';
    var lastLoggedPercent = -1;
    if (button) {
        button.disabled = true;
        button.textContent = '启动导出...';
    }
    setWeak20ExportProgress(progressEl, 0, 0, 0, '启动导出任务');
    try {
        var params = new URLSearchParams();
        if (_currentDate) params.set('date', _currentDate);
        params.set('new_high_only', isWeak20NewHighFilterActive(col) ? '1' : '0');
        var startUrl = '/api/ztorgj/weak20/kline-excel/start?' + params.toString();
        console.log('[ztorgj][weak20-export][start-request]', {
            url: startUrl,
            currentDate: _currentDate,
            newHighOnly: isWeak20NewHighFilterActive(col) ? 1 : 0,
            columnLabel: col && col.label
        });
        var startResp = await fetch(startUrl, { method: 'POST', cache: 'no-store' });
        console.log('[ztorgj][weak20-export][start-http]', {
            ok: startResp.ok,
            status: startResp.status,
            statusText: startResp.statusText
        });
        var startPayload = await startResp.json();
        console.log('[ztorgj][weak20-export][start-payload]', startPayload);
        if (!startResp.ok || !startPayload.success || !startPayload.job_id) {
            throw new Error(startPayload.error || '导出启动失败');
        }

        jobId = startPayload.job_id;
        var payload = null;
        while (true) {
            await waitWeak20ExportProgress(800);
            var progressUrl = '/api/ztorgj/weak20/kline-excel/progress/' + encodeURIComponent(jobId);
            var progressResp = await fetch(progressUrl, { cache: 'no-store' });
            if (!progressResp.ok) {
                console.log('[ztorgj][weak20-export][progress-http-fail]', {
                    jobId: jobId,
                    status: progressResp.status,
                    statusText: progressResp.statusText,
                    url: progressUrl
                });
            }
            payload = await progressResp.json();
            var progressPercentForLog = Number(payload && payload.percent || 0);
            if (progressPercentForLog !== lastLoggedPercent || (payload && (payload.status === 'failed' || payload.status === 'completed'))) {
                lastLoggedPercent = progressPercentForLog;
                console.log('[ztorgj][weak20-export][progress-payload]', {
                    jobId: jobId,
                    status: payload && payload.status,
                    current: payload && payload.current,
                    total: payload && payload.total,
                    percent: payload && payload.percent,
                    message: payload && payload.message,
                    error: payload && payload.error,
                    httpStatus: progressResp.status
                });
            }
            if (!progressResp.ok || !payload.success) {
                throw new Error(payload.error || '导出进度获取失败');
            }
            var current = Number(payload.current || 0);
            var total = Number(payload.total || 0);
            var percent = Number(payload.percent || 0);
            setWeak20ExportButtonText(button, current, total, percent);
            setWeak20ExportProgress(progressEl, current, total, percent, payload.message || '');
            if (payload.status === 'failed') {
                console.log('[ztorgj][weak20-export][progress-status-failed]', payload);
                throw new Error(payload.error || payload.message || '导出失败');
            }
            if (payload.status === 'completed') break;
        }

        if (button) button.textContent = '下载中...';
        exportCompleted = true;
        setWeak20ExportProgress(progressEl, Number(payload.current || 0), Number(payload.total || 0), 100, '导出完成，正在下载');
        var link = document.createElement('a');
        link.href = '/api/ztorgj/weak20/kline-excel/download/' + encodeURIComponent(jobId);
        link.download = buildWeak20KlineExcelFilename(col);
        console.log('[ztorgj][weak20-export][download-click]', {
            jobId: jobId,
            href: link.href,
            filename: link.download
        });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    } catch (e) {
        console.error('[ztorgj][weak20-export][catch]', {
            jobId: jobId,
            message: e && e.message,
            stack: e && e.stack
        });
        setWeak20ExportProgress(progressEl, 0, 0, 0, e.message || '导出失败');
        if (typeof showTaskErrorDialog === 'function') {
            await showTaskErrorDialog(e.message || '导出失败');
        } else {
            alert(e.message || '导出失败');
        }
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = originalText || '导出Excel';
        }
        console.log('[ztorgj][weak20-export][finally]', {
            jobId: jobId,
            exportCompleted: exportCompleted,
            restoredText: button ? button.textContent : ''
        });
        if (exportCompleted && progressEl) {
            window.setTimeout(function() {
                progressEl.style.display = 'none';
                progressEl.innerHTML = '';
                hideWeak20ExportFloatingProgress();

function showHuiche6AdjustFilterDialog(columnId) {
    var filter = getHuiche6ColumnFilter(columnId);

    var titleEl = document.getElementById('taskIosTitle');
    var bodyEl = document.getElementById('taskIosBody');
    var actionsEl = document.getElementById('taskIosActions');

    bodyEl.innerHTML =

            '<input id="huiche6AdjustInput" type="number" min="0" step="1" placeholder="输入天数，例如 3" value="' + (filter.minAdjustDays != null ? filter.minAdjustDays : '') + '">' +
            '<div class="filter-input-tip">输入 3 表示仅显示调整时间大于等于 3 天的股票；点“不进行筛选”恢复当前列全部股票。</div>' +

        '<button type="button" class="task-ios-btn" data-adjust-action="apply">确定</button>'
    ].join('');
    overlay.style.display = 'flex';

    var cleanup = function() {
        overlay.style.display = 'none';
        bodyEl.innerHTML = '';
        actionsEl.innerHTML = '';
        actionsEl.onclick = null;
        overlay.onclick = null;
    };

    actionsEl.onclick = function(e) {
        var btn = e.target.closest('[data-adjust-action]');

    };

function getMetricGridTemplate(metricCount, isHighGain) {
    var base = isHighGain ? ['1.42fr', '0.72fr'] : ['1.58fr', '0.8fr'];

    if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
        base = isHighGain ? ['1.35fr', '0.85fr'] : ['1.5fr', '0.85fr'];
        metricWidth = isHighGain ? '0.95fr' : '1fr';
    }
    for (var i = 0; i < metricCount; i++) base.push(metricWidth);
    return base.join(' ');
}

async function refreshFromRedis(showLoading) {
    if (showLoading) {
        document.getElementById('mainContent').innerHTML = '<div class="loading-msg">正在加载数据...</div>';
        updateScanInfoDisplay(null, null);
    }
    try {
        const result = await fetchStocksData();
        if (!(result && result.success)) {
            if (showLoading) {
                _redisDatasets = createEmptyDatasets();
                setDisplayedDatasets(_redisDatasets);
                _hasRealtimeOverlay = false;
                _snapshotInfo = null;
                _lastStableSnapshotVersion = null;
                updateScanInfoDisplay(null, null);
                document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败</div>';
            }
            return;
        }

        const nextScanInfo = result.scan_info || null;
        const nextSnapshotInfo = result.snapshot_info || null;
        const nextSnapshotVersion = String(result.snapshot_version || '').trim();
        const isSnapshotStable = Boolean(result.is_snapshot_stable);

        _scanInfo = nextScanInfo;
        _snapshotInfo = nextSnapshotInfo;
        updateScanInfoDisplay(_scanInfo, _snapshotInfo);

        if (!showLoading) {
            if (!isSnapshotStable || !nextSnapshotVersion || nextSnapshotVersion === _lastStableSnapshotVersion) {
                console.log('[ztorgj][refreshFromRedis] 跳过重渲染', {
                    currentDate: _currentDate,
                    snapshotVersion: nextSnapshotVersion,
                    lastStableSnapshotVersion: _lastStableSnapshotVersion,
                    isSnapshotStable: isSnapshotStable,
                    snapshotReason: result.snapshot_reason || ''
                });
                return;
            }
        }

        const nextDatasets = normalizeDatasets(result);
        const oldHuiche6Count = ((_datasets && _datasets.huiche6) || []).length;
        const newHuiche6Count = ((nextDatasets && nextDatasets.huiche6) || []).length;
        if (!showLoading && _activeTab === 'huiche6' && oldHuiche6Count > 0 && newHuiche6Count === 0) {
            // 扫描偶发发布空 huiche6 快照时，后台轮询不覆盖当前有效列表。
            if (nextSnapshotVersion) {
                _lastStableSnapshotVersion = nextSnapshotVersion;
            }
            console.warn('[ztorgj][refreshFromRedis] 跳过空 huiche6 自动刷新', {
                currentDate: _currentDate,
                oldHuiche6Count: oldHuiche6Count,
                newHuiche6Count: newHuiche6Count,
                snapshotVersion: nextSnapshotVersion,
                snapshotReason: result.snapshot_reason || '',
                scanInfo: nextScanInfo,
                snapshotInfo: nextSnapshotInfo
            });
            return;
        }

        _redisDatasets = nextDatasets;
        setDisplayedDatasets(_redisDatasets);
        _hasRealtimeOverlay = false;
        if (nextSnapshotVersion) {
            _lastStableSnapshotVersion = nextSnapshotVersion;
        }
        logDebugStockSnapshot('after-fetch', _datasets);
        renderColumns(_datasets);
        requestAnimationFrame(function() {
            logDebugRenderedStockRows();
        });
        await loadTaskStocks(_currentDate);
        await refreshRealtime();
    } catch(e) {
        if (showLoading) {
            _redisDatasets = createEmptyDatasets();
            setDisplayedDatasets(_redisDatasets);
            _hasRealtimeOverlay = false;
            _snapshotInfo = null;
            _lastStableSnapshotVersion = null;
            updateScanInfoDisplay(null, null);
            document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败: ' + e.message + '</div>';
        } else {
            console.error('[ztorgj][refreshFromRedis] 请求失败:', e);
        }
    }
}

function buildTaskRow(stock) {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.stockCode = stock.code || '';
    row.dataset.stockName = stock.name || '';
    attachKlineEvents(row, stock.code, stock.name);
    row.addEventListener('contextmenu', function(e) { showTaskDeleteMenu(e, stock); });

    const sourcePages = Array.isArray(stock.source_pages) ? stock.source_pages : [];
    const sourceText = sourcePages.length ? `来源:${sourcePages.join(' / ')}` : '';
    const changeValue = getDisplayChangeValue(stock);
    const gainClass = changeValue > 0 ? 'positive' : changeValue < 0 ? 'negative' : 'neutral';
    row.innerHTML =
        '<div class="stock-name"><span class="s-name" title="' + stock.code + ' ' + stock.name + '">' + stock.name + '</span>' +
        '<span class="s-code">' + stock.code + '</span>' +
        '<span class="s-extra">' + sourceText + '</span></div>' +
        '<span class="s-gain ' + gainClass + '">' + (changeValue > 0 ? '+' : '') + changeValue.toFixed(2) + '%</span>' +
        '<span class="s-metric" data-market-cap-code="' + stock.code + '" data-market-cap-decimals="2" data-market-cap-unit="亿">' + Number(stock.market_cap || 0).toFixed(2) + '亿</span>' +
        '<span class="s-metric">' + (Number(stock.gains_10 || 0) > 0 ? '+' : '') + Number(stock.gains_10 || 0).toFixed(2) + '%</span>';
    return row;
}

            task_type: taskType,

            stock_code_with_market: stock.stock_code_with_market || '',
            ref_gain: stock.ref_gain,
            today_change: getDisplayChangeValue(stock),

            high_gain_10d_count: stock.high_gain_10d_count || stock.high_gain_count || 0,
            days_since_top_day: stock.days_since_top_day || 0,
            strong_adjust_k_pct: stock.strong_adjust_k_pct || 0,
            cum_high_to_ma5_pct: stock.cum_high_to_ma5_pct || 0,
            all_yin_up: isStockFlag(stock, 'all_yin_up'),
            all_yin_no_touch: isStockFlag(stock, 'all_yin_no_touch'),
            all_yin_cross_star: isStockFlag(stock, 'all_yin_cross_star'),
            layang: isStockFlag(stock, 'layang'),

function showTaskIosDialog(config) {
    const overlay = document.getElementById('taskIosOverlay');
    const titleEl = document.getElementById('taskIosTitle');
    const bodyEl = document.getElementById('taskIosBody');
    const actionsEl = document.getElementById('taskIosActions');
    titleEl.textContent = config.title || '';
    bodyEl.innerHTML = config.bodyHtml || '';
    actionsEl.innerHTML = (config.actions || []).map(function(action) {
        return `<button type="button" class="task-ios-btn ${action.className || ''}" data-modal-value="${action.value}">${action.label}</button>`;
    }).join('');
    overlay.style.display = 'flex';
    return new Promise(function(resolve) {
        const done = function(value) {
            overlay.style.display = 'none';
            bodyEl.innerHTML = '';
            actionsEl.innerHTML = '';
            resolve(value);
        };

        const clickHandler = function(e) {
            const button = e.target.closest('[data-modal-value]');
            if (!button) return;
            done(button.getAttribute('data-modal-value'));
        };

        actionsEl.onclick = clickHandler;
        bodyEl.onclick = clickHandler;
        overlay.onclick = function(e) {
            if (e.target === overlay) done('cancel');
        };
    });
}

async function handleTaskMenuAction(taskType) {
    const stock = _taskContextStock;
    hideTaskContextMenu();
    if (!stock) return;
    try {
        if (taskType === 'delete') {
            const confirmed = await showTaskDeleteConfirmDialog();
            if (confirmed === 'confirm_delete') await removeTaskStock(stock);
            return;
        }
        if (taskType === 'hengpan') {
            await persistTaskStock(stock, 'hengpan', '');
            return;
        }
        const klineConfirm = await showTaskKlineConfirmDialog();
        if (klineConfirm !== 'confirm') return;
        const gainConfirm = await showTaskGainConfirmDialog();
        if (gainConfirm === 'lt35') {
            await persistTaskStock(stock, taskType, 'lt35');
            return;
        }
        if (gainConfirm !== 'gte35') return;
        const warnConfirm = await showTaskWarnDialog();
        if (warnConfirm === 'confirm_add') {
            await persistTaskStock(stock, taskType, 'gte35');
        }
    } catch (e) {
        console.error('[ztorgj][handleTaskMenuAction] 失败:', e);
        await showTaskErrorDialog(e.message || '添加失败');
    }
}

function isFocusAlertCandidate(stock) {
    if (!stock || stock.yin_count_20 == null || stock.max_gain == null) return false;
    return Number(stock.yin_count_20) <= 3 && Number(stock.max_gain) >= 6.85;
}

function getRefHighGainValue(stock) {
    return Math.max(Number(stock && stock.max_gain || 0), Number(stock && stock.ref_high_gain || 0));
}

function isSecondaryFocusAlertCandidate(stock) {
    return !!stock && Number(stock.yin_count_20 || 0) === 4 && getRefHighGainValue(stock) >= 6.85;
}

function getFocusAlertStocks(datasets) {
    var seen = new Set();
    var rows = [];
    var source = ((datasets && datasets.yxcs) || []);
    source.forEach(function(stock) {
        var code = String(stock && stock.code || '').trim();
        if (!code || seen.has(code)) return;
        if (!isFocusAlertCandidate(stock)) return;
        seen.add(code);
        rows.push(stock);
    });
    return rows.sort(function(a, b) {
        var aYinCount = (a && a.yin_count_20 != null) ? Number(a.yin_count_20) : 99;
        var bYinCount = (b && b.yin_count_20 != null) ? Number(b.yin_count_20) : 99;
        var yinDiff = aYinCount - bYinCount;
        if (yinDiff !== 0) return yinDiff;
        return getDisplayChangeValue(b) - getDisplayChangeValue(a);
    });
}

function getSecondaryFocusAlertStocks(datasets) {
    var seen = new Set();
    var rows = [];
    DATASET_KEYS.forEach(function(key) {
        ((datasets && datasets[key]) || []).forEach(function(stock) {
            var code = String(stock && stock.code || '').trim();
            if (!code || seen.has(code)) return;
            if (!isSecondaryFocusAlertCandidate(stock)) return;
            seen.add(code);
            rows.push(stock);
        });
    });
    return rows.sort(function(a, b) {
        var highDiff = getRefHighGainValue(b) - getRefHighGainValue(a);
        if (highDiff !== 0) return highDiff;
        return getDisplayChangeValue(b) - getDisplayChangeValue(a);
    });
}

    var set = new Set();

    } else {
        wrapper.appendChild(grid);
    }
    document.getElementById('mainContent').innerHTML = '';
    document.getElementById('mainContent').appendChild(wrapper);
    installDebugStockDomObserver();
}

function isStockFlag(stock, key) {
    var value = stock ? stock[key] : false;
    if (value === true || value === 1) return true;
    var text = String(value || '').trim().toLowerCase();
    return text === '1' || text === 'true' || text === 'yes' || text === '是';
}

function getStockKey(stock) {
    return String((stock && (stock.code || stock.stock_code_with_market)) || '').trim();
}

function getKlineStockCode(stock) {
    return String((stock && (stock.stock_code_with_market || stock.ts_code || stock.code)) || '').trim();
}

function metricNumber(stock, key, fallbackKey) {
    var value = stock ? stock[key] : 0;
    if ((value === undefined || value === null || value === '') && fallbackKey) value = stock[fallbackKey];
    var num = Number(value || 0);
    return Number.isFinite(num) ? num : 0;
}

function currentKlineTheme() {
    return KLINE_THEME_VARIANTS.find(function(item) { return item.key === KLINE_SCREENING_STATE.themeKey; }) || KLINE_THEME_VARIANTS[0];
}

function setKlineTheme(themeKey) {
    KLINE_SCREENING_STATE.themeKey = themeKey;
    updateKlineThemeButtons();
    if (KLINE_SCREENING_STATE.round !== 'idle' && !document.getElementById('klineWorkbench')?.classList.contains('kline-hidden')) {
        renderCurrentStockKline();
    }
}

function updateKlineThemeButtons() {
    KLINE_THEME_VARIANTS.forEach(function(variant) {
        var btn = document.getElementById('klineTheme_' + variant.key);
        if (btn) btn.classList.toggle('active', variant.key === KLINE_SCREENING_STATE.themeKey);
    });
}

function getSecondRoundFieldSourceStocks() {
    var seen = new Set();
    return ((_datasets && _datasets.huiche6) || []).filter(function(stock) {
        var key = getStockKey(stock);
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
    }).sort(function(a, b) {
        var diff = metricNumber(b, 'high_gain_10d_count', 'high_gain_count') - metricNumber(a, 'high_gain_10d_count', 'high_gain_count');
        if (diff !== 0) return diff;
        return getDisplayChangeValue(b) - getDisplayChangeValue(a);
    });
}

function loadSecondRoundStageSourceFromFields(stage) {
    return getSecondRoundFieldSourceStocks().filter(function(stock) {
        var key = getStockKey(stock);
        return key && !KLINE_SCREENING_STATE.secondScreenedCodes.has(key) && stage.filter(stock);
    });
}

function buildKlineScreeningSnapshot(extra) {
    var stage = KLINE_SCREENING_STATE.currentStage;
    var snapshot = {
        themeKey: KLINE_SCREENING_STATE.themeKey,
        promptAction: KLINE_SCREENING_STATE.promptAction,
        round: KLINE_SCREENING_STATE.round,
        index: KLINE_SCREENING_STATE.index,
        stageIndex: KLINE_SCREENING_STATE.stageIndex,
        currentStageKey: stage ? stage.key : '',
        firstRoundSelected: KLINE_SCREENING_STATE.firstRoundSelected || [],
        selectedCodes: Array.from(KLINE_SCREENING_STATE.selectedCodes || []),
        secondScreenedCodes: Array.from(KLINE_SCREENING_STATE.secondScreenedCodes || []),
        completed: KLINE_SCREENING_STATE.round === 'completed',
        completed_at: KLINE_SCREENING_STATE.completedAt || ''
    };
    return Object.assign(snapshot, extra || {});
}

async function persistKlineScreeningState(extra) {
    try {
        await fetch('/api/ztorgj/kline-screening/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: _currentDate, state: buildKlineScreeningSnapshot(extra) })
        });
    } catch (e) {
        console.error('[ztorgj][kline][state] 保存失败:', e);
    }
}

async function loadKlineScreeningState() {
    updateKlineThemeButtons();
    try {
        var params = new URLSearchParams();
        if (_currentDate) params.set('date', _currentDate);
        var resp = await fetch('/api/ztorgj/kline-screening/state?' + params.toString());
        var result = await resp.json();
        if (result.success && result.exists && result.data) {
            restoreKlineScreeningState(result.data);
            return;
        }
    } catch (e) {
        console.error('[ztorgj][kline][state] 读取失败:', e);
    }
    startDirectSecondRoundScreening();
}

function restoreKlineScreeningState(saved) {
    KLINE_SCREENING_STATE.themeKey = saved.themeKey || 'tdxWhite';
    KLINE_SCREENING_STATE.index = Number(saved.index || 0);
    KLINE_SCREENING_STATE.stageIndex = Number(saved.stageIndex || 0);
    KLINE_SCREENING_STATE.firstRoundSelected = Array.isArray(saved.firstRoundSelected) ? saved.firstRoundSelected : [];
    KLINE_SCREENING_STATE.selectedCodes = new Set(Array.isArray(saved.selectedCodes) ? saved.selectedCodes : KLINE_SCREENING_STATE.firstRoundSelected.map(getStockKey));
    KLINE_SCREENING_STATE.secondScreenedCodes = new Set(Array.isArray(saved.secondScreenedCodes) ? saved.secondScreenedCodes : []);
    KLINE_SCREENING_STATE.completedAt = saved.completed_at || '';
    updateKlineThemeButtons();

    if (saved.completed || saved.round === 'completed') {
        KLINE_SCREENING_STATE.round = 'completed';
        showKlinePrompt('筛选完成', '上次筛选已全部完成。需要重新筛选请点击右上角“重新开始”。', 'completed');
        setText('klineStatus', '筛选完成');
        return;
    }


    if (saved.round === 'secondPrompt') {
        KLINE_SCREENING_STATE.round = 'secondPrompt';
        runNextSecondRoundPrompt();
        return;
    }

    if (saved.round === 'second') {
        KLINE_SCREENING_STATE.round = 'second';
        var stage = KLINE_SECOND_ROUND_STAGES[KLINE_SCREENING_STATE.stageIndex];
        if (stage) runKlineScreeningStage(stage.key); else completeKlineScreening();
        return;
    }

    startDirectSecondRoundScreening();
}

async function restartKlineScreening() {

        var params = new URLSearchParams();
        if (_currentDate) params.set('date', _currentDate);
        await fetch('/api/ztorgj/kline-screening/state?' + params.toString(), { method: 'DELETE' });

    var stock = KLINE_SCREENING_STATE.stocks[KLINE_SCREENING_STATE.index];
    var stage = KLINE_SCREENING_STATE.currentStage;
    if (!stock || !stage) return;

                name: stock.name,

                ref_gain: stock.ref_gain,
                today_change: getDisplayChangeValue(stock),
                market_cap: stock.market_cap,
                high_gain_10d_count: stock.high_gain_10d_count || stock.high_gain_count || 0,
                all_yin_up: isStockFlag(stock, 'all_yin_up'),
                all_yin_no_touch: isStockFlag(stock, 'all_yin_no_touch'),
                all_yin_cross_star: isStockFlag(stock, 'all_yin_cross_star'),
                layang: isStockFlag(stock, 'layang'),
                source_page: getTaskSourcePageName(),
                jipin_focus: true,
                focus_reason: stage.reason
            })
        });
        var result = await resp.json();
        if (!result.success) throw new Error(result.error || '添加极品关注失败');

    }

function skipKlineStock() {
    if (KLINE_SCREENING_STATE.round === 'second') {
        var stock = KLINE_SCREENING_STATE.stocks[KLINE_SCREENING_STATE.index];
        markSecondRoundScreened(stock);
    }
    advanceKlineStock();
}

function markSecondRoundScreened(stock) {
    var key = getStockKey(stock);
    if (key) KLINE_SCREENING_STATE.secondScreenedCodes.add(key);
}

function goPreviousKlineStock() {
    if (KLINE_SCREENING_STATE.index <= 0) {
        setText('klineStatus', '已经是当前阶段第一只');
        return;
    }
    KLINE_SCREENING_STATE.index -= 1;
    showKlineWorkbench();
    persistKlineScreeningState();
}

function advanceKlineStock() {
    KLINE_SCREENING_STATE.index += 1;
    if (KLINE_SCREENING_STATE.index >= KLINE_SCREENING_STATE.stocks.length) {
        if (KLINE_SCREENING_STATE.round === 'first') {
            KLINE_SCREENING_STATE.round = 'firstComplete';
            showKlinePrompt('第一轮筛选完成', '点击确定进入第二轮筛选。', 'enterSecondRound');
            persistKlineScreeningState();
            return;
        }
        KLINE_SCREENING_STATE.stageIndex += 1;
        persistKlineScreeningState();
        runNextSecondRoundPrompt();
        return;
    }
    showKlineWorkbench();
    persistKlineScreeningState();
}

function runNextSecondRoundPrompt() {
    KLINE_SCREENING_STATE.round = 'second';
    while (KLINE_SCREENING_STATE.stageIndex < KLINE_SECOND_ROUND_STAGES.length) {
        var stage = KLINE_SECOND_ROUND_STAGES[KLINE_SCREENING_STATE.stageIndex];
        KLINE_SCREENING_STATE.round = 'secondPrompt';
        KLINE_SCREENING_STATE.currentStage = stage;
        showKlinePrompt(stage.prompt, '', 'stage:' + stage.key);
        persistKlineScreeningState();
        return;
    }
    completeKlineScreening();
}

function completeKlineScreening() {
    KLINE_SCREENING_STATE.round = 'completed';
    KLINE_SCREENING_STATE.currentStage = null;
    KLINE_SCREENING_STATE.completedAt = new Date().toLocaleString('zh-CN', { hour12: false });
    showKlinePrompt('筛选完成', '所有轮次已经筛选完毕，完成状态已记录到 Redis。需要重新筛选请点击右上角“重新开始”。', 'completed');
    setText('klineStatus', '筛选完成');
    persistKlineScreeningState({ completed: true, completed_at: KLINE_SCREENING_STATE.completedAt });
}


function runKlineScreeningStage(stageKey) {
    var stage = KLINE_SECOND_ROUND_STAGES.find(function(item) { return item.key === stageKey; });
    if (!stage) return runNextSecondRoundPrompt();
    var stocks = loadSecondRoundStageSourceFromFields(stage);
    KLINE_SCREENING_STATE.round = 'second';
    KLINE_SCREENING_STATE.currentStage = stage;
    KLINE_SCREENING_STATE.stocks = stocks;
    KLINE_SCREENING_STATE.index = 0;
    if (!stocks.length) {
        KLINE_SCREENING_STATE.stageIndex += 1;
        persistKlineScreeningState();
        runNextSecondRoundPrompt();
        return;
    }
    showKlineWorkbench();
    persistKlineScreeningState();
}

function calcKlineMA(rows, period) {
    return rows.map(function(_, idx) {
        if (idx < period - 1) return null;
        var sum = 0;
        for (var i = idx - period + 1; i <= idx; i++) sum += Number(rows[i].close || 0);
        return +(sum / period).toFixed(2);
    });
}

function buildKlineOption(payload, variant) {
    var rows = payload.data || [];
    var theme = variant.theme;
    var dates = rows.map(function(r) { return r.date_label || r.trade_date; });
    var candleData = rows.map(function(r) { return [Number(r.open), Number(r.close), Number(r.low), Number(r.high)]; });
    var volumeData = rows.map(function(r, idx) {
        return {
            value: [idx, Number(r.vol || 0) / 10000],
            itemStyle: { color: Number(r.close) >= Number(r.open) ? theme.up : theme.down }
        };
    });
    var last = rows[rows.length - 1] || {};
    var title = `${payload.stock.name} ${payload.stock.code}  ${payload.start_date}-${payload.end_date}`;
    var sub = `收 ${Number(last.close || 0).toFixed(2)}  涨幅 ${Number(last.pct_chg || 0).toFixed(2)}%  高 ${Number(last.high || 0).toFixed(2)}  低 ${Number(last.low || 0).toFixed(2)}`;
    return {
        backgroundColor: theme.bg,
        animation: false,
        title: [
            { text: title, left: 12, top: 8, textStyle: { color: theme.text, fontSize: 15, fontWeight: 800 } },
            { text: sub, left: 12, top: 32, textStyle: { color: theme.subText, fontSize: 11, fontWeight: 500 } }
        ],
        legend: {
            top: 55, left: 10, itemWidth: 14, itemHeight: 8,
            textStyle: { color: theme.text, fontSize: 10 },
            data: ['K线', 'MA5', 'MA10', 'MA20']
        },
        tooltip: {
            trigger: 'axis', axisPointer: { type: 'cross' }, confine: true,
            formatter: function(params) {
                var p = params.find(function(x) { return x.seriesName === 'K线'; });
                if (!p) return '';
                var r = rows[p.dataIndex] || {};
                var pct = Number(r.pct_chg || 0);
                var pctColor = pct >= 0 ? theme.up : theme.down;
                return `${r.trade_date}<br/>开 ${Number(r.open).toFixed(2)}　高 ${Number(r.high).toFixed(2)}<br/>低 ${Number(r.low).toFixed(2)}　收 ${Number(r.close).toFixed(2)}<br/>涨幅 <span style="color:${pctColor};font-weight:900">${pct.toFixed(2)}%</span><br/>量 ${(Number(r.vol || 0) / 10000).toFixed(2)}万手`;
            }
        },
        axisPointer: { link: [{ xAxisIndex: 'all' }] },
        grid: [
            { left: 52, right: 72, top: 82, height: 340 },
            { left: 52, right: 72, top: 445, height: 72 }

async function renderCurrentStockKline() {
    var stock = KLINE_SCREENING_STATE.stocks[KLINE_SCREENING_STATE.index];
    var status = document.getElementById('klineStatus');
    var chartEl = document.getElementById('klineChartMain');
    if (!stock || !chartEl) return;
    if (typeof echarts === 'undefined') {
        setText('klineStatus', 'ECharts加载失败');
        return;
    }
    try {
        _klineCharts.forEach(function(chart) { try { chart.dispose(); } catch (e) {} });
        _klineCharts = [];
        setText('klineStatus', '正在加载K线...');
        var params = new URLSearchParams({ code: getKlineStockCode(stock), days: '30' });
        if (_currentDate) params.set('end_date', _currentDate);
        var resp = await fetch('/api/ztorgj/kline?' + params.toString());
        var payload = await resp.json();
        if (!payload.success) throw new Error(payload.error || 'K线数据加载失败');
        var chart = echarts.init(chartEl, null, { renderer: 'canvas' });
        chart.setOption(buildKlineOption(payload, currentKlineTheme()), true);
        _klineCharts.push(chart);
        if (status) status.textContent = `${payload.stock.name} ${payload.stock.code}：${payload.data.length}根K线`;
    } catch (e) {
        console.error('[ztorgj][kline] 渲染失败:', e);
        setText('klineStatus', '加载失败: ' + (e.message || e));
