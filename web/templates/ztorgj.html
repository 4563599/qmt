// ── 分组函数 ────────────────────────────────────────────────────────────

// 精确值分组（整数）
function groupByExact(sorted, key) {
    var map = new Map();
    sorted.forEach(function(s) {
        var v = s[key];
        if (!map.has(v)) map.set(v, []);
        map.get(v).push(s);
    });
    return Array.from(map.entries()).map(function(entry) { return { label: entry[0], stocks: entry[1] }; });
}

function groupByExactAsc(sorted, key) {
    var groups = groupByExact(sorted, key);
    groups.sort(function(a, b) { return Number(a.label || 0) - Number(b.label || 0); });
    return groups;
}

function groupByExactDesc(sorted, key) {
    var groups = groupByExact(sorted, key);
    groups.sort(function(a, b) { return Number(b.label || 0) - Number(a.label || 0); });
    return groups;
}

function groupAsSingleGroup(sorted) {
    return [{ label: '全部股票', stocks: sorted }];
}

function formatPctValue(v) {
    return Number(v || 0).toFixed(2) + '%';
}

function groupBreak20YinCountAsc(sorted) {
    return groupByExactAsc(sorted, 'yin_count_20');
}

function groupLsbpYin20Asc(sorted) {
    return groupByExactAsc(sorted, 'yin_count_20');
}

function groupLsbpYin10Asc(sorted) {
    return groupByExactAsc(sorted, 'yin_count_10d');
}

function groupBreak20YinSumByQuanyang(sorted) {
    var quanyangRows = [];
    var otherRows = [];
    (sorted || []).forEach(function(s) {
        if (isTrueFlag(s && s.is_quanyang_10d)) {
            quanyangRows.push(s);
        } else {
            otherRows.push(s);
        }
    });
    quanyangRows.sort(compareYinBodyPctSumAsc);
    otherRows.sort(compareYinBodyPctSumAsc);
    return [
        { label: '全阳', stocks: quanyangRows },
        { label: '阴线累加', stocks: otherRows }
    ];
}

function groupBreak20FiveRise(sorted) {
    var gainRows = (sorted || []).slice();
    var yinBodyRows = (sorted || []).slice();
    yinBodyRows.sort(compareYinBodyPctSumAsc);
    return [
        { label: '涨跌幅排序', stocks: gainRows },
        { label: '阴线累加排序', stocks: yinBodyRows, metricKey: 'yin_body_pct_sum_10d', metricLabel: '阴线累加', fmtVal: formatPctValue }
    ];
}

function groupByTopDayRefDrawdownNonZeroFirst(sorted) {
    var zeroRows = [];
    var nonZeroRows = [];
    (sorted || []).forEach(function(s) {
        var drawdown = Number(s.top_day_ref_max_drawdown_pct || 0);
        if (drawdown === 0) {
            zeroRows.push(s);
        } else {
            nonZeroRows.push(s);
        }
    });
    zeroRows.sort(compareDisplayGainDesc);
    nonZeroRows.sort(compareTopDayRefDrawdownGroups);
    var groups = [];
    if (nonZeroRows.length) groups.push({ label: '回撤非0', stocks: nonZeroRows });
    if (zeroRows.length) groups.push({ label: '回撤=0', stocks: zeroRows });
    return groups;
}

// 20日弱阴线分组，大于5的归为一组
function groupByWeakYin20(sorted, key) {
    var map = new Map();
    sorted.forEach(function(s) {
        var v = Number(s[key] || 0);
        var groupKey = v > 5 ? '>5' : v;
        if (!map.has(groupKey)) map.set(groupKey, []);
        map.get(groupKey).push(s);
    });
    var entries = Array.from(map.entries());
    entries.sort(function(a, b) {
        var av = a[0] === '>5' ? 999 : a[0];
        var bv = b[0] === '>5' ? 999 : b[0];
        return av - bv;
    });
    return entries.map(function(entry) {
        var label = entry[0] === '>5' ? '>5次' : entry[0] + '次';
        return { label: label, stocks: entry[1] };
    });
}

// ── 构建单列 DOM ────────────────────────────────────────────────────────
function buildColumn(col, groups) {
    var colDiv = document.createElement('div');
    colDiv.className = 'metric-column' + (col && col.extraClass ? ' ' + col.extraClass : '');
    if (col && col.mobileListOrder != null) {
        colDiv.setAttribute('data-mobile-list-order', String(col.mobileListOrder));
    }
    if (col && col.mobileGroupSwipe) {
        colDiv.classList.add('mobile-group-switch');
    }

    var header = document.createElement('div');
    header.className = 'col-header ' + col.cls;
    var headerLabel = col.label;
    if (col.cls === 'metric-bare') {
        headerLabel += '（共' + ((col.source || []).length) + '只）';
    }
    header.innerHTML = '<div class="col-header-main">' + headerLabel + '</div><div class="col-header-sub">' + col.sub + '</div>';
    if (_activeTab === 'huiche6' && col.filterId) {
        renderHuiche6ColumnFilters(header, col.filterId);
    }
    renderWeak20NewHighFilters(header, col);
    renderWeak20KlineExcelExport(header, col);
    colDiv.appendChild(header);

    var showDualCounts = (_activeTab === 'yin20' || _activeTab === 'weak20') && !(col && col.suppressDualCounts);
    var showCustomMetrics = Array.isArray(col.extraMetrics) && col.extraMetrics.length > 0;

    if (col.cls === 'metric-bare') {
        renderBareFootColumn(colDiv, col, showDualCounts);
        return colDiv;
    }

    if (!groups || groups.length === 0) {
        var nd = document.createElement('div');
        nd.className = 'no-data'; nd.textContent = '暂无数据';
        colDiv.appendChild(nd);
        return colDiv;
    }

    groups.forEach(function(group) {
        var shouldHighlightFocus = shouldHighlightYin20FocusGroup(col, group);
        var groupPanel = null;
        if (col && col.mobileGroupSwipe) {
            groupPanel = document.createElement('div');
            groupPanel.className = 'mobile-group-panel';
            groupPanel.setAttribute('data-mobile-group-title', formatGroupLabelText(col, group.label, group.stocks.length, group));
            colDiv.appendChild(groupPanel);
        }
        var baseHost = groupPanel || colDiv;
        var host = shouldHighlightFocus ? createFocusGroupHost() : baseHost;

        var labelDiv = document.createElement('div');
        labelDiv.className = 'group-label ' + col.cls;
        labelDiv.textContent = formatGroupLabelText(col, group.label, group.stocks.length, group);
        host.appendChild(labelDiv);

        var rowHeader = document.createElement('div');
        rowHeader.className = 'stock-row-header' + ((showDualCounts || showCustomMetrics) ? ' dual-counts' : '');
        rowHeader.innerHTML = showDualCounts
            ? '<span>名称</span><span>涨跌幅</span><span>20日阴线次数</span><span>20日弱阴线次数</span>'
            : (showCustomMetrics
                ? '<span>名称</span><span>涨跌幅</span>' + col.extraMetrics.map(function(metric) { return '<span>' + metric.label + '</span>'; }).join('')
                : '<span>名称</span><span>涨跌幅</span><span>' + getGroupMetricLabel(col, group) + '</span>');
        if (showCustomMetrics) {
            rowHeader.style.gridTemplateColumns = getMetricGridTemplate(col.extraMetrics.length, false);
        }
        host.appendChild(rowHeader);

        renderColumnStockRows(host, group.stocks, showDualCounts, col, group);

        if (shouldHighlightFocus) {
            baseHost.appendChild(host);
        }
    });

    return colDiv;
}

function buildBareFootMainGroups(stocks) {
    var groups = buildBareFootSubgroups(stocks);
    return [
        { label: groups[0].label, stocks: groups[0].stocks },
        { label: groups[1].label, stocks: groups[1].stocks }
    ];
}

function buildBareFootSubgroups(groupStocks) {
    var almostBareStocks = (groupStocks || []).filter(function(s) {
        return Number(s.is_bare_foot_yang || 0) === 1;
    });
    var bareOnlyStocks = (groupStocks || []).filter(function(s) {
        return Number(s.is_bare_foot || 0) === 1 && Number(s.is_bare_foot_yang || 0) !== 1;
    });
    return [
        { label: '几乎光脚阳线且最高涨幅>=7%', stocks: almostBareStocks },
        { label: '当日光脚阳线', stocks: bareOnlyStocks }
    ];
}

function buildGroupSubLabel(text) {
    var subLabel = document.createElement('div');
    subLabel.className = 'group-sub-label';
    subLabel.textContent = text;
    return subLabel;
}

function formatGroupLabelText(col, groupLabel, stockCount, group) {
    var labelText = typeof groupLabel === 'string' ? groupLabel : col.fmtLabel(groupLabel);
    labelText = labelText == null ? '' : String(labelText).trim();
    if (!labelText) labelText = '未分组';
    if (labelText === '全部股票') {
        return labelText + '  (' + stockCount + ')';
    }
    return (getGroupMetricLabel(col, group) || '') + '：' + labelText + '  (' + stockCount + ')';
}

function getGroupMetricKey(col, group) {
    return (group && group.metricKey) || (col && col.key);
}

function getGroupMetricLabel(col, group) {
    return (group && group.metricLabel) || (col && col.metricLabel);
}

function formatGroupMetricValue(col, group, stock) {
    var key = getGroupMetricKey(col, group);
    var value = stock ? stock[key] : null;
    if (group && typeof group.fmtVal === 'function') {
        return group.fmtVal(value, stock, group);
    }
    return col.fmtVal(value);
}

function buildSubgroupEmptyState(text) {
    var empty = document.createElement('div');
    empty.className = 'group-sub-empty';
    empty.textContent = text || '暂无数据';
    return empty;
}

function renderBareFootColumn(colDiv, col, showDualCounts) {
    var mainGroups = buildBareFootMainGroups(col.source);
    if (!mainGroups.some(function(group) { return (group.stocks || []).length > 0; })) {
        colDiv.appendChild(buildSubgroupEmptyState('暂无数据'));
        return;
    }
    mainGroups.forEach(function(bigGroup) {
        renderBareFootMainGroup(colDiv, col, bigGroup, showDualCounts);
    });
}

function renderBareFootMainGroup(colDiv, col, bigGroup, showDualCounts) {
    var mainGroupBox = document.createElement('div');
    mainGroupBox.className = 'bare-main-group';

    var mainGroupLabel = document.createElement('div');
    mainGroupLabel.className = 'group-sub-label';
    mainGroupLabel.textContent = bigGroup.label + '  (' + ((bigGroup.stocks || []).length) + ')';
    mainGroupBox.appendChild(mainGroupLabel);

    if (!bigGroup.stocks || !bigGroup.stocks.length) {
        mainGroupBox.appendChild(buildSubgroupEmptyState('该大组暂无数据'));
        colDiv.appendChild(mainGroupBox);
        return;
    }

    var sorted = bigGroup.stocks.slice().sort(function(a, b) {
        var tieAware = compareByTabMetricWithTieBreaker(_activeTab, a, b);
        if (tieAware !== 0) return tieAware;
        return col.asc ? (Number(a[col.key] || 0) - Number(b[col.key] || 0)) : (Number(b[col.key] || 0) - Number(a[col.key] || 0));
    });
    var groupFn = col.groupFn || (col.asc ? groupByExactAsc : groupByExactDesc);
    var smallGroups = groupFn(sorted, col.key);
    if (!smallGroups || !smallGroups.length) {
        mainGroupBox.appendChild(buildSubgroupEmptyState('该大组暂无数据'));
        colDiv.appendChild(mainGroupBox);
        return;
    }

    smallGroups.forEach(function(group) {
        var shouldHighlightFocus = shouldHighlightYin20FocusGroup(col, group);
        var host = shouldHighlightFocus ? createFocusGroupHost() : mainGroupBox;
        var showCustomMetrics = Array.isArray(col.extraMetrics) && col.extraMetrics.length > 0;

        var smallGroupLabel = document.createElement('div');
        smallGroupLabel.className = 'group-label ' + col.cls;
        smallGroupLabel.textContent = formatGroupLabelText(col, group.label, group.stocks.length);
        host.appendChild(smallGroupLabel);

        var rowHeader = document.createElement('div');
        rowHeader.className = 'stock-row-header' + ((showDualCounts || showCustomMetrics) ? ' dual-counts' : '');
        rowHeader.innerHTML = showDualCounts
            ? '<span>名称</span><span>涨跌幅</span><span>20日阴线次数</span><span>20日弱阴线次数</span>'
            : (showCustomMetrics
                ? '<span>名称</span><span>涨跌幅</span>' + col.extraMetrics.map(function(metric) { return '<span>' + metric.label + '</span>'; }).join('')
                : '<span>名称</span><span>涨跌幅</span><span>' + getGroupMetricLabel(col, group) + '</span>');
        if (showCustomMetrics) {
            rowHeader.style.gridTemplateColumns = getMetricGridTemplate(col.extraMetrics.length, false);
        }
        host.appendChild(rowHeader);

        if (group.stocks && group.stocks.length) {
            renderColumnStockRows(host, group.stocks, showDualCounts, col, group);
        } else {
            host.appendChild(buildSubgroupEmptyState('该小组暂无数据'));
        }

        if (shouldHighlightFocus) {
            mainGroupBox.appendChild(host);
        }
    });

    colDiv.appendChild(mainGroupBox);
}

function renderColumnStockRows(host, stocks, showDualCounts, col, group) {
    var orderedStocks = (col && col.preserveOrder) ? (stocks || []) : sortStocksByDisplayGain(stocks);
    var showCustomMetrics = Array.isArray(col.extraMetrics) && col.extraMetrics.length > 0;
    function formatExtraMetric(metric, stock) {
        if (!metric) return '';
        if (typeof metric.fmt === 'function') {
            return metric.fmt(stock[metric.key], stock, metric);
        }
        if (metric.key === 'cum_gain_20d_pct') {
            return Number(stock[metric.key] || 0).toFixed(2) + '%';
        }
        return stock[metric.key] == null ? '' : String(stock[metric.key]);
    }
    orderedStocks.forEach(function(s) {
        var row = document.createElement('div');
        row.className = 'stock-row' + ((showDualCounts || showCustomMetrics) ? ' dual-counts' : '');
        if (isFocusAlertStock(s)) row.classList.add('stock-row-focus-alert');
        row.dataset.stockCode = s.code || '';
        row.dataset.stockName = s.name || '';
        row.dataset.columnLabel = col && col.label || '';
        attachKlineEvents(row, s.code, s.name);
        row.addEventListener('contextmenu', function(e) { showTaskContextMenu(e, s); });

        var gain = getDisplayChangeValue(s, 'render-row');
        var gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
        var metricVal = s[getGroupMetricKey(col, group)];
        var metricDisplay = formatGroupMetricValue(col, group, s);
        var yinCount20 = Number(s.yin_count_20 || 0);
        var weakYin20 = Number(s.weak_yin_20d || 0);
        var customMetricDisplays = showCustomMetrics ? col.extraMetrics.map(function(metric) {
            return formatExtraMetric(metric, s);
        }) : [];
        if (shouldDebugStock(s)) {
            console.log('[ztorgj][debug][render-row]', {
                activeTab: _activeTab,
                currentDate: _currentDate,
                column: col && col.label,
                metricKey: col && col.key,
                metricValue: metricVal,
                code: s.code,
                name: s.name,
                gain: gain,
                today_change: s.today_change,
                ref_gain: s.ref_gain
            });
        }

        var nameHtml = renderFocusName(s);
        row.innerHTML = showDualCounts
            ? '<span class="s-name" title="' + s.code + ' ' + s.name + '">' + nameHtml + '</span>' +
              '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
              '<span class="s-metric">' + yinCount20 + '次</span>' +
              '<span class="s-metric">' + weakYin20 + '次</span>'
            : (showCustomMetrics
                ? '<span class="s-name" title="' + s.code + ' ' + s.name + '">' + nameHtml + '</span>' +
                  '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                  customMetricDisplays.map(function(display) { return '<span class="s-metric">' + display + '</span>'; }).join('')
                : '<span class="s-name" title="' + s.code + ' ' + s.name + '">' + nameHtml + '</span>' +
                  '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                  '<span class="s-metric">' + metricDisplay + '</span>');
        if (showCustomMetrics) {
            row.style.gridTemplateColumns = getMetricGridTemplate(col.extraMetrics.length, false);
        }

        host.appendChild(row);
    });
}

function shouldHighlightYin20FocusGroup(col, group) {
    if (_activeTab !== 'yin20' && _activeTab !== 'weak20') return false;
    if (!col || ['metric-all', 'metric-limit', 'metric-bare', 'metric-high', 'metric-5ls', 'zt-yin20', 'gj-yin20'].indexOf(col.cls) === -1) return false;
    var rawLabel = typeof group.label === 'string' ? group.label : String(group.label);
    var match = rawLabel.match(/\d+/);
    if (!match) return false;
    return _activeTab === 'weak20' ? Number(match[0]) <= 3 : Number(match[0]) <= 4;
}

            var gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
            var highGainCount = Number(s.high_gain_10d_count || 0);
            var yinCount20 = Number(s.yin_count_20 || 0);
            var weakYin20 = Number(s.weak_yin_20d || 0);

            row.innerHTML =
                '<span class="high-gain-name" title="' + s.code + ' ' + s.name + '">' + renderFocusName(s) + '</span>' +
                '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                '<span class="high-gain-count">' + highGainCount + '次</span>' +
                '<span class="high-gain-metric">' + yinCount20 + '次</span>' +
                '<span class="high-gain-metric">' + weakYin20 + '次</span>';

            groupDiv.appendChild(row);
        });

        body.appendChild(groupDiv);
    });

    section.appendChild(body);
    return section;
}

function buildYinPullTable(stocks) {
    var section = document.createElement('div');
    section.className = 'high-gain-section';

    var header = document.createElement('div');
    header.className = 'high-gain-header';
    header.innerHTML =
        '<div class="high-gain-title">最近10日最高涨幅>=6.85%次数>=5 且 阴前后拉</div>' +
        '<div class="high-gain-desc">仅显示 high_gain5_and_yin_pull = 1 的股票，按当前弱阴线 tab 分组</div>';
    section.appendChild(header);

    var body = document.createElement('div');
    body.className = 'high-gain-groups';

    var context = getWeakMetricContext();
    var key = context.key;
    var groupFn = context.groupFn;
    var metricLabel = context.metricLabel;

    var yinPullStocks = (stocks || []).filter(function(s) {
        return Number(s.high_gain5_and_yin_pull || 0) === 1;
    }).sort(function(a, b) {
        var tieAware = compareByTabMetricWithTieBreaker(_activeTab, a, b);
        if (tieAware !== 0) return tieAware;
        return Number(a[key] || 0) - Number(b[key] || 0);
    });

    var groups = groupFn(yinPullStocks, key);
    if (!groups || groups.length === 0) {
        body.innerHTML = '<div class="no-data">暂无符合条件股票</div>';
        section.appendChild(body);
        return section;
    }

    groups.forEach(function(group) {
        var shouldHighlightFocus = _activeTab === 'weak20' && isFocusGroupLabel(group.label);
        var groupDiv = shouldHighlightFocus ? createFocusGroupHost() : document.createElement('div');
        groupDiv.classList.add('high-gain-group');

        var groupLabel = document.createElement('div');
        groupLabel.className = 'high-gain-group-label';
        groupLabel.textContent = group.label + '  (' + group.stocks.length + ')';
        groupDiv.appendChild(groupLabel);

        var rowHeader = document.createElement('div');
        rowHeader.className = 'high-gain-row-header dual-counts';
        rowHeader.innerHTML =
            '<span>名称</span>' +
            '<span>涨幅</span>' +
            '<span>阴前后拉</span>' +
            '<span>20日阴线次数</span>' +
            '<span>20日弱阴线次数</span>';
        groupDiv.appendChild(rowHeader);

        sortStocksByDisplayGain(group.stocks).forEach(function(s) {
            var row = document.createElement('div');
            row.className = 'high-gain-row dual-counts';
            attachKlineEvents(row, s.code, s.name);
            row.addEventListener('contextmenu', function(e) { showTaskContextMenu(e, s); });

            var gain = getDisplayChangeValue(s);
            var gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
            var yinCount20 = Number(s.yin_count_20 || 0);
            var weakYin20 = Number(s.weak_yin_20d || 0);

            row.innerHTML =
                '<span class="high-gain-name" title="' + s.code + ' ' + s.name + '">' + s.name + '</span>' +
                '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
                '<span class="high-gain-count">是</span>' +
                '<span class="high-gain-metric">' + yinCount20 + '次</span>' +
                '<span class="high-gain-metric">' + weakYin20 + '次</span>';

            groupDiv.appendChild(row);
        });

        body.appendChild(groupDiv);
    });

    section.appendChild(body);
    return section;
}

function buildHuiche6AdjustNoBreakTable(stocks) {
    var section = document.createElement('div');
    section.className = 'metric-column';

    var header = document.createElement('div');
    header.className = 'col-header metric-high';
    header.innerHTML =
        '<div class="col-header-main">调整不破</div>';
    section.appendChild(header);

    var body = document.createElement('div');
    body.className = 'high-gain-groups';

    var matchedStocks = (stocks || []).filter(function(s) {
        return Number(s.adjust_no_break || 0) === 1
            && Number(s.high_gain_10d_count || 0) >= 3
            && Number(s.max_gain || 0) >= 6.50;
    });

    if (!matchedStocks.length) {
        body.innerHTML = '<div class="no-data">暂无符合条件股票</div>';
        section.appendChild(body);
        return section;
    }

    var rowHeader = document.createElement('div');
    rowHeader.className = 'high-gain-row-header dual-counts';
    rowHeader.innerHTML =
        '<span>名称</span>' +
        '<span>涨幅</span>' +
        '<span>高涨次数</span>' +
        '<span>累加最高百分比</span>' +
        '<span>调整时间</span>' +
        '<span>强调整K%</span>';
    rowHeader.style.gridTemplateColumns = getMetricGridTemplate(4, true);
    body.appendChild(rowHeader);

    sortStocksByDisplayGain(matchedStocks).forEach(function(s) {
        var row = document.createElement('div');
        row.className = 'high-gain-row dual-counts';
        row.dataset.stockCode = s.code || '';
        row.dataset.stockName = s.name || '';
        row.dataset.columnLabel = '调整不破';
        attachKlineEvents(row, s.code, s.name);
        row.addEventListener('contextmenu', function(e) { showTaskContextMenu(e, s); });

        var gain = getDisplayChangeValue(s);
        var gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
        var highGainCount = Number(s.high_gain_10d_count || 0);
        var cumHigh = Number(s.cum_high_to_ma5_pct || 0);
        var adjustDays = Number(s.days_since_top_day || 0);
        var strongAdjustPct = Number(s.strong_adjust_k_pct || 0);

        row.innerHTML =
            '<span class="high-gain-name" title="' + s.code + ' ' + s.name + '">' + s.name + '</span>' +
            '<span class="s-gain ' + gainClass + '">' + (gain > 0 ? '+' : '') + gain.toFixed(2) + '%</span>' +
            '<span class="high-gain-count">' + highGainCount + '</span>' +
            '<span class="high-gain-metric">' + cumHigh.toFixed(2) + '%</span>' +
            '<span class="high-gain-metric">' + adjustDays + '</span>' +
            '<span class="high-gain-metric">' + Math.round(strongAdjustPct) + '%</span>';
        row.style.gridTemplateColumns = getMetricGridTemplate(4, true);
        body.appendChild(row);
    });

    section.appendChild(body);
    return section;
}

function isFocusGroupLabel(label) {
    var rawLabel = typeof label === 'string' ? label : String(label);
    var match = rawLabel.match(/\d+/);
    if (!match) return false;
    return _activeTab === 'weak20' ? Number(match[0]) <= 3 : Number(match[0]) <= 4;
}

});
