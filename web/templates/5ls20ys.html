            <h1>5拉升20阴少</h1>
            <span class="badge" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">阴线分组</span>
            <span class="desc">10天拉升5次 · 20天阴线少 · 按阴线次数分组</span>
        </div>
        <div class="table-container">
            <div id="loading" class="loading">正在加载数据...</div>
            <div id="noData" class="no-data" style="display: none;">暂无数据</div>
            <table id="stockTable" style="display: none;">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>股票代码</th>
                        <th>股票名称</th>
                        <th>涨跌幅(%)</th>
                        <th>不下杀次数</th>
                        <th>拉升次数</th>
                        <th>20天阴线</th>
                        <th>10天光脚阳线</th>
                        <th>市值(亿)</th>
                        <th>预警时间</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let stocksData = [];
        let lastTimestamp = null;
        let currentDate = null;
        let availableDates = [];
        let currentDateIndex = 0;
        let marketCapCache = {};
        let fetchingMarketCap = {};

        // 最近交易日（非交易日时默认显示最近交易日数据）
        let latestTradeDate = new Date().toISOString().split('T')[0];
        async function fetchLatestTradeDate() {
            // 以"今天日期"为 key 缓存到 localStorage，次日 key 变化自动失效
            const todayKey = 'latestTradeDate_' + new Date().toISOString().split('T')[0];
            const cached = localStorage.getItem(todayKey);
            if (cached) { latestTradeDate = cached; return; }
            try {
                const resp = await fetch('/api/latest_trade_date');
                const result = await resp.json();
                if (result.success && result.date) {
                    latestTradeDate = result.date;
                    localStorage.setItem(todayKey, result.date);
                }
            } catch(e) {}
        }

        // 从localStorage加载今天的市值缓存
        function loadTodayMarketCapCache() {
            const today = new Date().toISOString().split('T')[0];
            const cacheKey = `marketCap_${today}`;
            const cached = localStorage.getItem(cacheKey);
            
            if (cached) {
                try {
                    marketCapCache = JSON.parse(cached);
                    console.log(`📦 从缓存加载了 ${Object.keys(marketCapCache).length} 个市值数据`);
                } catch (e) {
                    console.error('解析市值缓存失败:', e);
                    marketCapCache = {};
                }
            }
            
            // 清理旧的缓存（保留最近3天）
            const keysToDelete = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('marketCap_')) {
                    const cacheDate = key.replace('marketCap_', '');
                    const daysDiff = Math.floor((new Date() - new Date(cacheDate)) / (1000 * 60 * 60 * 24));
                    if (daysDiff > 3) {
                        keysToDelete.push(key);
                    }
                }
            }
            keysToDelete.forEach(key => localStorage.removeItem(key));
        }

        // 保存市值缓存到localStorage
        function saveTodayMarketCapCache() {
            const today = new Date().toISOString().split('T')[0];
            const cacheKey = `marketCap_${today}`;
            try {
                localStorage.setItem(cacheKey, JSON.stringify(marketCapCache));
            } catch (e) {
                console.error('保存市值缓存失败:', e);
            }
        }

        // 加载可用日期列表
        async function loadDates() {
            loadTodayMarketCapCache();
            await fetchLatestTradeDate(); // 先获取最近交易日
            try {
                const response = await fetch('/api/5ls20ys/dates');
                const result = await response.json();
                
                const today = latestTradeDate;
                currentDate = today;
                
                if (result.success && result.dates && result.dates.length > 0) {
                    availableDates = result.dates;
                    currentDateIndex = availableDates.indexOf(today);
                    if (currentDateIndex === -1) {
                        currentDateIndex = -1;
                    }
                } else {
                    availableDates = [];
                    currentDateIndex = -1;
                }
                
                initFlatpickr();
                loadStocks();
            } catch (error) {
                console.error('加载日期列表失败:', error);
                const today = latestTradeDate;
                currentDate = today;
                availableDates = [];
                currentDateIndex = -1;
                initFlatpickr();
                loadStocks();
            }
        }

        // Flatpickr实例
        let flatpickrInstance = null;

        // 初始化Flatpickr
        function initFlatpickr() {
            flatpickrInstance = flatpickr("#datePicker", {
                enable: availableDates,
                dateFormat: "Y-m-d",
                defaultDate: currentDate,
                locale: {
                    weekdays: {
                        shorthand: ['日', '一', '二', '三', '四', '五', '六'],
                        longhand: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']
                    },
                    months: {
                        shorthand: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                        longhand: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']
                    }
                },
                onChange: function(selectedDates, dateStr, instance) {
                    if (dateStr && dateStr !== currentDate) {
                        currentDate = dateStr;
                        currentDateIndex = availableDates.indexOf(dateStr);
                        loadStocks(currentDate);
                    }
                }
            });
        }

        // 更新Flatpickr可用日期
        function updateFlatpickrDates() {
            if (flatpickrInstance) {
                flatpickrInstance.set('enable', availableDates);
                flatpickrInstance.setDate(currentDate, false);
            }
        }

        // 上一个日期
        function prevDate() {
            if (currentDateIndex < availableDates.length - 1) {
                currentDateIndex++;
                currentDate = availableDates[currentDateIndex];
                if (flatpickrInstance) {
                    flatpickrInstance.setDate(currentDate, false);
                }
                loadStocks();
            }
        }

        // 下一个日期
        function nextDate() {
            if (currentDateIndex > 0) {
                currentDateIndex--;
                currentDate = availableDates[currentDateIndex];
                if (flatpickrInstance) {
                    flatpickrInstance.setDate(currentDate, false);
                }
                loadStocks();
            }
        }

        // 加载股票列表
        async function loadStocks() {
            try {
                const startTime = performance.now();
                const url = currentDate ? `/api/5ls20ys/stocks?date=${currentDate}` : '/api/5ls20ys/stocks';
                const response = await fetch(url);
                const result = await response.json();
                
                // 更新刷新间隔
                if (result.refresh_interval) {
                    updateRefreshInterval(result.refresh_interval);
                }
                
                // 显示性能指标
                if (result.performance) {
                    const loadTime = performance.now() - startTime;
                    console.log('📊 性能指标:');
                    console.log(`  - 后端总耗时: ${result.performance.total_time}`);
                    console.log(`  - 网络延迟: ${result.performance.network_latency}`);
                    console.log(`  - SCAN耗时: ${result.performance.scan_time}`);
                    console.log(`  - 解析耗时: ${result.performance.parse_time}`);
                    console.log(`  - 前端耗时: ${loadTime.toFixed(2)}ms`);
                    console.log(`  - 股票数量: ${result.performance.count}`);
                }
                
                console.log('🔍 loadStocks result:', result);
                console.log('🔍 data length:', result.data ? result.data.length : 0);
                
                if (result.success && result.data && result.data.length > 0) {
                    stocksData = result.data;
                    console.log('✅ 数据加载成功，股票数量:', stocksData.length);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('noData').style.display = 'none';
                    
                    // 立即渲染表格（先显示基础数据）
                    renderTable();
                    
                    // 为市值为0的股票获取市值（内部会批量渲染）
                    fetchMarketCapForZeroStocks();
                    
                    // 只有查看最近交易日数据时才刷新实时行情
                    const today = latestTradeDate;
                    if (currentDate === today) {
                        console.log('📡 [loadStocks] 准备刷新实时行情（今天数据）');
                        await refreshRealtime();
                        console.log('✅ [loadStocks] 实时行情刷新完成');
                    } else {
                        console.log('📅 [loadStocks] 查看历史数据，跳过实时行情刷新');
                    }
                } else {
                    console.log('❌ 没有数据');
                    stocksData = [];
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('noData').style.display = 'block';
                    renderTable(); // 清空表格
                }
            } catch (error) {
                console.error('加载股票列表失败:', error);
                document.getElementById('loading').textContent = '加载失败，请刷新页面重试';
            }
        }

        // 获取市值为0的股票的市值
        async function fetchMarketCapForZeroStocks() {
            const zeroMarketCapStocks = stocksData.filter(s => !s.market_cap || s.market_cap === 0);
            
            if (zeroMarketCapStocks.length === 0) {
                console.log('所有股票都有市值数据');
                return;
            }
            
            console.log(`发现 ${zeroMarketCapStocks.length} 个股票需要获取市值`);
            
            // 逐个获取市值（避免同时请求太多）
            for (const stock of zeroMarketCapStocks) {
                const code = stock.code;
                
                // 检查缓存
                if (marketCapCache[code]) {
                    stock.market_cap = marketCapCache[code];
                    continue;
                }
                
                // 避免重复获取
                if (fetchingMarketCap[code]) {
                    continue;
                }
                
                fetchingMarketCap[code] = true;
                
                try {
                    const response = await fetch(`/api/5ls20ys/market_cap/${code}`);
                    const result = await response.json();
                    
                    if (result.success && result.market_cap) {
                        stock.market_cap = result.market_cap;
                        marketCapCache[code] = result.market_cap;
                        saveTodayMarketCapCache(); // 保存到localStorage
                        console.log(`✓ 获取市值: ${stock.name} (${code}) = ${result.market_cap}亿`);
                        
                        // 重新渲染表格以显示最新市值
                        renderTable();
                    }
                } catch (error) {
                    console.error(`获取市值失败 ${code}:`, error);
                } finally {
                    delete fetchingMarketCap[code];
                }
                
                // 延迟200ms避免请求过快
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        // 刷新实时行情
        async function refreshRealtime() {
            // 如果查看历史数据，不刷新实时行情
            if (currentDateIndex !== 0) {
                console.log('📅 [refreshRealtime] 当前查看历史数据，跳过实时行情刷新');
                return;
            }
            
            if (stocksData.length === 0) return;
            
            try {
                const codes = stocksData.map(s => s.code);
                const response = await fetch('/api/5ls20ys/realtime', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ codes: codes })
                });
                
                const result = await response.json();
                
                if (result.success && result.data) {
                    // 检查是否有数据变化
                    let hasChange = false;
                    stocksData.forEach(stock => {
                        if (result.data[stock.code]) {
                            const newChange = result.data[stock.code].change;
                            if (stock.today_change !== newChange) {
                                stock.today_change = newChange;
                                hasChange = true;
                            }
                        }
                    });
                    
                    // 只有在数据变化时才重新渲染
                    if (hasChange) {
                        renderTable();
                    }
                }
                    
            } catch (error) {
                console.error('刷新实时行情失败:', error);
            }
        }

        // 渲染表格（分组显示）
        function renderTable() {
            console.log('🎨 开始渲染表格，股票数量:', stocksData.length);
            
            const tbody = document.getElementById('stockTableBody');
            const table = document.getElementById('stockTable');
            const loading = document.getElementById('loading');
            const noData = document.getElementById('noData');
            
            if (!tbody) {
                console.error('❌ 找不到 stockTableBody 元素！');
                return;
            }
            
            tbody.innerHTML = '';
            
            if (stocksData.length === 0) {
                table.style.display = 'none';
                noData.style.display = 'block';
                loading.style.display = 'none';
                return;
            }
            
            table.style.display = 'table';
            noData.style.display = 'none';
            loading.style.display = 'none';
            
            // 按预警时间排序，找出最新的5个股票
            const sortedByTime = [...stocksData].sort((a, b) => {
                const timeA = a.warning_time || '0';
                const timeB = b.warning_time || '0';
                return timeB.localeCompare(timeA);
            });
            
            // 按20天阴线次数分组（0-7次）
            const groups = {};
            for (let i = 0; i <= 7; i++) {
                groups[i] = [];
            }
            
            stocksData.forEach(stock => {
                const yinCount20 = stock.yin_count_20 || 0;
                console.log(`📦 股票 ${stock.code} ${stock.name} -> 20天阴线=${yinCount20}次`);
                
                if (yinCount20 >= 0 && yinCount20 <= 7) {
                    groups[yinCount20].push(stock);
                } else {
                    console.warn(`⚠️ 股票 ${stock.code} 阴线次数异常: ${yinCount20}`);
                }
            });
            
            console.log('📊 分组结果（按20天阴线次数）:');
            for (let i = 0; i <= 7; i++) {
                console.log(`  阴线${i}次: ${groups[i].length}只`);
            }
            
            // 定义分组顺序（0-7次）
            const groupOrder = [0, 1, 2, 3, 4, 5, 6, 7];
            
            let globalIndex = 0; // 全局序号
            
            // 按指定顺序渲染分组
            groupOrder.forEach(yinCount => {
                const groupData = groups[yinCount];
                if (!groupData || groupData.length === 0) {
                    return;
                }
                
                console.log(`✨ 渲染分组 阴线${yinCount}次, 股票数量: ${groupData.length}`);
                
                // 按涨跌幅排序
                groupData.sort((a, b) => (b.today_change || 0) - (a.today_change || 0));
                
                // 添加分组标题行
                const headerRow = document.createElement('tr');
                headerRow.className = 'group-header-row';
                headerRow.innerHTML = `
                    <td colspan="10" style="background: #F3F4F6; color: #374151; padding: 12px; font-weight: 600; font-size: 14px; text-align: left; border-bottom: 2px solid #E5E7EB;">
                        20天阴线=${yinCount}次 (${groupData.length}只)
                    </td>
                `;
                tbody.appendChild(headerRow);
                
                // 渲染该分组的股票
                groupData.forEach((stock, index) => {
                    globalIndex++;
                    const row = document.createElement('tr');
                    
                    // 添加鼠标悬停事件
                    row.addEventListener('mouseenter', (e) => showKline(e, stock.code, stock.name));
                    row.addEventListener('mouseleave', hideKline);
                    row.addEventListener('mousemove', moveTooltip);
                    
                    const change = stock.today_change || 0;
                    let changeClass = 'neutral';
                    if (change > 0) {
                        changeClass = 'positive';
                    } else if (change < 0) {
                        changeClass = 'negative';
                    }
                    
                    // 判断是否为最新5个股票
                    const newIndex = sortedByTime.findIndex(s => s.code === stock.code);
                    const isNew = newIndex < 5;
                    const badge = isNew ? `<span class="new-badge">${newIndex + 1}</span>` : '';
                    
                    const strategies = Array.isArray(stock.strategies) ? stock.strategies : [];
                    const strategiesHtml = strategies.map(s => 
                        `<span class="strategy-tag">${s}</span>`
                    ).join('');
                    
                    row.innerHTML = `
                        <td>${globalIndex}</td>
                        <td>${stock.code}</td>
                        <td class="stock-cell"><span class="stock-name">${stock.name}${badge}</span></td>
                        <td class="${changeClass}">${change > 0 ? '+' : ''}${change.toFixed(2)}%</td>
                        <td>${stock.no_xs_num_10 || 0}</td>
                        <td>${stock.pull_count_10 || 0}</td>
                        <td>${stock.yin_count_20 || 0}</td>
                        <td>${stock.bare_foot_yang_count_10 || 0}</td>
                        <td><span data-market-cap-code="${stock.code}" data-market-cap-decimals="2" data-market-cap-unit="">${(stock.market_cap || 0).toFixed(2)}</span></td>
                        <td>${stock.time || stock.warning_time || '-'}</td>
                    `;
                    
                    tbody.appendChild(row);
                });
            }); // 结束 groupOrder.forEach
            
            console.log('🎨 [renderTable] 渲染完成');
        }

        // 动态刷新间隔（毫秒）
        let checkUpdateInterval = 3000; // Redis检查间隔，默认3秒
        let realtimeRefreshInterval = 3000; // 涨跌幅刷新间隔，固定3秒
        let checkUpdateTimer = null;
        let refreshRealtimeTimer = null;

        // 更新Redis检查间隔
        function updateRefreshInterval(newInterval) {
            if (newInterval && checkUpdateInterval !== newInterval * 1000) {
                const oldInterval = checkUpdateInterval / 1000;
                checkUpdateInterval = newInterval * 1000;
                const realtimeSeconds = realtimeRefreshInterval / 1000;
                
                // 控制台日志
                console.log(`⏱️ Redis检查间隔变更: ${oldInterval}秒 → ${newInterval}秒`);
                console.log(`📊 当前设置: Redis检查=${newInterval}秒, 涨跌幅刷新=${realtimeSeconds}秒`);
                
                // 重启Redis检查定时器
                restartCheckUpdateTimer();
            }
        }

        // 重启Redis检查定时器
        function restartCheckUpdateTimer() {
            if (checkUpdateTimer) clearInterval(checkUpdateTimer);
            checkUpdateTimer = setInterval(checkUpdate, checkUpdateInterval);
            console.log(`✅ Redis检查定时器已重启，间隔: ${checkUpdateInterval/1000}秒`);
        }

        // 启动涨跌幅刷新定时器（固定3秒）
        function startRealtimeRefreshTimer() {
            if (refreshRealtimeTimer) clearInterval(refreshRealtimeTimer);
            refreshRealtimeTimer = setInterval(refreshRealtime, realtimeRefreshInterval);
            console.log(`✅ 涨跌幅刷新定时器已启动，间隔: ${realtimeRefreshInterval/1000}秒`);
        }

        // 检查Redis更新（基于时间戳）
        async function checkUpdate() {
            // 只在查看最近交易日数据时才检查更新
            const today = latestTradeDate;
            if (currentDate !== today) {
                // console.log('📅 当前查看的不是今天的数据，跳过自动更新检查');
                return;
            }
            
            try {
                const response = await fetch('/api/5ls20ys/check_update');
                const result = await response.json();
                
                // 更新刷新间隔
                if (result.refresh_interval) {
                    updateRefreshInterval(result.refresh_interval);
                }
                
                if (result.success && result.updated) {
                    const newTimestamp = result.timestamp;
                    const newCount = result.count || 0;
                    
                    // 如果是第一次获取时间戳，直接记录
                    if (lastTimestamp === null) {
                        lastTimestamp = newTimestamp;
                        console.log('初始时间戳:', newTimestamp);
                        console.log('初始股票数量:', newCount);
                    } 
                    // 如果时间戳变化了，说明数据更新了
                    else if (newTimestamp !== lastTimestamp) {
                        console.log('检测到数据更新!');
                        console.log('旧时间戳:', lastTimestamp);
                        console.log('新时间戳:', newTimestamp);
                        console.log('股票数量:', newCount);
                        
                        lastTimestamp = newTimestamp;
                        
                        // 重新加载当前日期的数据
                        await loadStocks(currentDate);
                    }
                    // 如果时间戳相同，但股票数量为0，也要刷新页面
                    else if (newCount === 0 && stocksData.length > 0) {
                        console.log('⚠️ 检测到数据被清空!');
                        lastTimestamp = newTimestamp;
                        await loadStocks(currentDate);
                    }
                } else if (result.success && !result.updated) {
                    // 如果没有数据（返回updated=false且timestamp为null）
                    // 只有在当前有数据的情况下才清空，避免重复清空
                    if (result.timestamp === null && stocksData.length > 0 && lastTimestamp !== null) {
                        console.log('⚠️ Redis中没有今天的数据，清空页面显示');
                        lastTimestamp = null;
                        stocksData = [];
                        renderTable();
                    }
                }
            } catch (error) {
                console.error('检查更新失败:', error);
            }
        }

        // 初始化
        loadDates();

        // 启动定时器
        checkUpdateTimer = setInterval(checkUpdate, checkUpdateInterval);
        refreshRealtimeTimer = setInterval(refreshRealtime, realtimeRefreshInterval);
        
        console.log('🚀 5拉升20阴少页面初始化完成');
        console.log(`📊 Redis检查间隔: ${checkUpdateInterval/1000}秒`);
        console.log(`📊 涨跌幅刷新间隔: ${realtimeRefreshInterval/1000}秒`);

        // K线图相关功能
        const tooltip = document.getElementById('klineTooltip');
        const klineImg = document.getElementById('klineImage');

        // 获取东方财富前缀
        function getEastMoneyPrefix(code) {
            return code.startsWith('6') ? '1' : '0';
        }

        // 显示K线图
        function showKline(e, code, name) {
            const emPrefix = getEastMoneyPrefix(code);
            klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${emPrefix}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
            tooltip.querySelector('.tooltip-header').innerText = `${name} (${code}) - 日K线`;
            moveTooltip(e);
            tooltip.style.display = 'block';
        }

        // 隐藏K线图
        function hideKline() {
            tooltip.style.display = 'none';
            klineImg.src = '';
        }

        // 移动提示框
        function moveTooltip(e) {
            const isMobile = window.innerWidth <= 768;
            const tooltipWidth = isMobile ? Math.min(400, window.innerWidth * 0.95) : 565;
            const tooltipHeight = isMobile ? 250 : 330;
            let left = e.clientX + 15;
            let top = e.clientY + 15;

            if (left + tooltipWidth > window.innerWidth) {
                left = e.clientX - tooltipWidth - 15;
            }
            if (top + tooltipHeight > window.innerHeight) {
                top = e.clientY - tooltipHeight - 15;
            }
            if (left < 0) left = 10;
            if (top < 0) top = 10;

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }
    </script>

<div id="ios-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:99999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:14px;width:270px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.25);">
        <div id="ios-modal-msg" style="padding:20px 16px 14px;text-align:center;font-size:16px;font-weight:600;color:#000;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:70px;"></div>
        <div style="height:0.5px;background:#c6c6c8;"></div>
        <div style="display:flex;height:44px;">
            <button id="ios-modal-no" style="flex:1;background:none;border:0;outline:none;font-size:17px;color:#ff3b30;cursor:pointer;">否</button>
            <div id="ios-modal-divider" style="width:0.5px;background:#c6c6c8;flex-shrink:0;"></div>
            <button id="ios-modal-yes" style="flex:1;background:none;border:0;outline:none;font-size:17px;color:#007aff;cursor:pointer;font-weight:600;">是</button>
        </div>
    </div>
</div>
<script>
function showIosConfirm(msg) {
    return new Promise(resolve => {
        const ov = document.getElementById('ios-modal-overlay');
        document.getElementById('ios-modal-msg').textContent = msg;
        const noBtn = document.getElementById('ios-modal-no');
        const yesBtn = document.getElementById('ios-modal-yes');
        noBtn.style.display = '';
        noBtn.textContent = '否';
        yesBtn.textContent = '是';
        document.getElementById('ios-modal-divider').style.display = '';
        ov.style.display = 'flex';
        const done = r => { ov.style.display = 'none'; resolve(r); };
        noBtn.onclick = () => done(false);
        yesBtn.onclick = () => done(true);
    });
}
function showIosAlert(msg) {
    return new Promise(resolve => {
        const ov = document.getElementById('ios-modal-overlay');
        document.getElementById('ios-modal-msg').textContent = msg;
        const noBtn = document.getElementById('ios-modal-no');
        const yesBtn = document.getElementById('ios-modal-yes');
        noBtn.style.display = 'none';
        document.getElementById('ios-modal-divider').style.display = 'none';
        yesBtn.textContent = '确定';
        ov.style.display = 'flex';
        yesBtn.onclick = () => { ov.style.display = 'none'; noBtn.style.display = ''; document.getElementById('ios-modal-divider').style.display = ''; resolve(); };
    });
}
</script>
<script src="{{ url_for('static', filename='async-market-cap.js') }}"></script>
<script>
window.initAsyncMarketCapRefresh({
    dataStores: [() => stocksData]
});
</script>
