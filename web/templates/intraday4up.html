<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连续4天拉升</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #ffffff; min-height: 100vh; padding: 20px; margin: 0;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .nav-buttons { margin-bottom: 10px; display: flex; justify-content: flex-start; align-items: center; gap: 15px; flex-wrap: wrap; }
        .nav-left { display: flex; gap: 10px; align-items: center; }
        .nav-right { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-start; }
        .nav-btn {
            display: inline-block; padding: 5px 9px; color: white; text-decoration: none;
            border-radius: 8px; transition: all 0.3s; font-size: 13px; font-weight: 500;
            letter-spacing: 0.1px; white-space: nowrap; flex-shrink: 0;
        }
        .nav-btn-home { background: #667eea; }
        .nav-btn-home:hover { background: #5568d3; transform: translateY(-2px); }
        .nav-btn-ztqhp { background: #2563eb; }
        .nav-btn-ztqhp:hover { background: #1d4ed8; transform: translateY(-2px); }
        .nav-btn-yhy { background: #e11d48; }
        .nav-btn-yhy:hover { background: #be123c; transform: translateY(-2px); }
        .nav-btn-yx205 { background: #06b6d4; }
        .nav-btn-yx205:hover { background: #0891b2; transform: translateY(-2px); }
        .nav-btn-ztorgj { background: #d946ef; }
        .nav-btn-ztorgj:hover { background: #c026d3; transform: translateY(-2px); }
        .nav-btn-lszty { background: #e11d48; }
        .nav-btn-lszty:hover { background: #be123c; transform: translateY(-2px); }
        .nav-btn-intraday4up { background: #f97316; }
        .nav-btn-intraday4up:hover { background: #ea580c; transform: translateY(-2px); }

        .date-selector { display: flex; align-items: center; gap: 6px; background: white; padding: 4px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .date-nav-btn { background: #f97316; color: white; border: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s; font-weight: 500; min-width: 28px; display: flex; align-items: center; justify-content: center; }
        .date-nav-btn:hover { background: #ea580c; transform: scale(1.05); }
        .date-nav-btn:disabled { background: #ccc; cursor: not-allowed; transform: scale(1); }
        #datePicker { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; width: auto; min-width: 95px; max-width: 105px; }

        .page-title { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .page-title h1 { font-size: 22px; font-weight: 700; color: #1d1d1f; margin: 0; }
        .page-title .badge { color: white; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .page-title .desc { color: #6b7280; font-size: 13px; }
        .page-title .count-badge { background: #fff7ed; color: #ea580c; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid #fed7aa; }
        .scan-info-text { color: #ea580c; font-size: 13px; font-weight: 700; }

        .columns-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            justify-content: start;
            align-items: start;
            gap: 12px;
            min-width: 0;
        }
        .metric-column {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border: 1px solid #e0e0e0;
            min-width: 0;
        }
        .col-header {
            padding: 9px 8px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .col-header.eq-three { background: linear-gradient(135deg, #f97316, #ea580c); }
        .col-header-sub { font-size: 11px; font-weight: 400; opacity: 0.85; margin-top: 2px; }

        .stock-row-header {
            display: grid;
            grid-template-columns: 1.9fr 1fr 1fr;
            padding: 3px 6px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .stock-row-header span { font-size: 10px; font-weight: 600; color: #86868b; text-align: center; }

        .stock-row {
            display: grid;
            grid-template-columns: 1.9fr 1fr 1fr;
            align-items: center;
            padding: 6px 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.15s;
        }
        .stock-row:hover { background: #f8f9fa; }
        .stock-row:last-child { border-bottom: none; }
        .stock-name { display: flex; flex-direction: column; align-items: center; min-width: 0; }
        .s-name { font-size: 13px; font-weight: 500; color: #1d1d1f; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .s-code { font-size: 10px; color: #86868b; margin-top: 1px; }
        .s-extra { font-size: 10px; color: #6b7280; margin-top: 1px; text-align: center; }
        .s-gain { font-size: 13px; font-weight: 700; text-align: center; }
        .s-metric { font-size: 12px; font-weight: 700; text-align: center; color: #374151; }
        .positive { color: #e74c3c; }
        .negative { color: #2563eb; }
        .neutral  { color: #95a5a6; }
        .good { color: #2563eb; }
        .extra { color: #7c3aed; font-weight: 700; }

        .no-data { padding: 12px 8px; font-size: 12px; color: #bbb; text-align: center; }
        .loading-msg { text-align: center; padding: 40px; color: #666; font-size: 14px; }
        .stock-tooltip { position: fixed; display: none; background: #fff; border: 1px solid #e1e1e1; border-radius: 8px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 10000; pointer-events: none; }
        .stock-tooltip img { display: block; width: 680px; height: 380px; background: #f5f5f7; }
        .stock-tooltip .tooltip-header { font-size: 12px; color: #666; margin-bottom: 5px; text-align: center; }

        @media (max-width: 1200px) {
            .nav-left, .nav-right { width: 100%; justify-content: center; }
            .nav-buttons { flex-wrap: wrap; }
            .columns-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            body { padding: 10px; overflow-x: hidden; }
            .nav-btn { flex: 1 1 calc(50% - 4px); min-width: 0; padding: 8px 6px; font-size: 12px; white-space: normal; word-break: keep-all; line-height: 1.3; text-align: center; }
            .columns-grid { grid-template-columns: 1fr; }
            .stock-tooltip img { width: 100%; max-width: 600px; height: auto; }
            .container, .columns-grid, .metric-column { max-width: 100%; overflow-x: hidden !important; }
            .stock-row-header span, .stock-row span, .stock-name, .s-name, .nav-btn { white-space: normal !important; word-break: break-all; overflow-wrap: anywhere; }
            #datePicker { min-width: 0 !important; width: 100%; max-width: 100%; }
            .date-selector { width: 100%; justify-content: center; flex-wrap: wrap; }
            .page-title { padding: 10px 12px; gap: 6px; }
            .page-title h1 { font-size: 18px; }
            .page-title .desc, .page-title .count-badge, .page-title .badge, .scan-info-text { font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="stock-tooltip" id="klineTooltip">
    <div class="tooltip-header" id="klineTtHeader"></div>
    <img id="klineImage" src="" alt="K线图">
</div>

<div class="container">
    <div class="nav-buttons">
        <div class="nav-left">
            <div class="date-selector">
                <button class="date-nav-btn" id="prevDateBtn" onclick="prevDate()">◀</button>
                <input type="text" id="datePicker" placeholder="选择日期" readonly>
                <button class="date-nav-btn" id="nextDateBtn" onclick="nextDate()">▶</button>
            </div>
        </div>
        <div class="nav-right">
            <a href="/" class="nav-btn nav-btn-home">首页</a>
            <a href="/涨停前横盘" class="nav-btn nav-btn-ztqhp">涨停前横盘</a>
            <a href="/阴后强" class="nav-btn nav-btn-yhy">阴后强</a>
            <a href="/5拉升" class="nav-btn" style="background:#2563eb;">5拉升</a>
            <a href="/20阴少跌少横盘" class="nav-btn nav-btn-yx205">20阴少跌少横盘</a>
            <a href="/阴线跌破5日次数" class="nav-btn" style="background:#ca8a04;">阴线跌破5日次数</a>
            <a href="/10天大5日线" class="nav-btn" style="background:#0f766e;">10天大5日线</a>
            <a href="/涨停或光脚" class="nav-btn nav-btn-ztorgj">涨停或光脚</a>
            <a href="/连续5不碰" class="nav-btn" style="background:#f43f5e;">连续5不碰</a>
            <a href="/连续涨停" class="nav-btn nav-btn-lszty">连续涨停</a>
            <a href="/连续4天拉升" class="nav-btn nav-btn-intraday4up" style="font-weight:700;">连续4天拉升</a>
            <a href="/极品关注" class="nav-btn" style="background:#f59e0b;">极品关注</a>
            <a href="/同花顺板块" class="nav-btn" style="background:#2563eb;">同花顺板块</a>
        </div>
    </div>

    <div class="page-title">
        <h1>连续4天拉升</h1>
        <span class="badge" style="background: linear-gradient(135deg, #f97316, #ea580c);">盘中拉升</span>
        <span class="desc">Redis: intraday4up:{yyyymmdd} · 按4日涨幅由小到大排序</span>
        <span class="count-badge" id="totalCount">加载中...</span>
        <span class="scan-info-text" id="scanInfoText">扫描耗时--s，上次扫描时间:--</span>
    </div>

    <div id="mainContent">
        <div class="loading-msg">正在加载数据...</div>
    </div>
</div>

<script>
let _stocks = [];
let _currentDate = null;
let _availableDates = [];
let _currentDateIndex = 0;
let _flatpickrInstance = null;
let _scanInfo = null;
let _lastTimestamp = null;
let _redisKey = 'intraday4up:{yyyymmdd}';

const tooltip = document.getElementById('klineTooltip');
const klineImg = document.getElementById('klineImage');
function getPrefix(code) { return String(code || '').startsWith('6') ? '1' : '0'; }
function showKline(e, code, name) {
    klineImg.src = `https://webquoteklinepic.eastmoney.com/GetPic.aspx?nid=${getPrefix(code)}.${code}&imageType=KXL&token=44c9d251add88e27b65ed86506f6e5da&at=1`;
    document.getElementById('klineTtHeader').innerText = `${name} (${code}) - 日K线`;
    moveTooltip(e);
    tooltip.style.display = 'block';
}
function hideKline() { tooltip.style.display = 'none'; klineImg.src = ''; }
function moveTooltip(e) {
    const w = window.innerWidth <= 768 ? Math.min(400, window.innerWidth * 0.95) : 565;
    const h = window.innerWidth <= 768 ? 250 : 330;
    let left = e.clientX + 15, top = e.clientY + 15;
    if (left + w > window.innerWidth) left = e.clientX - w - 15;
    if (top + h > window.innerHeight) top = e.clientY - h - 15;
    if (left < 0) left = 10;
    if (top < 0) top = 10;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
}

async function loadDates() {
    try {
        const resp = await fetch('/api/intraday4up/dates');
        const result = await resp.json();
        if (result.success && result.dates && result.dates.length > 0) {
            _availableDates = result.dates;
            _currentDate = _availableDates[0];
            _currentDateIndex = 0;
        }
    } catch (e) {}
    initFlatpickr();
    await loadStocks();
}

function initFlatpickr() {
    _flatpickrInstance = flatpickr('#datePicker', {
        enable: _availableDates,
        dateFormat: 'Y-m-d',
        defaultDate: _currentDate,
        appendTo: document.body,
        onChange: function(selectedDates, dateStr) {
            if (dateStr && dateStr !== _currentDate) {
                _currentDate = dateStr;
                _currentDateIndex = _availableDates.indexOf(dateStr);
                loadStocks();
            }
        }
    });
}

function prevDate() {
    if (_currentDateIndex < _availableDates.length - 1) {
        _currentDateIndex++;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

function nextDate() {
    if (_currentDateIndex > 0) {
        _currentDateIndex--;
        _currentDate = _availableDates[_currentDateIndex];
        if (_flatpickrInstance) _flatpickrInstance.setDate(_currentDate, false);
        loadStocks();
    }
}

async function loadStocks() {
    document.getElementById('mainContent').innerHTML = '<div class="loading-msg">正在加载数据...</div>';
    document.getElementById('totalCount').textContent = '加载中...';
    updateScanInfoDisplay(null);
    try {
        const url = _currentDate ? `/api/intraday4up/stocks?date=${_currentDate}` : '/api/intraday4up/stocks';
        const resp = await fetch(url);
        const result = await resp.json();
        if (result.success) {
            _stocks = result.data || [];
            _scanInfo = result.scan_info || null;
            _redisKey = result.redis_key || (_currentDate ? `intraday4up:${_currentDate.replaceAll('-', '')}` : 'intraday4up:{yyyymmdd}');
            document.getElementById('totalCount').textContent = `共 ${_stocks.length} 只`;
            updateScanInfoDisplay(_scanInfo);
            renderColumns(_stocks);
        } else {
            document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败</div>';
            document.getElementById('totalCount').textContent = '加载失败';
        }
    } catch (e) {
        document.getElementById('mainContent').innerHTML = '<div class="loading-msg">加载失败: ' + e.message + '</div>';
        document.getElementById('totalCount').textContent = '加载失败';
    }
}

function formatPct(value) {
    const n = Number(value || 0);
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

function formatScanDuration(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '--';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return n.toFixed(3).replace(/\.?0+$/, '');
}

function formatScanEndTime(value) {
    if (!value) return '--';
    const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
    if (!match) return String(value);
    return `${Number(match[2])}月${Number(match[3])}日${Number(match[4])}点${Number(match[5])}分${Number(match[6])}秒`;
}

function updateScanInfoDisplay(scanInfo) {
    const el = document.getElementById('scanInfoText');
    if (!el) return;
    if (!scanInfo) {
        el.textContent = '扫描耗时--s，上次扫描时间:--';
        return;
    }
    const durationText = formatScanDuration(scanInfo.last_scan_duration_sec);
    const timeText = formatScanEndTime(scanInfo.last_scan_end_time);
    el.textContent = `扫描耗时${durationText}s，上次扫描时间:${timeText}`;
}

function renderColumns(stocks) {
    const safeStocks = Array.isArray(stocks) ? stocks.slice() : [];
    safeStocks.sort(function(a, b) {
        const gainDiff = Number(a.gain_4d_pct || 0) - Number(b.gain_4d_pct || 0);
        if (gainDiff !== 0) return gainDiff;
        return String(a.code || '').localeCompare(String(b.code || ''));
    });

    const grid = document.createElement('div');
    grid.className = 'columns-grid';
    grid.appendChild(buildColumn({
        title: _redisKey,
        sub: '按 gain_4d_pct 由小到大排序',
        cls: 'eq-three',
        stocks: safeStocks
    }));

    document.getElementById('mainContent').innerHTML = '';
    document.getElementById('mainContent').appendChild(grid);
}

function buildColumn(col) {
    const card = document.createElement('div');
    card.className = 'metric-column';

    const header = document.createElement('div');
    header.className = 'col-header ' + col.cls;
    header.innerHTML = col.title + '<div class="col-header-sub">' + col.sub + '</div>';
    card.appendChild(header);

    const stocks = col.stocks || [];
    if (stocks.length === 0) {
        const nd = document.createElement('div');
        nd.className = 'no-data';
        nd.textContent = '暂无数据';
        card.appendChild(nd);
        return card;
    }

    const rowHeader = document.createElement('div');
    rowHeader.className = 'stock-row-header';
    rowHeader.innerHTML = '<span>名称</span><span>涨跌幅</span><span>4天累计涨幅</span>';
    card.appendChild(rowHeader);

    stocks.forEach(function(s) {
        const row = document.createElement('div');
        row.className = 'stock-row';
        row.addEventListener('mouseenter', function(e) { showKline(e, s.code, s.name); });
        row.addEventListener('mouseleave', hideKline);
        row.addEventListener('mousemove', moveTooltip);

        const gain = Number(s.gain_4d_pct || 0);
        const change = Number(s.today_change || 0);
        const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : 'neutral';
        const gainClass = gain > 0 ? 'positive' : gain < 0 ? 'negative' : 'neutral';
        row.innerHTML =
            '<div class="stock-name"><span class="s-name" title="' + s.code + ' ' + s.name + '">' + s.name + '</span><span class="s-code">' + s.code + '</span><span class="s-extra">通过 ' + Number(s.pass_days || 0) + ' 天</span></div>' +
            '<span class="s-gain ' + changeClass + '">' + formatPct(change) + '</span>' +
            '<span class="s-gain ' + gainClass + '">' + formatPct(gain) + '</span>';
        card.appendChild(row);
    });

    return card;
}

loadDates();

setInterval(async function() {
    if (!_currentDate) return;
    const today = new Date().toISOString().split('T')[0];
    if (_currentDate !== today) return;
    try {
        const resp = await fetch('/api/intraday4up/check_update');
        const result = await resp.json();
        if (result.success && result.updated) {
            const ts = result.timestamp;
            if (_lastTimestamp === null) _lastTimestamp = ts;
            else if (ts !== _lastTimestamp) {
                _lastTimestamp = ts;
                await loadStocks();
            }
        }
    } catch (e) {}
}, 5000);
</script>
</body>
</html>
